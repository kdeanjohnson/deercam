<!doctype html>

<title>DeerDar</title>

<link rel="icon" href="/static/brand/icons/logo-mark-black.svg">
<link rel="preload" as="image" href="/static/brand/loader.gif">
<script>
  // Dark unless chosen in Settings; System follows the device. Set before the first paint so nothing flashes.
  function setTheme(t) {
    const light = t === 'light' || t === 'system' && matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    document.querySelector('meta[name=theme-color]').content = light ? '#ffffff' : '#0f1312';
    const logo = document.querySelector('.brand img');
    if (logo) logo.src = `/static/brand/icons/logo-mark-signal-${light ? 'black' : 'white'}.svg`;
  }
  setTheme(localStorage.getItem('theme'));
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => setTheme(localStorage.getItem('theme')));
</script>
<style>
  /* dark by default: warm charcoal with a forest-green accent; light is the same with the earlier bright palette */
  :root {
    --bg:#0f1312; --soft:#171c1a; --soft2:#212826; --ink:#e9ece9; --ink2:#8e9893; --line:#242b28; --card:#141918; --on-ink:#0f1312;

    --radius:16px; --nav-h:64px;

  }

                 border:0; border-radius:18px; padding:7px 28px 7px 12px; font-size:13px; font-weight:600; max-width:48vw; }

  /* ---- review */

  .review .rv-photo { position:relative; background:#111; }

  .cmp-strip img.cur { opacity:1; border-color:var(--accent); }

  .cand { flex:0 0 92px; border:0; background:none; padding:0; text-align:center; }

  .cand.sel img, .cand.sel .plus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .cand b { display:block; font-size:14px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand small { color:var(--ink2); font-size:12px; }
  .cand small.sug { color:var(--accent); font-weight:700; }
  .cand .plus { display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--ink2); border-style:dashed; background:none; }
  .cand.past img { opacity:.75; }
  .rv-links { display:flex; flex-wrap:wrap; gap:4px 18px; justify-content:center; margin-top:8px; }
  .strip { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; }

              overflow:hidden; text-overflow:ellipsis; background:linear-gradient(transparent, rgba(0,0,0,.7)); }

  .rg-bar { display:none; position:fixed; z-index:25; left:8px; right:8px; bottom:calc(86px + env(safe-area-inset-bottom)); max-width:760px;
            margin:0 auto; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px;

  @media (max-width: 699px) { .rg-head .title { flex-basis:100%; margin-bottom:0; } .rg-head select { margin-left:16px; } .rg-head { margin-bottom:10px; } }

  /* ---- timeline: the cameras on a map at one moment with the light and weather then, and a time slider;

  body.tl-on { padding-bottom:0; overflow:hidden; }

  .tl-box span { position:absolute; left:-2px; top:-22px; font-size:11px; font-weight:700; color:#fff; background:var(--k); padding:2px 7px; border-radius:6px; white-space:nowrap; }

              bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); padding:8px 12px 9px; background:var(--g-bg); color:var(--g-ink); border-radius:var(--radius);

<script>
const { sunTimes, sunPos, moonAt } = DeerModel;  // sun and moon math lives in static/predict.js (shared with the backtest)
setTheme(localStorage.getItem('theme'));  // again, for the header's logo
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
// Demo mode (a static copy made by `python -m deercam export-demo`): answers come from saved JSON
// files and nothing can be changed. demoFile() must match demo.file_for().
const DEMO = window.DEERCAM_DEMO || null;
const demoFile = path => {
  const [p, q = ''] = path.split('?');
  const qs = q.split('&').filter(Boolean).sort().join('&');
  return 'api/' + (p.replace(/^\/api\//, '') + (qs ? `__${qs}` : '')).replace(/[^A-Za-z0-9_.-]/g, '_') + '.json';
};
const api = (path, opts) => {
  if (DEMO) {
    if (opts?.method === 'POST') {
      toast('This is a read-only demo, so changes aren’t saved.');
      const e = new Error('demo'); e.detail = 'Read-only demo'; return Promise.reject(e);
    }
    return fetch(demoFile(path)).then(r => { if (!r.ok) throw new Error(`not in the demo: ${path}`); return r.json(); });
  }
  return fetch(path, opts).then(async r => {
    if (!r.ok) {
      const e = new Error(r.statusText); e.status = r.status;
      try { e.detail = (await r.json()).detail; } catch {}
      if (r.status === 401 && !/^\/api\/(login|join|account)/.test(path)) showSignIn('Your session ended. Sign in again.');
      if (r.status === 403) toast(esc(e.detail || 'Not allowed'));
      throw e;
    }
    return r.json();
  });
};
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let bucks = [];
let seasons = [];
let view = 'feed', arg = null;
const season = () => $('#season').value;
const seasonLabel = s => { const x = seasons.find(y => String(y.season) === String(s)); return x ? x.label : s; };

// ------------------------------------------------------------------ formatting

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Camera-local times arrive as "Oct 20 2026 05:34 PM"; show "Today 5:34 PM", "Yesterday 6:39 PM", "Oct 18 6:39 PM".
function when(local) {
  const m = /^(\w{3}) (\d+) (\d{4}) (\d+):(\d+) (AM|PM)$/.exec(local || '');
  if (!m) return local || '';
  const d = new Date(Number(m[3]), MONTHS.indexOf(m[1]), Number(m[2]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - d) / 864e5);
  const day = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : `${m[1]} ${Number(m[2])}${d.getFullYear() !== today.getFullYear() ? ` ${m[3]}` : ''}`;
  return `${day} ${Number(m[4])}:${m[5]} ${m[6]}`;
}

function rackLine(r) {
  if (!r) return 'Rack not described';
  const pts = v => v < 0 ? '?' : v;
  const total = r.points_left >= 0 && r.points_right >= 0 ? `${r.points_left + r.points_right} pt · ` : '';
  return `${total}${pts(r.points_left)}×${pts(r.points_right)} · ${r.frame.replace('_', '-')} · spread ${r.spread.replace('_', ' ')}`;
}

function weatherLine(d) {
  const w = d.weather || {};
  return [w.temperature != null ? `${w.temperature}°F` : null, w.wind ? `wind ${w.wind}` : null, w.moonPhase].filter(Boolean).join(' · ');
}

const LIGHT = { day: 'Daylight', shooting: 'Shooting light', night: 'Night', unknown: 'Unknown' };
const isDay = v => v.light === 'day' || v.light === 'shooting';
const lightTag = (k, label) => `<span class="light"><i class="dot ${k || 'unknown'}"></i>${esc(label || LIGHT[k || 'unknown'])}</span>`;
const swatch = k => `<span class="sw" style="background:var(--${k || 'unknown'})"></span>`;
const TAGS = { target: 'Hit list', watch: 'Watch', pass: 'Let walk' };
const star = b => b.tag === 'target' ? ' <span class="star" title="Hit list">★</span>' : '';
function badges(b) {
  let s = b.generic ? '<span class="badge">auto-group</span>' : '';
  if (b.tag && b.tag !== 'target') s += `<span class="badge ${b.tag}">${TAGS[b.tag]}</span>`;
  if (b.status && b.status !== 'alive')
    s += `<span class="badge ${b.status}" title="${esc(b.status_note)}">${b.status === 'harvested' ? 'Harvested' : 'Dead'} ${esc(b.status_date || '')}</span>`;
  return s;
}
const zoomImg = (src, full, cls = '') => `<img src="${src}" data-full="${full || src}" loading="lazy" alt="" class="${cls}">`;

function toast(html, ms = 4000) {
  $('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = html;
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

// ------------------------------------------------------------------ signing in, invite links

let me = null;  // /api/me: {user, role (in the current ranch), ranches}; user is null when signed out
const ROLES = ['viewer', 'member', 'owner'];
const can = level => !!me?.user && (me.user.admin || (level !== 'admin' && ROLES.indexOf(me.role) >= ROLES.indexOf(level)));
const signedOut = on => document.body.classList.toggle('signed-out', on);
const reloadTo = hash => { history.replaceState(null, '', hash); location.reload(); };

function showSignIn(msg = '') {
  signedOut(true);
  $('#main').innerHTML = `<h1 class="title">Sign in</h1><div class="settings"><section id="s-login">
    <div class="row"><label>Username</label><input id="li-user" autocomplete="username" autocapitalize="none"></div>
    <div class="row"><label>Password</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <div class="row"><label></label><button class="act primary" id="li-go">Sign in</button><span id="li-msg" class="${msg ? 'bad' : 'meta'}">${esc(msg)}</span></div>
    <div class="meta">New here? Open the invite link you were sent. Forgot your password? Ask the admin for a new-password link.</div>
  </section></div>`;

}

async function signIn() {
  const username = $('#li-user').value.trim(), password = $('#li-pass').value;
  if (!username || !password) return (username ? $('#li-pass') : $('#li-user')).focus();
  try { await post('/api/login', { username, password }); location.reload(); }  // keeps the hash, e.g. an invite link
  catch (err) { $('#li-msg').className = 'bad'; $('#li-msg').textContent = err.detail || 'Sign-in failed'; }
}

const ROLE_CAN = { viewer: 'look at the photos, bucks and map', member: 'review photos and name and tag bucks',
                   owner: 'run the ranch: cameras, settings and inviting people' };
let joinToken = null;
async function showJoin(token) {
  joinToken = token;
  signedOut(true);
  let info;
  try { info = await api(`/api/join/${encodeURIComponent(token)}`); }
  catch (err) {
    $('#main').innerHTML = `<h1 class="title">This link doesn’t work</h1><div class="settings"><section>
      <div class="meta">${esc(err.detail || 'It may have been typed wrong.')}</div>
      <div class="row"><button class="act" data-go="home">Go to DeerDar</button></div></section></div>`;
    signedOut(false);
    return;
  }
  const pw = `<div class="row"><label>Password</label><input id="jn-pass" type="password" autocomplete="new-password" placeholder="at least 8 characters"></div>
    <div class="row"><label>Password again</label><input id="jn-pass2" type="password" autocomplete="new-password"></div>`;
  const account = `<div class="row"><label>Your name</label><input id="jn-name" autocomplete="name" placeholder="as others will see it"></div>
    <div class="row"><label>Username</label><input id="jn-user" autocomplete="username" autocapitalize="none" placeholder="for signing in"></div>${pw}`;
  let title, intro, form = account, button = 'Create account';
  if (info.kind === 'admin') {
    title = 'Create the admin account';
    intro = 'You run this DeerDar: you’re an owner of every ranch, and the one who adds ranches and sets up the AI.';
  } else if (info.kind === 'reset') {
    title = 'Set a new password';
    intro = `For ${esc(info.name)} (username ${esc(info.username)}). This signs you out on your other devices.`;
    form = pw; button = 'Save password';
  } else {
    title = `Join ${esc(info.ranch)}`;
    intro = `${info.invited_by ? `${esc(info.invited_by)} invited you` : 'You’re invited'} as a ${esc(info.role)}: you can ${ROLE_CAN[info.role]}.`;
    if (info.signed_in_as) { form = ''; button = `Join as ${esc(info.signed_in_as)}`; }
    else {
      form += '<div class="meta">Already have a DeerDar account? <button class="link" id="jn-signin">Sign in</button> and this link will add the ranch to it.</div>';
      button = 'Create account and join';
    }
  }
  $('#main').innerHTML = `<h1 class="title">${title}</h1><div class="settings"><section id="s-join">
    <div class="meta">${intro}</div>${form}
    <div class="row"><label></label><button class="act primary" id="jn-go">${button}</button><span id="jn-msg" class="meta"></span></div>
  </section></div>`;
  ($('#jn-name') || $('#jn-pass') || $('#jn-go')).focus();
}

async function joinGo() {
  const val = sel => $(sel) ? $(sel).value : null, msg = $('#jn-msg');
  if ($('#jn-pass') && val('#jn-pass') !== val('#jn-pass2')) { msg.className = 'bad'; msg.textContent = 'The two passwords don’t match'; return; }

    await post(`/api/join/${encodeURIComponent(joinToken)}`, { name: val('#jn-name'), username: val('#jn-user')?.trim() ?? null, password: val('#jn-pass') });
    reloadTo('#home');

}

function showNoRanch() {
  signedOut(true);
  $('#main').innerHTML = `<h1 class="title">Hi ${esc(me.user.name)}</h1><div class="settings"><section>
    <div class="meta">You’re signed in, but not in a ranch yet. Ask a ranch owner for an invite link and open it on this device.</div>
    <div class="row"><button class="act" id="acc-out">Sign out</button></div></section></div>`;
}

// ------------------------------------------------------------------ seasons, counts, header

// Each ranch (one place with cameras) has its own photos and bucks; the server reads the current one
// from the `ranch` cookie. The picker only shows once there's more than one.
let ranchList = [];
async function loadRanches() {
  if (DEMO) return;
  ranchList = await api('/api/ranches');
  const sel = $('#ranch');
  sel.innerHTML = ranchList.map(r => `<option value="${esc(r.id)}" ${r.current ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  sel.hidden = ranchList.length < 2;
}
function switchRanch(id) {
  document.cookie = `ranch=${encodeURIComponent(id)}; path=/; max-age=31536000; samesite=lax`;
  location.hash = '#home';
  location.reload();
}
$('#ranch').addEventListener('change', e => switchRanch(e.target.value));

async function loadSeasons() {
  const keep = $('#season').value;
  seasons = await api('/api/seasons');
  $('#season').innerHTML = seasons.map(s =>
    `<option value="${s.season}" title="${s.label}">${s.current ? 'This season' : `${s.label} (archived)`}</option>`).join('') + '<option value="all">All seasons</option>';
  $('#season').value = keep || String(seasons.find(s => s.current).season);
}

async function refreshCounts() {
  const s = await api(`/api/stats?season=${season()}`);
  $('#rcount').textContent = s.review ? `${s.review}` : '';
  return s;
}

addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });

// ------------------------------------------------------------------ home: the bucks you're after

const hr = h => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
const hourRange = (a, b) => hr(a).slice(-2) === hr(b).slice(-2) ? `${hr(a).slice(0, -3)}–${hr(b)}` : `${hr(a)}–${hr(b)}`;

// "2 h ago" for an ISO time
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60e3);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
// Where the sun was at that moment, as a small arc: east on the left, west on the right, the horizon as
// a line; below it at night. Needs the camera's place.
function sunArc(iso, cam) {
  if (!cam || cam.lat == null) return '';
  const t = new Date(iso).getTime(), s = sunPos(t, cam.lat, cam.lon);
  const x = 10 + Math.max(0, Math.min(1, ((s.az - 90 + 360) % 360) / 180)) * 100, y = 34 - Math.max(-1, Math.min(1, s.alt / 90)) * 26;
  const night = s.alt < -6, dusk = !night && s.alt < 2;
  return `<svg class="sunarc" viewBox="0 0 120 44" aria-label="Sun position"><path d="M10 34A50 30 0 0 1 110 34" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="2 3"/>
    <line x1="4" y1="34" x2="116" y2="34" stroke="currentColor" stroke-opacity=".28" stroke-width="1"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${night ? 3 : 4.5}" fill="${night ? '#9aa6b2' : dusk ? '#f2a65a' : '#ffd65a'}" ${night ? 'opacity=".7"' : `style="filter:drop-shadow(0 0 4px ${dusk ? '#f2a65a' : '#ffd65a'})"`}/>
    <text x="6" y="42" font-size="6.5" fill="currentColor" fill-opacity=".45">E</text><text x="110" y="42" font-size="6.5" fill="currentColor" fill-opacity=".45">W</text></svg>`;
}
// A buck's last 48 hours in one strip: night and day with the legal-light half hours at dawn and dusk,
// sunrise and sunset times, the temperature, and a mark for every visit he made. `tl` is /api/timeline.
function huntStrip(name, tl) {
  if (!tl || !tl.cameras) return '';
  const W = 600, H = 66, top = 6, bh = 34, t1 = Date.now(), t0 = t1 - 48 * 3600e3, X = t => (t - t0) / (t1 - t0) * W;
  const placed = tl.cameras.filter(c => c.lat != null);
  if (!placed.length) return '';
  const lat = placed.reduce((a, c) => a + c.lat, 0) / placed.length, lon = placed.reduce((a, c) => a + c.lon, 0) / placed.length;
  const offAt = t => { let o = -300; for (const [at, m] of tl.offsets || []) if (at <= t) o = m; return o; };
  const local = t => new Date(t + offAt(t) * 60e3), hm = t => { const d = local(t), h = d.getUTCHours(); return `${(h % 12) || 12}:${String(d.getUTCMinutes()).padStart(2, '0')}`; };
  // sun events by scanning the two days
  const step = 5 * 60e3, up = t => sunPos(t, lat, lon).alt > -0.833;
  const rises = [], sets = [];
  for (let t = t0, was = up(t0); t <= t1; t += step) { const now = up(t); if (now && !was) rises.push(t); if (!now && was) sets.push(t); was = now; }
  const bands = [];  // [x0, x1, kind]
  let segs = [[t0, up(t0) ? 'day' : 'night']];
  for (const t of [...rises.map(t => [t, 'rise']), ...sets.map(t => [t, 'set'])].sort((a, b) => a[0] - b[0])) {
    if (t[1] === 'rise') { segs.push([t[0] - 30 * 60e3, 'legal']); segs.push([t[0], 'day']); }
    else { segs.push([t[0], 'legal']); segs.push([t[0] + 30 * 60e3, 'night']); }
  }
  segs.push([t1, null]);
  for (let i = 0; i < segs.length - 1; i++) bands.push([X(Math.max(t0, segs[i][0])), X(Math.min(t1, segs[i + 1][0])), segs[i][1]]);
  const fill = { night: 'rgba(8,12,20,.55)', legal: 'rgba(242,166,90,.35)', day: 'rgba(255,255,255,.06)' };
  // visits: this buck's sightings, under 20 min apart
  const seen = tl.animals.filter(a => a.buck === name && a.t >= t0 && a.t <= t1).sort((a, b) => a.t - b.t), visits = [];
  for (const a of seen) { const v = visits.at(-1); if (v && a.t - v.t1 <= 20 * 60e3) { v.t1 = a.t; v.n++; } else visits.push({ t0: a.t, t1: a.t, n: 1 }); }
  // temperature
  const ws = (tl.weather || []).filter(w => w.temp != null && w.t >= t0 - 3 * 3600e3 && w.t <= t1 + 3 * 3600e3);
  let temp = '';
  if (ws.length > 1) {
    const lo = Math.min(...ws.map(w => w.temp)), hi = Math.max(...ws.map(w => w.temp)), Y = v => top + 4 + (1 - (v - lo) / Math.max(1, hi - lo)) * (bh - 8);
    temp = `<polyline points="${ws.map(w => `${X(w.t).toFixed(1)},${Y(w.temp).toFixed(1)}`).join(' ')}" fill="none" stroke="#f59e4b" stroke-width="1.5" stroke-linejoin="round" opacity=".9"/>
      <text x="${W - 4}" y="${Y(hi) - 3}" font-size="9" fill="#f59e4b" text-anchor="end">${Math.round(hi)}°</text><text x="${W - 4}" y="${Y(lo) + 10}" font-size="9" fill="#f59e4b" text-anchor="end">${Math.round(lo)}°</text>`;
  }
  // the axis: each local midnight gets the day's name, each noon a sun; sunrise and sunset get their times
  let axis = '';
  const d0 = local(t0), firstMid = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate() + 1) - offAt(t0) * 60e3;
  for (let m = firstMid; m < t1; m += 864e5) {
    const x = X(m);
    axis += `<line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${top + bh}" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
      <text x="${(x + 4).toFixed(1)}" y="${H - 3}" font-size="9.5" font-weight="700" fill="currentColor" fill-opacity=".75">${local(m).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })}</text>`;
  }
  const sunGlyph = (x, y) => `<g transform="translate(${x.toFixed(1)} ${y})"><circle r="2.6" fill="#ffd65a"/>${[0, 45, 90, 135].map(a => `<line x1="0" y1="-4.2" x2="0" y2="-5.6" transform="rotate(${a})" stroke="#ffd65a" stroke-width="1"/><line x1="0" y1="4.2" x2="0" y2="5.6" transform="rotate(${a})" stroke="#ffd65a" stroke-width="1"/>`).join('')}</g>`;
  for (const t of rises) axis += `${sunGlyph(X(t), top + bh + 7)}<text x="${(X(t) + 8).toFixed(1)}" y="${top + bh + 10}" font-size="8.5" fill="currentColor" fill-opacity=".6">${hm(t)}</text>`;
  for (const t of sets) axis += `<g transform="translate(${X(t).toFixed(1)} ${top + bh + 7})"><circle r="3" fill="#c9d1dc"/><circle r="3" cx="-1.6" cy="-.6" fill="#15171a"/></g><text x="${(X(t) + 8).toFixed(1)}" y="${top + bh + 10}" font-size="8.5" fill="currentColor" fill-opacity=".6">${hm(t)}</text>`;
  const marks = visits.map(v => { const x0 = X(v.t0), x1 = Math.max(X(v.t1), x0 + 5);
    return `<rect x="${(x0 - 2).toFixed(1)}" y="${top + bh / 2 - 6}" width="${(x1 - x0 + 4).toFixed(1)}" height="12" rx="6" fill="#f2a65a" stroke="#15171a" stroke-width="1.5"><title>${v.n} photo${v.n === 1 ? '' : 's'} · ${hm(v.t0)}${v.n > 1 ? `–${hm(v.t1)}` : ''}</title></rect>`; }).join('');
  return `<svg class="hstrip" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(name)}'s last 48 hours">
    <rect x="0" y="${top}" width="${W}" height="${bh}" rx="6" fill="currentColor" fill-opacity=".04"/>
    <clipPath id="hs-${esc(name).replace(/\W/g, '')}"><rect x="0" y="${top}" width="${W}" height="${bh}" rx="6"/></clipPath>
    <g clip-path="url(#hs-${esc(name).replace(/\W/g, '')})">${bands.map(([a, b, k]) => `<rect x="${a.toFixed(1)}" y="${top}" width="${Math.max(0, b - a).toFixed(1)}" height="${bh}" fill="${fill[k] || 'none'}"/>`).join('')}${temp}</g>
    ${axis}${marks}
    <line x1="${X(t1)}" y1="${top - 2}" x2="${X(t1)}" y2="${top + bh + 2}" stroke="currentColor" stroke-width="1.5"/></svg>`;
}
// The radar: every animal the cameras saw lately, as a blip. Direction is the camera's real bearing
// from the middle of the cameras; distance is how long ago (rings at now, 1 h, 6 h, 12 h and the edge of
// the range). A green sweep goes round and lights each blip as it passes. Sightings at one camera within
// ten minutes share a blip, with a count.
const RADAR_BANDS = { 24: [0, 1, 6, 12, 24], 48: [0, 6, 12, 24, 48], 72: [0, 12, 24, 48, 72] };
let radarRange = RADAR_BANDS[Number(localStorage.getItem('radarRange'))] ? Number(localStorage.getItem('radarRange')) : 48;
let radarBucks = localStorage.getItem('radarBucks') === '1';
function homeRadar(tl) {
  if (!tl || !tl.animals?.length) return '';
  const placed = tl.cameras.map((c, i) => ({ ...c, i })).filter(c => c.lat != null);
  if (!placed.length) return '';
  // one equal sector per camera, in the order they sit around the middle of the cameras
  const cx = placed.reduce((a, c) => a + c.lat, 0) / placed.length, cy = placed.reduce((a, c) => a + c.lon, 0) / placed.length;
  const order = placed.map(c => c.i).sort((a, b) => bearing(cx, cy, tl.cameras[a].lat, tl.cameras[a].lon) - bearing(cx, cy, tl.cameras[b].lat, tl.cameras[b].lon));
  const sector = 360 / order.length, ang = {}; order.forEach((i, k) => { ang[i] = k * sector + sector / 2; });
  const bands = RADAR_BANDS[radarRange], now = Date.now(), R = 100, rings = bands.length - 1;
  const rOf = hAgo => { let i = 0; while (i < rings && hAgo > bands[i + 1]) i++; if (i >= rings) return R; const a = bands[i], b = bands[i + 1]; return (i + (hAgo - a) / (b - a)) / rings * R; };
  const blips = [];
  // only animals we can name a kind for; the not-yet-labeled ones would swamp the screen
  const recent = tl.animals.filter(a => a.cam != null && ang[a.cam] != null && now - a.t <= radarRange * 3600e3 && a.kind !== 'animal' && (!radarBucks || a.kind === 'buck')).sort((a, b) => b.t - a.t);
  for (const a of recent) {
    const b = blips.find(x => x.cam === a.cam && Math.abs(x.t - a.t) < 30 * 60e3);
    if (b) { b.n++; if (TL_KINDS[a.kind].rank > TL_KINDS[b.kind].rank) { b.kind = a.kind; b.name = a.buck || ''; } continue; }
    blips.push({ cam: a.cam, t: a.t, kind: a.kind, n: 1, name: a.buck || '' });
  }
  const pt = (deg, r) => { const th = (deg - 90) * Math.PI / 180; return [R + r * Math.cos(th), R + r * Math.sin(th)]; };
  const period = 14;  // seconds per sweep
  // each camera's blips spread across its sector (leaving a margin at the dividers)
  const perCam = {}; blips.forEach(b => (perCam[b.cam] ??= []).push(b));
  const span = sector - 26;
  for (const list of Object.values(perCam)) list.forEach(b => { const u = ((b.t / 60e3 * 9301 + 49297) % 233280) / 233280; b.off = -span / 2 + span * u; });  // a stable scatter
  const blipSvg = blips.map(b => {
    const h = (now - b.t) / 3600e3, r = Math.min(R - 7, 8 + rOf(h) * .9), [x, y] = pt(ang[b.cam] + b.off, r), k = TL_KINDS[b.kind];
    const delay = -((360 - ang[b.cam]) % 360) / 360 * period;  // lit when the sweep comes round to it
    return `<g class="blip" style="--k:${k.color};animation-delay:${delay.toFixed(2)}s" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <title>${esc(b.name || k.label)}${b.n > 1 ? ` ×${b.n}` : ''} · ${esc(tl.cameras[b.cam].name || '')} · ${h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : `${h.toFixed(h < 10 ? 1 : 0)} h`} ago</title>
      ${b.kind === 'buck' ? `<g transform="translate(-6 -4) scale(.011)" color="${k.color}" style="filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8))">${RACK_SVG.replace('<svg', '<svg width="1080" height="719"')}</g>`
        : `<circle r="4.2" fill="${k.color}" opacity=".95"/><g transform="translate(-2.8 -2.8) scale(.23)" color="#0f1312">${TL_SVG[b.kind].replace('<svg', '<svg width="24" height="24"')}</g>`}
</g>`;
  }).join('');
  // dividers between the sectors, and each camera's name curved along its rim
  const dividers = order.map((i, k) => { const [x, y] = pt(k * sector, R); return `<line x1="${R}" y1="${R}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(90,165,120,.5)" stroke-width=".9"/>`; }).join('');
  // names outside the rim; the lower half's arcs run the other way so the words read upright
  const labels = order.map((i, k) => { const mid = k * sector + sector / 2, lower = mid > 90 && mid < 270, a0 = lower ? mid + 40 : mid - 40, a1 = lower ? mid - 40 : mid + 40, rr = lower ? R + 10 : R + 6, [x0, y0] = pt(a0, rr), [x1, y1] = pt(a1, rr), c = tl.cameras[i];
    return `<path id="rl${k}" d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${rr} ${rr} 0 0 ${lower ? 0 : 1} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none"/><text font-size="5.6" font-weight="800" letter-spacing=".14em" fill="currentColor" fill-opacity=".8"><textPath href="#rl${k}" startOffset="50%" text-anchor="middle">${esc((c.name || c.camera_id).toUpperCase())}</textPath></text>`; }).join('');
  const ringSvg = bands.slice(1).map((h, i) => { const r = (i + 1) / rings * R; return `<circle cx="${R}" cy="${R}" r="${r.toFixed(1)}" fill="none" stroke="rgba(90,165,120,${i === rings - 1 ? .45 : .22})" stroke-width=".8"/><text x="${R + 2}" y="${(R - r + 6).toFixed(1)}" font-size="5" fill="rgba(90,165,120,.8)">${h}h</text>`; }).join('');
  const kinds = {}; for (const b of blips) kinds[b.kind] = (kinds[b.kind] || 0) + b.n;
  return `<div class="hside radar"><div class="hside-h">Radar <span class="r"><button class="rbucks${radarBucks ? ' on' : ''}" data-radar-bucks="1">${RACK_SVG}Bucks only</button><span class="rr">${[24, 48, 72].map(h => `<button class="${h === radarRange ? 'on' : ''}" data-radar="${h}">${h}h</button>`).join('')}</span></span></div>
    <div class="radar-box" style="--period:${period}s"><div class="radar-sweep"></div>
      <svg viewBox="-14 -14 ${R * 2 + 28} ${R * 2 + 28}"><defs><radialGradient id="rbg"><stop offset="0" stop-color="#16251d"/><stop offset=".7" stop-color="#0d1512"/><stop offset="1" stop-color="#0a0f0d"/></radialGradient></defs><circle cx="${R}" cy="${R}" r="${R}" fill="url(#rbg)" stroke="rgba(90,165,120,.5)" stroke-width="1"/>
        ${ringSvg}${dividers}${labels}<circle cx="${R}" cy="${R}" r="2.2" fill="#5aa578"/>${blipSvg}</svg></div>
    <div class="radar-key">${Object.entries(kinds).sort((a, b) => TL_KINDS[b[0]].rank - TL_KINDS[a[0]].rank).map(([k, n]) => `<span style="color:${TL_KINDS[k].color}">${TL_SVG[k]}<b>${n}</b></span>`).join('') || '<span class="meta">Nothing in range</span>'}</div></div>`;
}
// The cameras on the Home page: each one's last photo, signal and battery.
function homeCams(tl, health) {
  if (!tl || !tl.cameras?.length) return '';
  const last = {};
  for (const p of tl.photos || []) if (p[1] != null) last[p[1]] = p[0];
  return `<div class="hside hcams"><div class="hside-h">Cameras</div>${tl.cameras.map((c, ci) => {
    const h = health?.[c.camera_id]?.photos?.at(-1), bat = h?.[1], sig = h?.[2], t = last[ci];
    const m = t ? (Date.now() - t) / 60e3 : null, age = m == null ? '—' : m < 60 ? `${Math.max(1, Math.round(m))}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;
    return `<div class="hcam${m != null && m > 24 * 60 ? ' quiet' : ''}">${CAM_SVG}<span>${esc(c.name || c.camera_id)}</span><em title="Last photo${t ? ' ' + new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''}">${age}</em>
      <span class="tlm-bars">${[1, 2, 3, 4].map(i => `<i class="${sig >= i ? 'on' : ''}" style="height:${2 + i * 2.2}px"></i>`).join('')}</span>

  }).join('')}</div>`;
}
// The best thing on the cameras in the last day: a hit-list buck first, then any named buck, daylight and
// long visits ahead of quick ones. Falls back to the latest buck visit.
function spotlightPick(named, recent) {
  const day = Date.now() - 24 * 3600e3;
  const score = v => (v.tag === 'target' ? 100 : 0) + (v.light === 'day' || v.light === 'shooting' ? 20 : 0) + Math.min(10, v.photos || 0);
  const fresh = recent.filter(v => new Date(v.start) >= day);
  const pool = fresh.length ? fresh : recent.slice(0, 1);
  return pool.sort((a, b) => score(b) - score(a) || new Date(b.start) - new Date(a.start))[0] || null;
}
function spotlight(v, cams, isFresh, tl) {
  const cam = cams[v.camera_id], w = [v.temp != null ? `${v.temp}°F` : '', v.wind ? `wind ${v.wind}` : '', v.moon || '', v.pressure ? `pressure ${v.pressure.toLowerCase()}` : ''].filter(Boolean).join(' · ');
  return `<section class="spot" data-buck="${v.buck_id}"><div class="spot-ph">${zoomImg(v.photo || v.crop, v.photo)}
      <div class="spot-tag">${isFresh ? 'Spotlight · last 24 hours' : 'Latest'}</div></div>
    <div class="spot-side">
      <div class="spot-who">${v.thumb ? `<img src="${v.thumb}" alt="">` : ''}<div><b>${esc(v.buck)}${star(v)}</b><span>${esc(v.camera)}</span></div></div>
      <div class="spot-when"><b>${ago(v.start)}</b><span>${esc(when(v.local))}</span></div>
      <div class="spot-light">${lightTag(v.light, v.light_label)}${sunArc(v.start, cam)}</div>
      ${w ? `<div class="meta">${esc(w)}</div>` : ''}
      <button class="btn small" data-buck="${v.buck_id}">Open ${esc(v.buck)} ›</button>
    </div></section>`;
}

        ${b.thumb ? `<img src="${b.thumb}" alt="">` : '<span class="plus"></span>'}<span><b>${esc(b.name)}</b><small>${b.absent ? 'Not seen yet' : b.last_visit ? ago(b.last_visit.start) : `${b.daylight} daylight`}</small></span></button>`).join('')}</div>

function bindRareFix() {
  $$('.rare-fix').forEach(sel => sel.onchange = async () => {

    sel.disabled = true;
    try { for (const id of sel.dataset.ids.split(',')) await post(`/api/detections/${id}/animal`, { animal: sel.value }); }
    catch (err) { sel.disabled = false; toast(err.detail || 'Not saved'); return; }
    toast('Fixed'); showHome();
  });
}

// A rare visitor: what it is, how seldom it comes, and when the one before was. A rare one is where a

function huntCard(b, cams = {}, tl = null) {

function columnPath(x, y, w, h, r) {
  // A column segment; r > 0 rounds only the top (data end), the baseline stays square.
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function hourChart(hours) {
  const keys = ['day', 'shooting', 'night', 'unknown'];
  const W = 480, H = 150, left = 22, bottom = 20, top = 10, band = (W - left) / 24, bw = Math.min(12, band - 4);
  const max = Math.max(1, ...hours.map(h => keys.reduce((a, k) => a + h[k], 0)));
  const y = v => (H - bottom - top) * v / max;
  let cols = '';
  hours.forEach((h, i) => {
    const x = left + i * band + (band - bw) / 2;
    let base = H - bottom;
    const segs = keys.filter(k => h[k] > 0);
    segs.forEach((k, j) => {
      const hh = y(h[k]) - (j < segs.length - 1 ? 2 : 0);  // 2px surface gap between stacked segments
      cols += `<path d="${columnPath(x, base - hh, bw, hh, j === segs.length - 1 ? 4 : 0)}" fill="var(--${k})"/>`;
      base -= y(h[k]);
    });
    const tip = `${i % 12 || 12}${i < 12 ? ' AM' : ' PM'}: ` + (segs.length ? segs.map(k => `${h[k]} ${LIGHT[k].toLowerCase()}`).join(', ') : 'no visits');
    cols += `<rect x="${left + i * band}" y="${top}" width="${band}" height="${H - bottom - top}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  const ticks = [0, 6, 12, 18].map(hr => `<text x="${left + hr * band + band / 2}" y="${H - 5}" text-anchor="middle">${['12a', '6a', '12p', '6p'][hr / 6]}</text>`).join('');
  const used = keys.filter(k => hours.some(h => h[k]));
  return `<div class="legend">${used.map(k => `<span>${swatch(k)}${LIGHT[k]}</span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" class="hours" role="img" aria-label="Visits by hour of day">
      <line x1="${left}" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>
      <line x1="${left}" x2="${W}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <text x="${left - 4}" y="${top + 4}" text-anchor="end">${max}</text>
      <text x="${left - 4}" y="${H - bottom + 3}" text-anchor="end">0</text>
      ${ticks}${cols}
    </svg>
    <details><summary>Show as table</summary><table class="mini"><tr><th>Hour</th>${used.map(k => `<th>${LIGHT[k]}</th>`).join('')}</tr>
      ${hours.filter(h => used.some(k => h[k])).map(h => `<tr><td>${h.hour % 12 || 12}${h.hour < 12 ? ' AM' : ' PM'}</td>${used.map(k => `<td class="n">${h[k]}</td>`).join('')}</tr>`).join('')}</table></details>`;
}

function condRows(rows) {
  if (!rows.length) return '<div class="meta" style="grid-column:1/-1">No data</div>';
  const max = Math.max(...rows.map(r => r.all));
  return rows.map(r => `<div>${esc(r.key)}</div>
    <div class="bar" data-tip="${esc(`${r.key}: ${r.daylight} daylight of ${r.all} visits`)}">
      ${r.daylight ? `<span style="width:${100 * r.daylight / max}%; background:var(--shooting)"></span>` : ''}
      ${r.all - r.daylight ? `<span style="width:${100 * (r.all - r.daylight) / max}%; background:var(--night)"></span>` : ''}
    </div><div class="n">${r.daylight} / ${r.all}</div>`).join('');
}

async function loadPatterns(id) {
  const p = await api(`/api/bucks/${id}/patterns?season=${season()}`);
  const box = $('#patterns');
  if (!box || Number($('.buckpage')?.dataset.buck) !== id) return;
  if (!p.visits) { box.innerHTML = '<div class="meta" style="margin-top:8px">No visits in this season.</div>'; return; }
  const ld = p.last_daylight, c = p.conditions;
  const best = p.cameras.slice().sort((a, b) => b.daylight - a.daylight || b.visits - a.visits)[0];
  const maxCam = Math.max(...p.cameras.map(k => k.visits));
  box.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${p.visits}</b><span>visits · ${p.photos} photos</span></div>
      <div class="kpi"><b>${p.daylight}</b><span>in daylight</span></div>
      <div class="kpi"><b title="${esc(best.camera)}">${esc(best.camera)}</b><span>${best.daylight ? 'most daylight' : 'most visits'}</span></div>
    </div>
    <div class="meta" style="margin-top:10px">${ld ? `Last daylight: ${lightTag(ld.light, `${when(ld.local)} at ${ld.camera} · ${ld.light_label}`)}` : 'No daylight visits yet.'}</div>
    ${p.approx ? '<div class="hint">Daylight is approximate. Place the cameras on the Map so sunrise and sunset can be worked out for your spot.</div>' : ''}
    ${p.visits < 10 ? `<div class="hint">Only ${p.visits} visit${p.visits === 1 ? '' : 's'} so far. A visit is one stop at one camera (photos within 30 min). Treat patterns as anecdotes until there are more.</div>` : ''}
    <h3>When he moves</h3>${hourChart(p.hours)}
    <h3>Where</h3>
    <div class="camrows">${p.cameras.map(k => `<div class="r"><span>${esc(k.camera)}</span>
      <span class="meta">${k.visits} visit${k.visits === 1 ? '' : 's'} · <b style="color:var(--ink)">${k.daylight}</b> daylight</span>
      <div class="bar" data-tip="${esc(`${k.camera}: ${k.daylight} daylight of ${k.visits} visits`)}">
        ${k.daylight ? `<span style="width:${100 * k.daylight / maxCam}%; background:var(--shooting)"></span>` : ''}
        ${k.visits - k.daylight ? `<span style="width:${100 * (k.visits - k.daylight) / maxCam}%; background:var(--night)"></span>` : ''}</div></div>`).join('')}</div>
    <div class="legend" style="margin-top:6px"><span>${swatch('shooting')}Daylight visits</span><span>${swatch('night')}Other visits</span></div>
    <details><summary>Wind, temperature, moon and pressure on his visits</summary>
      ${[['Wind', c.wind], ['Temperature', c.temp], ['Moon', c.moon], ['Pressure', c.pressure]].map(([t, rows]) =>
        `<div class="meta" style="margin:10px 0 4px">${t}</div><div class="cond">${condRows(rows)}</div>`).join('')}</details>
    <h3>Recent visits</h3>
    <div class="vlist">${p.recent.slice(0, 8).map(v => `<div class="v">${zoomImg(v.crop, v.photo)}
      <div><div>${esc(when(v.local))} · ${esc(v.camera)}</div>
      <div class="meta">${lightTag(v.light, v.light_label || 'unknown light')} · ${v.photos} photo${v.photos === 1 ? '' : 's'}${v.minutes ? `, ${v.minutes} min` : ''}</div></div></div>`).join('')}</div>`;
}

// Tooltips for anything with data-tip (chart columns, bars): hover with a mouse, tap on a phone
function showTip(e) {
  const t = e.target.closest?.('[data-tip]'), tip = $('#tip');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
}
document.addEventListener('mousemove', showTip);
document.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') showTip(e); });

// ------------------------------------------------------------------ review

// #review is a grid of every photo waiting: tap the ones you recognize, then say who they are.
// #review/<id> is one photo at a time: pick who it is from this season's bucks (most similar first),
// a buck from an earlier season, or a new name, with name ideas and the earlier-season check.
const rv = { items: [], i: 0, pick: null, cands: [], newName: '' };
const rg = { items: [], sel: new Set(), pick: null, newName: '' };
let rvMode = 'grid';
let rvModal = false, rvModalDirty = false;  // a photo open in a window over the grid (or over the Gallery)

function openReviewModal(id, items = rg.items) {
  closeReviewModal(false);
  rvModal = true; rvModalDirty = false;
  rv.items = items.slice();
  rv.i = Math.max(0, rv.items.findIndex(d => d.id === Number(id)));
  const box = document.createElement('div');
  box.className = 'rvm'; box.id = 'rvm';
  box.innerHTML = '<div class="rvm-box"><button class="rvm-x" id="rvm-x" title="Back to the grid (Esc)">×</button><div id="rvm-body"></div></div>';
  box.addEventListener('click', e => { if (e.target === box || e.target.id === 'rvm-x') closeReviewModal(); });
  document.body.append(box);
  document.body.style.overflow = 'hidden';
  renderReview();
}
async function closeReviewModal(refresh = true) {
  if (!$('#rvm')) return;
  closeCompare();
  $('#rvm').remove();
  document.body.style.overflow = '';
  rvModal = false;
  if (refresh && rvModalDirty && view === 'review' && rvMode === 'grid') {
    // photos saved in the window leave the grid; keep the scroll position
    const y = scrollY;
    await showReviewGrid(); refreshCounts();
    scrollTo(0, y);
  }
  if (refresh && rvModalDirty && view === 'timeline') { tlReload(); refreshCounts(); }
}

// The Gallery's "Who is this?": the one photo in a window, so the Gallery stays where it was.
async function tagInModal(id) {
  const [one, list] = await Promise.all([api(`/api/detections/${id}`), api(`/api/bucks?season=${season()}`)]);
  bucks = list;
  openReviewModal(id, [one]);
}

async function loadReview(focusId) {
  const sort = localStorage.getItem('reviewSort') || 'similar';
  const [items, list] = await Promise.all([api(`/api/review?sort=${sort}&season=${season()}`), api(`/api/bucks?season=${season()}`)]);
  bucks = list;
  rv.items = items;
  let at = focusId != null ? items.findIndex(d => d.id === Number(focusId)) : -1;
  if (focusId != null && at < 0) {
    const one = await api(`/api/detections/${focusId}`).catch(() => null);
    if (one) { rv.items = [one, ...items]; at = 0; }
  }
  rv.i = at >= 0 ? at : Math.min(rv.i, Math.max(0, items.length - 1));
}

async function showReview() {
  if (arg == null) return showReviewGrid();
  rvMode = 'one';
  await loadReview(arg);
  arg = null;
  renderReview();
}

async function showReviewGrid() {
  rvMode = 'grid';
  const sort = localStorage.getItem('reviewSort') || 'similar';
  const [items, list] = await Promise.all([api(`/api/review?sort=${sort}&season=${season()}`), api(`/api/bucks?season=${season()}`)]);
  bucks = list;
  rg.items = items;
  rg.sel = new Set([...rg.sel].filter(id => items.some(d => d.id === id)));
  if (!items.length) {
    $('#main').innerHTML = `<h1 class="title">Review</h1><div class="empty">Nothing to review. New buck photos show up here after each check.</div>`;
    return;
  }
  $('#main').innerHTML = `<div class="rvgrid">
    <div class="rg-head"><h1 class="title">Review <span class="meta">${items.length}</span></h1>
      <select id="rv-sort">${[['similar', 'Look-alikes together'], ['size', 'Biggest first'], ['newest', 'Newest first']].map(([k, l]) =>
        `<option value="${k}" ${sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn small" id="rematch" title="Re-match the queue against your named bucks">Re-run matching</button></div>
    <div class="pad meta" style="margin-top:-6px">Tap the photos you recognize, then pick who they are. ⤢ opens one in a window, with side-by-side compare, name ideas and the full photo.</div>
    <div class="rg">${items.map(d => `<div class="rgt ${rg.sel.has(d.id) ? 'sel' : ''}" data-sel="${d.id}">
      <img class="bg" src="${d.crop}" loading="lazy" alt=""><img src="${d.crop}" loading="lazy" alt=""><span class="tick">✓</span>
      <button class="open" data-open="${d.id}" title="Open by itself">⤢</button>
      <div class="cap">${esc(d.camera)} · ${esc(when(d.when))}</div></div>`).join('')}</div>
    <div class="rg-bar" id="rg-bar"></div></div>`;
  renderBar();
}

function renderBar() {
  const n = rg.sel.size, bar = $('#rg-bar');
  bar.classList.toggle('on', n > 0);
  $('.rg').classList.toggle('picking', n > 0);
  if (!n) { bar.innerHTML = ''; return; }
  const present = bucks.filter(b => !b.absent && b.status === 'alive'), past = bucks.filter(b => b.absent);
  bar.innerHTML = `<div class="rg-top"><b>${n} selected</b><button class="link" id="rg-young" title="Young bucks nobody’s going to name: out of Review for good, still counted as bucks">Young buck${n === 1 ? '' : 's'}, not tracking</button>
      <button class="link" id="rg-reject">Not a buck / can't tell</button>
      <button class="link" id="rg-clear">Clear</button></div>
    <div class="cands">${present.map(b => cand(b, {})).join('')}${past.map(b => cand(b, {}, true)).join('')}
      <button class="cand" data-new><div class="plus">+</div><b>New buck</b><small>&nbsp;</small></button></div>
    <div class="form" id="rg-new" style="display:${rg.pick === 'new' ? '' : 'none'}"><div class="row">
      <input id="rg-name" placeholder="New buck's name" autocomplete="off" value="${esc(rg.newName)}"></div></div>
    <button class="btn blue" id="rg-save"></button>`;
  refreshBar();
}

function refreshBar() {
  $$('#rg-bar .cand').forEach(c => c.classList.toggle('sel', rg.pick === 'new' ? c.dataset.new !== undefined : Number(c.dataset.pick) === rg.pick));
  const b = bucks.find(x => x.id === rg.pick), n = rg.sel.size, save = $('#rg-save');
  save.textContent = rg.pick === 'new' ? (rg.newName ? `Save ${n} as new buck “${rg.newName}”` : 'Type his name')
    : b ? `${n === 1 ? 'That’s' : `All ${n} are`} ${b.name}` : 'Pick who they are';
  save.disabled = !rg.pick || (rg.pick === 'new' && !rg.newName);
}

async function gridClick(e) {
  const t = e.target.closest('button, [data-sel]');
  if (!t) return;
  if (t.dataset.open) return openReviewModal(t.dataset.open);
  if (t.dataset.sel) {
    const id = Number(t.dataset.sel);
    if (rg.sel.has(id)) rg.sel.delete(id); else rg.sel.add(id);
    t.classList.toggle('sel', rg.sel.has(id));
    return renderBar();
  }
  if (t.dataset.pick) { rg.pick = Number(t.dataset.pick); return refreshBar(); }
  if (t.dataset.new !== undefined) { rg.pick = 'new'; $('#rg-new').style.display = ''; refreshBar(); return $('#rg-name').focus(); }
  if (t.id === 'rg-clear') { rg.sel.clear(); $$('.rgt.sel').forEach(x => x.classList.remove('sel')); return renderBar(); }
  if (t.id === 'rematch') { try { await post('/api/identify'); } catch { /* already running */ } return watchJob(); }
  if (t.id === 'rg-young') {
    const ids = [...rg.sel];
    try { await post('/api/detections/untrack', { ids }); } catch { return; }
    toast(`${ids.length} left unnamed as young buck${ids.length === 1 ? '' : 's'}`);
    return afterGrid();
  }
  if (t.id === 'rg-reject') {
    const ids = [...rg.sel];
    try { await post('/api/detections/reject', { ids }); } catch { return; }
    toast(`${ids.length} marked as not usable`);
    return afterGrid();
  }
  if (t.id === 'rg-save') return saveGrid();
}

async function saveGrid() {
  const ids = [...rg.sel], b = bucks.find(x => x.id === rg.pick);
  if (!rg.pick || (rg.pick === 'new' && !rg.newName)) return;
  const who = rg.pick === 'new' ? rg.newName : b?.name;
  $('#rg-save').disabled = true;
  let res;
  try { res = await post('/api/detections/assign', rg.pick === 'new' ? { ids, new_name: rg.newName } : { ids, buck_id: rg.pick }); }
  catch { $('#rg-save').disabled = false; toast('Save failed; try again.'); return; }
  toast(`${ids.length} saved as ${esc(who)}${res.searching ? '. Looking for his other photos…' : ''}`);
  if (res.searching) watchJob();
  afterGrid();
}

async function afterGrid() {
  rg.sel.clear(); rg.pick = null; rg.newName = '';
  await showReviewGrid();
  refreshCounts();
}

                  title="Saved with the buck for this season"></textarea>
        <div class="meta" id="rv-old-notes"></div></details>
      <div class="form" style="margin-top:12px"><div class="row"><button class="btn blue" id="rv-save" style="flex:1">Save</button></div></div>
      <div class="rv-links">
        <button class="link" id="rv-young" title="A young buck nobody’s going to name: out of Review for good, still counted as a buck">Young buck, not tracking</button>
        <button class="link" id="rv-reject" title="Not a buck, or antlers not visible enough to ID">Not a buck / can't tell</button>
        ${solo ? '' : '<button class="link" id="rv-skip">Skip</button>'}
        <button class="link" id="rv-full">Full photo</button>
      </div>
      ${d.match_reason && d.buck_id ? `<details><summary>Why the AI guessed ${esc(d.buck_name)}</summary><div class="meta">${esc(d.match_reason)}</div></details>` : ''}
      <details><summary>Details</summary><div class="meta">${[weatherLine(d), `${d.size_pct}% of frame`, d.quality ? `${d.quality} photo` : null,
        d.rack?.distinctive_features?.length ? `features: ${d.rack.distinctive_features.join('; ')}` : null].filter(Boolean).map(esc).join(' · ')}</div></details>
      ${solo ? '' : `<h3 style="display:flex; align-items:center; gap:10px">Queue
        <select id="rv-sort" style="margin-left:auto; font-size:13px; padding:6px 10px">
          ${[['similar', 'Look-alikes together'], ['size', 'Biggest first'], ['newest', 'Newest first']].map(([k, l]) => `<option value="${k}" ${sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn small" id="rematch" title="Re-match the queue against your named bucks">Re-run matching</button></h3>
      <div class="strip">${rv.items.map((x, j) => `<img src="${x.crop}" data-jump="${j}" class="${j === rv.i ? 'cur' : ''}" loading="lazy" alt="">`).join('')}</div>`}
    </div></div>`;
  const strip = $('.strip'), cur = $('.strip img.cur');  // scroll the strip sideways only, never the page
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2;
  const order = await api(`/api/detections/${d.id}/candidates`).catch(() => []);
  if (rv.items[rv.i]?.id !== d.id || !$('#rv-cands')) return;
  const present = bucks.filter(b => !b.absent && b.status === 'alive');
  const rank = Object.fromEntries(order.map((c, j) => [c.id, j]));
  rv.cands = present.slice().sort((a, b) => (b.id === d.buck_id) - (a.id === d.buck_id) || (rank[a.id] ?? 99) - (rank[b.id] ?? 99));
  const past = bucks.filter(b => b.absent);
  $('#rv-cands').innerHTML = rv.cands.map(b => cand(b, d)).join('') +
    `<button class="cand" data-new><div class="plus">+</div><b>New buck</b><small>&nbsp;</small></button>`;
  $('#rv-past').innerHTML = past.length ? `<div class="meta" style="margin-top:8px">Not seen yet this season</div>
    <div class="cands">${past.map(b => cand(b, d, true)).join('')}</div>
    <button class="btn small" id="rv-returning" title="Ask the AI whether this is one of the bucks from earlier seasons (takes ~20 s)">Is he one of these?</button>
    <span class="meta" id="rv-returning-out"></span>` : '';
  if (!rv.cands.length && !past.length) pickNew();
  refreshPick();
}

function cand(b, d, isPast = false) {
  const sub = b.id === d.buck_id && d.match_confidence != null ? `<small class="sug">AI guess ${Math.round(d.match_confidence * 100)}%</small>`
    : isPast ? `<small>${esc(seasonLabel(b.last_season))}</small>` : `<small>${b.generic ? 'auto-group' : `${b.visits} visit${b.visits === 1 ? '' : 's'}`}</small>`;
  return `<button class="cand ${isPast ? 'past' : ''}" data-pick="${b.id}" title="${esc(b.season_notes || b.notes || '')}">
    ${b.thumb ? `<img src="${b.thumb}" alt="">` : '<div class="plus"></div>'}<b>${esc(b.name)}${star(b)}</b>${sub}</button>`;
}

function pickNew() {
  rv.pick = 'new';
  $('#rv-new').style.display = '';
  refreshPick();
  $('#rv-name').focus();
}

function refreshPick() {
  $$('.cand').forEach(c => c.classList.toggle('sel', rv.pick === 'new' ? c.dataset.new !== undefined : Number(c.dataset.pick) === rv.pick));
  if (rv.pick !== 'new') $('#rv-new').style.display = 'none';
  const b = bucks.find(x => x.id === rv.pick);
  const save = $('#rv-save');
  save.textContent = rv.pick === 'new' ? `Save new buck${$('#rv-name').value.trim() ? ` “${$('#rv-name').value.trim()}”` : ''}` : b ? `That's ${b.name}` : 'Pick who this is';
  save.disabled = !rv.pick || (rv.pick === 'new' && !$('#rv-name').value.trim());
  const cmpBtn = $('#rv-compare');
  cmpBtn.style.display = b ? '' : 'none';
  if (b) cmpBtn.textContent = `Compare with ${b.name} side by side`;
  $('#rv-old-notes').textContent = b?.absent ? 'Picking him ties this season to his history and starts a search for his other photos this season.'
    : b?.season_notes ? `Already noted for ${b.name} this season: ${b.season_notes}. Anything you add is appended.` : '';
}

async function reviewClick(e) {
  const d = rv.items[rv.i];
  const t = e.target.closest('button, img[data-jump], #rv-img');
  if (!t || !d) return;
  if (t.dataset.pick) { rv.pick = Number(t.dataset.pick); return refreshPick(); }
  if (t.dataset.new !== undefined) return pickNew();
  if (t.dataset.jump) { rv.i = Number(t.dataset.jump); return renderReview(); }
  if (t.id === 'rv-img') { t.src = t.src.endsWith(d.crop) ? d.photo : d.crop; return; }
  if (t.id === 'rv-full') { $('#lightbox img').src = d.photo; $('#lightbox').style.display = 'flex'; return; }
  if (t.id === 'rv-skip') { rv.i = (rv.i + 1) % rv.items.length; return renderReview(); }
  if (t.id === 'rematch') { try { await post('/api/identify'); } catch { /* already running */ } return watchJob(); }
  if (t.id === 'rv-young') {
    await post('/api/detections/untrack', { ids: [d.id] });
    toast('Left unnamed as a young buck');
    return afterReview();
  }
  if (t.id === 'rv-reject') {
    await post(`/api/detections/${d.id}/reject`);
    toast('Marked as not usable');
    return afterReview();
  }
  if (t.id === 'rv-returning') {
    t.disabled = true;
    const b = await askReturning(d.id, $('#rv-returning-out'));
    if (rv.items[rv.i]?.id !== d.id) return;
    t.disabled = false;
    if (b && rv.pick !== 'new') { rv.pick = b.id; refreshPick(); }
    return;
  }
  if (t.id === 'rv-ideas') {
    t.disabled = true; t.textContent = 'Thinking…';
    try {
      const ideas = await post(`/api/detections/${d.id}/name-ideas`, { notes: $('#rv-notes').value });
      if (rv.items[rv.i]?.id !== d.id) return;
      $('#rv-ideas-out').innerHTML = ideas.map(i => `<button class="chip" data-idea="${esc(i.name)}" title="${esc(i.why)}">${esc(i.name)}</button>`).join('');
      t.textContent = 'More ideas';
    } catch { t.textContent = 'Try again'; }
    t.disabled = false;
    return;
  }
  if (t.dataset.idea) {
    $('#rv-name').value = t.dataset.idea;
    $$('#rv-ideas-out .chip').forEach(x => x.classList.toggle('sel', x === t));
    return refreshPick();
  }
  if (t.id === 'rv-save') return saveReview();
  if (t.id === 'rv-compare') return openCompare(d, rv.pick);
}

// Side by side: the photo under review and a candidate's photos (his most alike first), and, on request,
// the buck model's opinion. "That's him" saves the review as him.
async function openCompare(d, buckId) {
  closeCompare();
  const box = document.createElement('div');
  box.className = 'cmp'; box.id = 'cmp';
  box.innerHTML = `<div class="cmp-box">${LOADER}</div>`;
  document.body.append(box);
  let data;
  try { data = await api(`/api/detections/${d.id}/compare/${buckId}`); }
  catch { box.querySelector('.cmp-box').innerHTML = '<div class="meta">Couldn’t load his photos.</div>'; return; }
  const ps = data.photos, name = data.buck.name, member = !document.body.classList.contains('role-viewer');
  let i = 0, full = false, theirsFull = false;
  box.querySelector('.cmp-box').innerHTML = `
    <div class="cmp-head"><h3>Is this ${esc(name)}?</h3><button class="tlm-x" data-cmp="x" title="Close (Esc)">×</button></div>
    <div class="cmp-panes">
      <div class="cmp-pane"><div class="lbl">This photo <span>${esc(d.camera)} · ${esc(when(d.when))}</span></div>
        <div class="cmp-img"><img id="cmp-mine" src="${d.crop}" alt="" title="Tap for the full photo"></div>
        <div class="meta">${esc(rackLine(d.rack))}</div></div>
      <div class="cmp-pane"><div class="lbl">${esc(name)} <span id="cmp-cap"></span></div>
        <div class="cmp-img">${ps.length ? `<img id="cmp-theirs" alt="" title="Tap for the full photo">
          <button class="cmp-nav l" data-cmp="prev" title="Previous (←)">‹</button><button class="cmp-nav r" data-cmp="next" title="Next (→)">›</button>`
          : '<div class="empty" style="color:#ccc">No photos of him yet</div>'}</div>
        <div class="cmp-strip">${ps.map((p, j) => `<img src="${p.crop}" data-cmp-i="${j}" alt="" loading="lazy">`).join('')}</div></div>
    </div>
    <div class="cmp-ai" id="cmp-ai"${ps.length && member ? '' : ' style="display:none"'}>
      <div><button class="btn small" data-cmp="ai">Ask the AI</button>
        <span class="meta">It compares this photo with his ${Math.min(3, ps.length)} most alike photos (one call to the buck model, a few cents).</span></div></div>
    <div class="cmp-acts">${member ? `<button class="btn blue" data-cmp="yes">That’s ${esc(name)}</button>` : ''}
      <button class="btn" data-cmp="x">${member ? 'Not him' : 'Close'}</button></div>`;
  const show = () => {
    const p = ps[i];
    if (!p) return;
    $('#cmp-theirs').src = theirsFull ? p.photo : p.crop;
    $('#cmp-cap').textContent = `${i + 1} of ${ps.length} · ${p.camera || ''} · ${when(p.when)}${p.season !== d.season ? ` · ${seasonLabel(p.season)}` : ''}${p.confirmed ? '' : ' · auto-matched'}`;
    box.querySelector('[data-cmp="prev"]').disabled = i === 0;
    box.querySelector('[data-cmp="next"]').disabled = i === ps.length - 1;
    box.querySelectorAll('.cmp-strip img').forEach((x, j) => x.classList.toggle('cur', j === i));
    box.querySelector('.cmp-strip img.cur')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  };
  show();
  box.onclick = async e => {
    if (e.target === box) return closeCompare();
    const t = e.target.closest('[data-cmp], [data-cmp-i], #cmp-mine, #cmp-theirs');
    if (!t) return;
    if (t.id === 'cmp-mine') { full = !full; t.src = full ? d.photo : d.crop; return; }
    if (t.id === 'cmp-theirs') { theirsFull = !theirsFull; return show(); }
    if (t.dataset.cmpI) { i = Number(t.dataset.cmpI); return show(); }
    const act = t.dataset.cmp;
    if (act === 'x') return closeCompare();
    if (act === 'prev' || act === 'next') { i = Math.max(0, Math.min(ps.length - 1, i + (act === 'next' ? 1 : -1))); return show(); }
    if (act === 'yes') { closeCompare(); rv.pick = buckId; refreshPick(); return saveReview(); }
    if (act === 'ai') {
      const out = $('#cmp-ai');
      t.disabled = true; t.textContent = 'Looking…';
      try {
        const r = await post(`/api/detections/${d.id}/compare/${buckId}`);
        if (!$('#cmp')) return;
        const list = (title, xs) => xs.length ? `<div><b>${title}</b><ul>${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
        out.innerHTML = `<div><span class="cmp-verdict ${r.verdict}">${{ same: 'Same buck', different: 'Different buck', cant_tell: 'Can’t tell' }[r.verdict]}</span>
            <span class="meta">${Math.round(r.confidence * 100)}% sure · it compared ${r.refs.length} of his photos</span></div>
          <div>${esc(r.explanation)}</div>${list('What agrees', r.same_features)}${list('What doesn’t', r.conflicting_features)}
          <details><summary>What it saw</summary><div class="meta">This photo: ${esc(r.new_photo_rack)}<br>${esc(name)}: ${esc(r.candidate_rack)}</div></details>
          <div class="meta">The AI’s matching is often unsure; trust what you see.</div>`;
        // show his photos in the order it looked at them
        const first = ps.findIndex(p => p.id === r.refs[0]);
        if (first >= 0) { i = first; show(); }
      } catch (err) { t.disabled = false; t.textContent = 'Try again'; out.insertAdjacentHTML('beforeend', `<div class="bad">${esc(err.detail || 'The AI check failed')}</div>`); }
    }
  };

  TL.cmpKey = e => {
    if (!$('#cmp')) return;
    if (e.key === 'Escape') closeCompare();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); i = Math.max(0, Math.min(ps.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1))); show(); }
  };
  addEventListener('keydown', TL.cmpKey);
}
function closeCompare() {
  $('#cmp')?.remove();
  if (TL.cmpKey) { removeEventListener('keydown', TL.cmpKey); TL.cmpKey = null; }
}

async function saveReview() {
  const d = rv.items[rv.i], notes = $('#rv-notes').value, name = $('#rv-name').value.trim();
  if (!rv.pick || (rv.pick === 'new' && !name)) return;
  const body = rv.pick === 'new' ? { new_name: name, notes } : { buck_id: rv.pick, notes };
  $('#rv-save').disabled = true;
  let res;
  try { res = await post(`/api/detections/${d.id}/assign`, body); }
  catch { $('#rv-save').disabled = false; toast('Save failed; try again.'); return; }
  const who = rv.pick === 'new' ? name : bucks.find(b => b.id === rv.pick)?.name;
  toast(`Saved as ${esc(who)}${res.searching ? '. Looking for his other photos…' : ''}`);
  if (res.searching) watchJob();
  afterReview();
}

async function afterReview() {
  // Same-burst photos may have been assigned too, so reload the queue and stay at this position.
  rvModalDirty = true;
  if (rvModal && view !== 'review') return closeReviewModal();  // one photo from the Gallery: done
  const at = rv.i;
  await loadReview();
  rv.i = Math.min(at, Math.max(0, rv.items.length - 1));
  renderReview();
  refreshCounts();
}

async function askReturning(detId, out) {
  out.textContent = 'Comparing with earlier seasons…';
  try {
    const r = await post(`/api/detections/${detId}/returning`);
    const b = bucks.find(x => x.id === r.match);
    out.textContent = b ? `Maybe ${b.name} from ${seasonLabel(r.season)} (${Math.round(r.confidence * 100)}%): ${r.reason}` : `No likely match: ${r.reason}`;
    return b;
  } catch (err) { out.textContent = err.detail || 'Check failed; try again.'; }
}

document.addEventListener('input', e => {
  if (e.target.id === 'rv-name') { if (e.target.value.trim()) rv.pick = 'new'; refreshPick(); }

let lmap = null, placing = null, aiming = null, mapBuck = '';
// The map library loads from the internet only when the Map is opened, so the rest works offline.
let leaflet = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(true);
  leaflet ??= new Promise(resolve => {
    const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' });
    const js = Object.assign(document.createElement('script'), { src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' });
    const done = ok => { if (!ok) leaflet = null; resolve(ok); };
    js.onload = () => done(true); js.onerror = () => done(false);
    setTimeout(() => done(!!window.L), 15000);
    document.head.append(css, js);
  });
  return leaflet;
}

async function showMap() {
  if (lmap) { lmap.remove(); lmap = null; }
  placing = null; aiming = null;
  bucks = await api(`/api/bucks?season=${season()}`);
  const data = await api(`/api/map?season=${season()}${mapBuck ? `&buck_id=${mapBuck}` : ''}`);
  const cams = data.cameras, placed = cams.filter(c => c.lat != null);
  $('#main').innerHTML = `<h1 class="title" style="display:flex;align-items:center;gap:14px">Place cameras <button class="btn small" data-go="engine">‹ Engine Room</button></h1><div class="mapwrap"><div id="map"></div><aside class="mapside">
    <div class="form" style="margin:12px 0"><div class="row"><select id="map-buck"><option value="">All named bucks</option>${bucks.filter(b => !b.generic).map(b =>
      `<option value="${b.id}" ${String(b.id) === mapBuck ? 'selected' : ''}>${esc(b.name)}${b.tag === 'target' ? ' ★' : ''}</option>`).join('')}</select></div>
      <div class="row"><input id="map-search" placeholder="Find a place, or paste lat, lon"><button class="btn small" id="map-go">Go</button></div></div>
    <div id="map-msg" class="meta" style="color:var(--accent)"></div>
    <h3>Cameras</h3>
    ${cams.map(c => `<div class="camrow"><div><b>${esc(c.name)}</b><div class="meta">${c.lat != null
        ? `${c.visits} visit${c.visits === 1 ? '' : 's'} · ${c.daylight} in daylight${c.location_source === 'gps' ? ' · GPS from camera' : ''}` : 'Not on the map yet'}</div></div>
      <div style="display:flex; gap:6px"><button class="btn small" data-place="${esc(c.camera_id)}" data-name="${esc(c.name)}">${c.lat != null ? 'Move' : 'Place'}</button>
        ${c.lat != null ? `<button class="btn small" data-aim="${esc(c.camera_id)}" data-name="${esc(c.name)}" title="Which way it faces: tap the feeder">${c.heading != null ? `Facing ${cardinal(c.heading)}` : 'Aim'}</button>` : ''}
        ${c.lat != null ? `<button class="btn small" data-unplace="${esc(c.camera_id)}" title="Take the pin off the map">✕</button>` : ''}</div></div>`).join('')}
    <h3>Recent daylight sightings</h3>
    <div class="vlist">${data.daylight.length ? data.daylight.map(v => `<div class="v" data-buck="${v.buck_id}" style="cursor:pointer" title="Open ${esc(v.buck)}">
        <img src="${v.crop}" alt=""><div><div><b>${esc(v.buck)}</b> · ${esc(v.camera)}</div>
        <div class="meta">${lightTag(v.light, `${when(v.local)} · ${v.light_label}`)}</div></div></div>`).join('')
      : '<div class="meta">None this season yet.</div>'}</div>
  </aside></div>`;
  $('#map').innerHTML = LOADER;
  if (!await loadLeaflet() || view !== 'place') {
    if (view === 'place') $('#map').innerHTML = '<div class="empty">The map needs an internet connection (the map library and satellite imagery load online).</div>';
    return;
  }
  $('#map').innerHTML = '';
  lmap = L.map('map', { zoomControl: true });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: 'Imagery © Esri' }).addTo(lmap);
  const saved = JSON.parse(localStorage.getItem('mapView') || 'null');
  if (placed.length) lmap.fitBounds(placed.map(c => [c.lat, c.lon]), { padding: [60, 60], maxZoom: 17 });
  else lmap.setView(saved ? saved.c : [39, -96], saved ? saved.z : 4);
  lmap.on('moveend', () => localStorage.setItem('mapView', JSON.stringify({ c: lmap.getCenter(), z: lmap.getZoom() })));
  const maxV = Math.max(1, ...placed.map(c => c.visits));
  for (const c of placed) {
    const r = 7 + 13 * Math.sqrt(c.visits / maxV);
    const pin = document.createElement('div'); pin.className = 'tlm-pin'; pin.innerHTML = '<div class="tlm-mk"></div>';
    tlMarker(pin, c.heading, 88);
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: 'tlm-icon', html: pin.outerHTML, iconSize: null }), keyboard: false })
      .addTo(lmap)
      .bindTooltip(`<b>${esc(c.name)}</b><br>${c.visits} visit${c.visits === 1 ? '' : 's'} · ${c.daylight} daylight`,
                   { permanent: true, direction: 'right', offset: [r, 0], className: 'camlabel' })
      .bindPopup(`<b>${esc(c.name)}</b>${c.bucks.length ? `<table class="mini" style="margin-top:6px"><tr><th>Buck</th><th>Visits</th><th>Daylight</th></tr>
        ${c.bucks.map(b => `<tr><td>${esc(b.name)}${b.tag === 'target' ? ' ★' : ''}</td><td class="n">${b.visits}</td><td class="n">${b.daylight}</td></tr>`).join('')}</table>`
        : '<div class="meta">No named bucks here yet</div>'}`);
  }
  lmap.on('click', async e => {
    if (aiming) {  // the tap is what the camera looks at (the feeder): its heading is the bearing there
      const c = cams.find(x => x.camera_id === aiming);
      if (c) await post(`/api/cameras/${encodeURIComponent(aiming)}/heading`, { heading: bearing(c.lat, c.lon, e.latlng.lat, e.latlng.lng) });
      aiming = null; arg = null;
      return showMap();
    }
    if (!placing) return;
    await post(`/api/cameras/${encodeURIComponent(placing)}/location`, { lat: e.latlng.lat, lon: e.latlng.lng });
    const id = placing;
    arg = `${id}~aim`;  // next: which way it faces
    showMap();
  });
  // opened from a camera's tile in the Engine Room: start placing (or aiming) that camera straight away
  const [wantId, mode] = (arg || '').split('~'), want = wantId && cams.find(c => c.camera_id === wantId);
  if (want && mode === 'aim' && want.lat != null) { aiming = want.camera_id; $('#map-msg').textContent = `Tap what ${want.name} looks at (the feeder).`; $('#map').classList.add('placing'); }
  else if (want) { placing = want.camera_id; $('#map-msg').textContent = `Tap the map where ${want.name} is.`; $('#map').classList.add('placing'); }
}
// Compass bearing from one point to another, degrees clockwise from north.
function bearing(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dl = (lon2 - lon1) * r, y = Math.sin(dl) * Math.cos(lat2 * r);
  const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}

function bandColor(alt) {

  if (i <= 0) return `rgb(${(i === 0 ? stops[0] : stops.at(-1))[1]})`;
  const [a0, c0] = stops[i - 1], [a1, c1] = stops[i], f = (alt - a0) / (a1 - a0);
  return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f))})`;
}

function tlBisect(arr, t, key = x => x) {  // first index with key >= t
  let lo = 0, hi = arr.length;

function tlPrep(data) {
  data.cameras.forEach((c, i) => { c.color = TL_CAM_COLORS[i % TL_CAM_COLORS.length]; c.photos = []; });
  for (const p of data.photos) if (p[1] != null) data.cameras[p[1]].photos.push(p);
  data.byPhoto = {};
  for (const a of data.animals) (data.byPhoto[a.photo] ??= []).push(a);
  return data;
}

// Sky colors, top and horizon, by sun altitude.
const TL_SKY = [
  [-90, [4, 6, 14], [9, 14, 30]], [-12, [6, 9, 22], [14, 22, 48]], [-7, [12, 18, 46], [34, 40, 84]],
  [-3, [26, 34, 78], [128, 84, 118]], [0, [40, 62, 120], [232, 140, 96]], [4, [52, 98, 170], [246, 190, 130]],
  [12, [56, 116, 196], [160, 200, 238]], [90, [44, 104, 192], [150, 196, 242]],

  const gray = c => { const l = (c[0] + c[1] + c[2]) / 3; return c.map(v => Math.round(v + (l - v) * cover * .7)); };

  const c = TL.sel != null ? TL.data.cameras[TL.sel] : null, p = c ? c.photos[tlBisect(c.photos, t + 1, x => x[0]) - 1] : null;

const TL_BASES = {
  sat: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri' }],

const tlBaseLayer = () => L.tileLayer(...TL_BASES[TL.light ? 'light' : 'sat']);
function tlBasemap(light) {

  const b = $('#tl-base');
  if (b) { b.innerHTML = light ? TL_SVG.moon : TL_SVG.sun; b.title = light ? 'Satellite map' : 'Light map'; }
  $('#tl-map')?.classList.toggle('light', light);

// The camera on the map: the brand's marker, white on satellite and black on the light map. With a known

const MK = '/static/brand/markers/';
function tlMarker(el, heading, size = 84) {

  if (!mk) return;

    <img src="${MK}feeder-${th}.svg" style="left:${d * Math.sin(r) - f / 2}px;top:${-d * Math.cos(r) - f / 2}px;width:${f}px;height:${f}px" alt="">
    <img src="${MK}camera-${th}.svg" style="left:${-S / 2}px;top:${-S / 2}px;width:${S}px;height:${S}px" alt="">`;

// Timeline panel height, for the map's padding and the side panel's room.

// Where each camera's photo card goes: above its pin when there's room, otherwise whichever side
// overlaps the other cards, pins, the strip, the side panel and the timeline least. Every placed camera
// gets a spot, shown or not, so cards don't jump around as photos come and go.
function tlPlaceCards() {
  return;  // cards live in the Cameras tile now; the pins only carry the marker and name
  const small = document.body.classList.contains('tl-float');
  const box = $('#tl-map').getBoundingClientRect(), W = small ? 112 : 208, H = small ? 106 : 176;
  if (!box.width) return;
  if (!box.width) return;
  const rel = sel => {
    const el = $(sel), r = el && el.getBoundingClientRect();
    return r && r.width ? { x: r.left - box.left - 6, y: r.top - box.top - 6, w: r.width + 12, h: r.height + 12 } : null;
  };
  const ui = ['#tlm-strip', '#tlm-filter', '#tlm-latest', '#tlm-follow', '#tlm-side', '#tl-panel', '#tlm-note', '#tl-map .leaflet-control-zoom', '#tabs'].map(rel).filter(Boolean);
  const pins = Object.values(TL.pins).map(p => ({ p, pt: TL.map.latLngToContainerPoint(p.marker.getLatLng()), nameW: p.el.querySelector('.tlm-name').offsetWidth || 90 }));
  // [card left, card top] relative to the pin, and how much less we like it than straight above
  const near = [[-W / 2, -H - 44, 0], [20, -H - 24, 3], [-W - 20, -H - 24, 3], [40, -H / 2, 5], [-W - 40, -H / 2, 5],

  // the same directions further out, joined to the pin by a thin line, when the close spots are taken
  const spots = [...near, ...near.map(([x, y, k]) => [x + Math.sign(x + W / 2) * 70, y + Math.sign(y + H / 2) * 50, k + 12])];
  const camBox = 52;  // the marker with its cone
  const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  const frame = { x: 0, y: 0, w: box.width, h: box.height };
  const rect = (q, s) => ({ x: q.pt.x + s[0], y: q.pt.y + s[1], w: W, h: H });
  const chosen = new Map();
  const cost = (q, s) => {
    const r = rect(q, s);
    let k = (W * H - inter(r, frame)) * 2 + s[2] * 300;
    for (const u of ui) k += inter(r, u) * 10;
    for (const o of pins) {
      if (o === q) continue;
      k += inter(r, { x: o.pt.x - camBox, y: o.pt.y - camBox, w: camBox * 2, h: camBox * 2 }) * 12;
      k += inter(r, { x: o.pt.x + 12, y: o.pt.y - 14, w: o.nameW, h: 28 }) * 6;  // its name, shown while it has no fresh photo
      if (chosen.has(o)) k += inter(r, rect(o, chosen.get(o))) * 14;

      chosen.set(q, best);
    }
  }
  for (const q of pins) {
    const s = chosen.get(q);
    q.p.el.style.setProperty('--cx', `${s[0]}px`);
    q.p.el.style.setProperty('--cy', `${s[1]}px`);
    // leader line from the pin to the card's nearest edge
    const ex = Math.max(s[0], Math.min(0, s[0] + W)), ey = Math.max(s[1], Math.min(0, s[1] + H)), len = Math.hypot(ex, ey);

}

function tlCamHover(ci, row) {

// Play inside the viewer: the selected camera's photos one after another, about one a second.

function tlSelect(ci) {

// The side panel: the selected camera's photo at the moment, with what's in it.
function tlSide(t) {

    return `<${fix ? 'button' : 'span'} class="tlm-chip${fix ? ' fix' : ''}" data-id="${a.id}" style="--k:${k.color}"${fix ? ' title="Wrong? Say what it is"' : ''}>${TL_SVG[a.kind]}${esc(tlName(a))}${fix ? '<em>▾</em>' : ''}</${fix ? 'button' : 'span'}>`;
  }).join('') + '<div class="tlm-fix" id="tlm-fix"></div>' : src ? '<span class="meta">No animals found in this photo</span>' : '';
  const deer = anims.filter(a => !a.buck && a.kind !== 'other').sort((a, b) => TL_KINDS[b.kind].rank - TL_KINDS[a.kind].rank)[0];
