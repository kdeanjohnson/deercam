    main.innerHTML = `<h1 class="title">Review</h1><div class="empty">Nothing to review. New buck photos show up here after each check.</div>`;
    return;
  }
  const d = rv.items[rv.i];
  // The AI's pick is only a guess here (sure matches never reach Review), so nothing is preselected.
  rv.pick = null; rv.newName = '';
  const sort = localStorage.getItem('reviewSort') || 'similar';
  main.innerHTML = `<div class="review" data-det="${d.id}">
    <div class="rv-photo"><img id="rv-img" src="${d.crop}" alt="" title="Tap to switch between the close-up and the full photo">
      <div class="rv-top"><span>${d.match_status === 'review' ? `${rv.i + 1} of ${rv.items.length}` : 'Not in the review queue'}</span><span>${esc(d.camera)}</span></div></div>
    <div class="pad rv-panel">
      <button class="link" data-go="review" style="padding:0; margin-bottom:6px">‹ All photos to review</button>
      <div class="rv-head"><b>${esc(rackLine(d.rack))}</b>
        <div class="meta">${esc(d.camera)} · ${esc(when(d.when))}${d.age_class && d.age_class !== 'unknown' ? ` · ~${esc(d.age_class)}${/^\d/.test(d.age_class) ? ' yrs' : ''}` : ''}</div></div>
      ${d.summary ? `<div class="meta" style="margin-top:8px; font-style:italic">“${esc(d.summary)}”</div>` : ''}
      ${d.antlers === 'unclear' ? '<div class="hint">Antlers were unclear on a second look; this may not be usable.</div>' : ''}
      <div class="q">Who is this?</div>
      <div class="cands" id="rv-cands"><div class="meta">Loading…</div></div>
      <div id="rv-past"></div>
      <div id="rv-new" style="display:none" class="form">
        <div class="row"><input id="rv-name" placeholder="New buck's name" autocomplete="off"><button class="btn small" id="rv-ideas" title="Ask the AI for nickname ideas based on this photo">Suggest names</button></div>
        <div class="ideas" id="rv-ideas-out"></div>
      </div>
      <details id="rv-notes-wrap" style="margin-top:6px"><summary>Add rack features (optional)</summary>
        <textarea id="rv-notes" rows="2" placeholder="e.g. right brow tine missing; kicker off left G2"
                  title="Saved with the buck for this season"></textarea>
        <div class="meta" id="rv-old-notes"></div></details>
      <div class="form" style="margin-top:12px"><div class="row"><button class="btn blue" id="rv-save" style="flex:1">Save</button></div></div>
      <div class="rv-links">
        <button class="link" id="rv-reject" title="Not a buck, or antlers not visible enough to ID">Not a buck / can't tell</button>
        <button class="link" id="rv-skip">Skip</button>
        <button class="link" id="rv-full">Full photo</button>
      </div>
      ${d.match_reason && d.buck_id ? `<details><summary>Why the AI guessed ${esc(d.buck_name)}</summary><div class="meta">${esc(d.match_reason)}</div></details>` : ''}
      <details><summary>Details</summary><div class="meta">${[weatherLine(d), `${d.size_pct}% of frame`, d.quality ? `${d.quality} photo` : null,
        d.rack?.distinctive_features?.length ? `features: ${d.rack.distinctive_features.join('; ')}` : null].filter(Boolean).map(esc).join(' · ')}</div></details>
      <h3 style="display:flex; align-items:center; gap:10px">Queue
        <select id="rv-sort" style="margin-left:auto; font-size:13px; padding:6px 10px">
          ${[['similar', 'Look-alikes together'], ['size', 'Biggest first'], ['newest', 'Newest first']].map(([k, l]) => `<option value="${k}" ${sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn small" id="rematch" title="Re-match the queue against your named bucks">Re-run matching</button></h3>
      <div class="strip">${rv.items.map((x, j) => `<img src="${x.crop}" data-jump="${j}" class="${j === rv.i ? 'cur' : ''}" loading="lazy" alt="">`).join('')}</div>
    </div></div>`;
  const strip = $('.strip'), cur = $('.strip img.cur');  // scroll the strip sideways only, never the page
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2;
  const order = await api(`/api/detections/${d.id}/candidates`).catch(() => []);
  if (rv.items[rv.i]?.id !== d.id || !$('#rv-cands')) return;
  const present = bucks.filter(b => !b.absent && b.status === 'alive');
  const rank = Object.fromEntries(order.map((c, j) => [c.id, j]));
  rv.cands = present.slice().sort((a, b) => (b.id === d.buck_id) - (a.id === d.buck_id) || (rank[a.id] ?? 99) - (rank[b.id] ?? 99));
  const past = bucks.filter(b => b.absent);
  $('#rv-cands').innerHTML = rv.cands.map(b => cand(b, d)).join('') +
    `<button class="cand" data-new><div class="plus">+</div><b>New buck</b><small>&nbsp;</small></button>`;
  $('#rv-past').innerHTML = past.length ? `<div class="meta" style="margin-top:8px">Not seen yet this season</div>
    <div class="cands">${past.map(b => cand(b, d, true)).join('')}</div>
    <button class="btn small" id="rv-returning" title="Ask the AI whether this is one of the bucks from earlier seasons (takes ~20 s)">Is he one of these?</button>
    <span class="meta" id="rv-returning-out"></span>` : '';
  if (!rv.cands.length && !past.length) pickNew();
  refreshPick();
}

function cand(b, d, isPast = false) {
  const sub = b.id === d.buck_id && d.match_confidence != null ? `<small class="sug">AI guess ${Math.round(d.match_confidence * 100)}%</small>`
    : isPast ? `<small>${esc(seasonLabel(b.last_season))}</small>` : `<small>${b.generic ? 'auto-group' : `${b.visits} visit${b.visits === 1 ? '' : 's'}`}</small>`;
  return `<button class="cand ${isPast ? 'past' : ''}" data-pick="${b.id}" title="${esc(b.season_notes || b.notes || '')}">
    ${b.thumb ? `<img src="${b.thumb}" alt="">` : '<div class="plus"></div>'}<b>${esc(b.name)}${star(b)}</b>${sub}</button>`;
}

function pickNew() {
  rv.pick = 'new';
  $('#rv-new').style.display = '';
  refreshPick();
  $('#rv-name').focus();
}

function refreshPick() {
  $$('.cand').forEach(c => c.classList.toggle('sel', rv.pick === 'new' ? c.dataset.new !== undefined : Number(c.dataset.pick) === rv.pick));
  if (rv.pick !== 'new') $('#rv-new').style.display = 'none';
  const b = bucks.find(x => x.id === rv.pick);
  const save = $('#rv-save');
  save.textContent = rv.pick === 'new' ? `Save new buck${$('#rv-name').value.trim() ? ` “${$('#rv-name').value.trim()}”` : ''}` : b ? `That's ${b.name}` : 'Pick who this is';
  save.disabled = !rv.pick || (rv.pick === 'new' && !$('#rv-name').value.trim());
  $('#rv-old-notes').textContent = b?.absent ? 'Picking him ties this season to his history and starts a search for his other photos this season.'
    : b?.season_notes ? `Already noted for ${b.name} this season: ${b.season_notes}. Anything you add is appended.` : '';
}

async function reviewClick(e) {
  const d = rv.items[rv.i];
  const t = e.target.closest('button, img[data-jump], #rv-img');
  if (!t || !d) return;
  if (t.dataset.pick) { rv.pick = Number(t.dataset.pick); return refreshPick(); }
  if (t.dataset.new !== undefined) return pickNew();
  if (t.dataset.jump) { rv.i = Number(t.dataset.jump); return renderReview(); }
  if (t.id === 'rv-img') { t.src = t.src.endsWith(d.crop) ? d.photo : d.crop; return; }
  if (t.id === 'rv-full') { $('#lightbox img').src = d.photo; $('#lightbox').style.display = 'flex'; return; }
  if (t.id === 'rv-skip') { rv.i = (rv.i + 1) % rv.items.length; return renderReview(); }
  if (t.id === 'rematch') { try { await post('/api/identify'); } catch { /* already running */ } return watchJob(); }
  if (t.id === 'rv-reject') {
    await post(`/api/detections/${d.id}/reject`);
    toast('Marked as not usable');
    return afterReview();
  }
  if (t.id === 'rv-returning') {
    t.disabled = true;
    const b = await askReturning(d.id, $('#rv-returning-out'));
    if (rv.items[rv.i]?.id !== d.id) return;
    t.disabled = false;
    if (b && rv.pick !== 'new') { rv.pick = b.id; refreshPick(); }
    return;
  }
  if (t.id === 'rv-ideas') {
    t.disabled = true; t.textContent = 'Thinking…';
    try {
      const ideas = await post(`/api/detections/${d.id}/name-ideas`, { notes: $('#rv-notes').value });
      if (rv.items[rv.i]?.id !== d.id) return;
      $('#rv-ideas-out').innerHTML = ideas.map(i => `<button class="chip" data-idea="${esc(i.name)}" title="${esc(i.why)}">${esc(i.name)}</button>`).join('');
      t.textContent = 'More ideas';
    } catch { t.textContent = 'Try again'; }
    t.disabled = false;
    return;
  }
  if (t.dataset.idea) {
    $('#rv-name').value = t.dataset.idea;
    $$('#rv-ideas-out .chip').forEach(x => x.classList.toggle('sel', x === t));
    return refreshPick();
  }
  if (t.id === 'rv-save') return saveReview();
}

async function saveReview() {
  const d = rv.items[rv.i], notes = $('#rv-notes').value, name = $('#rv-name').value.trim();
  if (!rv.pick || (rv.pick === 'new' && !name)) return;
  const body = rv.pick === 'new' ? { new_name: name, notes } : { buck_id: rv.pick, notes };
  $('#rv-save').disabled = true;
  let res;
  try { res = await post(`/api/detections/${d.id}/assign`, body); }
  catch { $('#rv-save').disabled = false; toast('Save failed; try again.'); return; }
  const who = rv.pick === 'new' ? name : bucks.find(b => b.id === rv.pick)?.name;
  toast(`Saved as ${esc(who)}${res.searching ? '. Looking for his other photos…' : ''}`);
  if (res.searching) watchJob();
  afterReview();
}

async function afterReview() {
  // Same-burst photos may have been assigned too, so reload the queue and stay at this position.
  const at = rv.i;
  await loadReview();
  rv.i = Math.min(at, Math.max(0, rv.items.length - 1));
  renderReview();
  refreshCounts();
}

async function askReturning(detId, out) {
  out.textContent = 'Comparing with earlier seasons…';
  try {
    const r = await post(`/api/detections/${detId}/returning`);
    const b = bucks.find(x => x.id === r.match);
    out.textContent = b ? `Maybe ${b.name} from ${seasonLabel(r.season)} (${Math.round(r.confidence * 100)}%): ${r.reason}` : `No likely match: ${r.reason}`;
    return b;
  } catch (err) { out.textContent = err.detail || 'Check failed; try again.'; }
}

document.addEventListener('input', e => {
  if (e.target.id === 'rv-name') { if (e.target.value.trim()) rv.pick = 'new'; refreshPick(); }
  if (e.target.id === 'rg-name') { rg.newName = e.target.value.trim(); rg.pick = 'new'; refreshBar(); }
});

let lmap = null, placing = null, mapBuck = '';
// The map library loads from the internet only when the Map is opened, so the rest works offline.
let leaflet = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(true);
  leaflet ??= new Promise(resolve => {
    const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' });
    const js = Object.assign(document.createElement('script'), { src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' });
    const done = ok => { if (!ok) leaflet = null; resolve(ok); };
    js.onload = () => done(true); js.onerror = () => done(false);
    setTimeout(() => done(!!window.L), 15000);
    document.head.append(css, js);
  });
  return leaflet;
}

async function showMap() {
  if (lmap) { lmap.remove(); lmap = null; }
  placing = null;
  bucks = await api(`/api/bucks?season=${season()}`);
  const data = await api(`/api/map?season=${season()}${mapBuck ? `&buck_id=${mapBuck}` : ''}`);
  const cams = data.cameras, placed = cams.filter(c => c.lat != null);
  $('#main').innerHTML = `<h1 class="title">Map</h1><div class="mapwrap"><div id="map"></div><aside class="mapside">
    <div class="form" style="margin:12px 0"><div class="row"><select id="map-buck"><option value="">All named bucks</option>${bucks.filter(b => !b.generic).map(b =>
      `<option value="${b.id}" ${String(b.id) === mapBuck ? 'selected' : ''}>${esc(b.name)}${b.tag === 'target' ? ' ★' : ''}</option>`).join('')}</select></div>
      <div class="row"><input id="map-search" placeholder="Find a place, or paste lat, lon"><button class="btn small" id="map-go">Go</button></div></div>
    <div id="map-msg" class="meta" style="color:var(--accent)"></div>
    <h3>Cameras</h3>
    ${cams.map(c => `<div class="camrow"><div><b>${esc(c.name)}</b><div class="meta">${c.lat != null
        ? `${c.visits} visit${c.visits === 1 ? '' : 's'} · ${c.daylight} in daylight${c.location_source === 'gps' ? ' · GPS from camera' : ''}` : 'Not on the map yet'}</div></div>
      <div style="display:flex; gap:6px"><button class="btn small" data-place="${esc(c.camera_id)}" data-name="${esc(c.name)}">${c.lat != null ? 'Move' : 'Place'}</button>
        ${c.lat != null ? `<button class="btn small" data-unplace="${esc(c.camera_id)}" title="Take the pin off the map">✕</button>` : ''}</div></div>`).join('')}
    <h3>Recent daylight sightings</h3>
    <div class="vlist">${data.daylight.length ? data.daylight.map(v => `<div class="v" data-buck="${v.buck_id}" style="cursor:pointer" title="Open ${esc(v.buck)}">
        <img src="${v.crop}" alt=""><div><div><b>${esc(v.buck)}</b> · ${esc(v.camera)}</div>
        <div class="meta">${lightTag(v.light, `${when(v.local)} · ${v.light_label}`)}</div></div></div>`).join('')
      : '<div class="meta">None this season yet.</div>'}</div>
  </aside></div>`;
  $('#map').innerHTML = '<div class="empty">Loading map…</div>';
  if (!await loadLeaflet() || view !== 'map') {
    if (view === 'map') $('#map').innerHTML = '<div class="empty">The map needs an internet connection (the map library and satellite imagery load online).</div>';
    return;
  }
  $('#map').innerHTML = '';
  lmap = L.map('map', { zoomControl: true });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: 'Imagery © Esri' }).addTo(lmap);
  const saved = JSON.parse(localStorage.getItem('mapView') || 'null');
  if (placed.length) lmap.fitBounds(placed.map(c => [c.lat, c.lon]), { padding: [60, 60], maxZoom: 17 });
  else lmap.setView(saved ? saved.c : [39, -96], saved ? saved.z : 4);
  lmap.on('moveend', () => localStorage.setItem('mapView', JSON.stringify({ c: lmap.getCenter(), z: lmap.getZoom() })));
  const maxV = Math.max(1, ...placed.map(c => c.visits));
  for (const c of placed) {
    const r = 7 + 13 * Math.sqrt(c.visits / maxV);
    L.circleMarker([c.lat, c.lon], { radius: r, color: '#fff', weight: 2, fillColor: '#1f6feb', fillOpacity: c.visits ? 0.9 : 0.45 })
      .addTo(lmap)
      .bindTooltip(`<b>${esc(c.name)}</b><br>${c.visits} visit${c.visits === 1 ? '' : 's'} · ${c.daylight} daylight`,
                   { permanent: true, direction: 'right', offset: [r, 0], className: 'camlabel' })
      .bindPopup(`<b>${esc(c.name)}</b>${c.bucks.length ? `<table class="mini" style="margin-top:6px"><tr><th>Buck</th><th>Visits</th><th>Daylight</th></tr>
        ${c.bucks.map(b => `<tr><td>${esc(b.name)}${b.tag === 'target' ? ' ★' : ''}</td><td class="n">${b.visits}</td><td class="n">${b.daylight}</td></tr>`).join('')}</table>`
        : '<div class="meta">No named bucks here yet</div>'}`);
  }
  lmap.on('click', async e => {
    if (!placing) return;
    await post(`/api/cameras/${encodeURIComponent(placing)}/location`, { lat: e.latlng.lat, lon: e.latlng.lng });
    showMap();
  });
}

async function mapClick(e) {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.place) {
    placing = t.dataset.place;
    $('#map-msg').textContent = `Tap the map where ${t.dataset.name} is.`;
    $('#map')?.classList.add('placing');
    $('#map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (t.dataset.unplace) {
    await post(`/api/cameras/${encodeURIComponent(t.dataset.unplace)}/location`, {});
    showMap();
  }
  if (t.id === 'map-go' && lmap) {
    const q = $('#map-search').value.trim();
    const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) return lmap.setView([Number(m[1]), Number(m[2])], 16);
    if (!q) return;
    try {
      const hits = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`).then(r => r.json());
      if (!hits.length) { $('#map-msg').textContent = 'Place not found.'; return; }
      lmap.setView([Number(hits[0].lat), Number(hits[0].lon)], 14);
      $('#map-msg').textContent = '';
    } catch { $('#map-msg').textContent = 'Search failed (no internet?).'; }
  }
}

const TL_RANGES = [['Day', 1, '1D'], ['3 days', 3, '3D'], ['Week', 7, '1W'], ['Month', 30, '1M']];
const TL_SPEEDS = [[1800, '½ h/s'], [3600, '1 h/s'], [3 * 3600, '3 h/s'], [12 * 3600, '12 h/s']];
const HOUR = 3600e3, DAY = 864e5;
const TL = { map: null };

// ---- sun and moon. sunTimes is the same NOAA formula as deercam/sun.py, so labels agree with the rest of the app.
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function sunTimes(ms, lat, lon) {
  const local = new Date(ms + lon / 15 * HOUR);  // local solar day, as in sun.light()
  const y = local.getUTCFullYear(), m = local.getUTCMonth(), d = local.getUTCDate();
  const n = Math.round((Date.UTC(y, m, d) - Date.UTC(y, 0, 1)) / DAY) + 1;
  const g = 2 * Math.PI / 365 * (n - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
             + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const phi = rad(lat);
  const cosHa = Math.cos(rad(90.833)) / (Math.cos(phi) * Math.cos(decl)) - Math.tan(phi) * Math.tan(decl);
  if (cosHa < -1 || cosHa > 1) return null;
  const ha = deg(Math.acos(cosHa)), mid = Date.UTC(y, m, d);
  return { rise: mid + (720 - 4 * (lon + ha) - eq) * 60e3, set: mid + (720 - 4 * (lon - ha) - eq) * 60e3 };
}
function lightAt(ms, lat, lon, shooting = 30) {
  const s = sunTimes(ms, lat, lon);
  if (!s) return null;
  const mr = (ms - s.rise) / 60e3, ms_ = (ms - s.set) / 60e3;
  const kind = mr >= 0 && ms_ <= 0 ? 'day' : (-shooting <= mr && mr < 0) || (0 < ms_ && ms_ <= shooting) ? 'shooting' : 'night';
  const [ref, mins] = Math.abs(mr) <= Math.abs(ms_) ? ['sunrise', mr] : ['sunset', ms_];
  const a = Math.round(Math.abs(mins));
  return { kind, label: `${a < 90 ? `${a} min` : `${(a / 60).toFixed(1)} h`} ${mins >= 0 ? 'after' : 'before'} ${ref}`, ...s };
}
function sunPos(ms, lat, lon) {
  const d = ms / DAY - 10957.5;  // days since J2000
  const g = rad(357.529 + 0.98560028 * d), q = 280.459 + 0.98564736 * d;
  const L = rad(q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)), e = rad(23.439 - 0.00000036 * d);
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ha = rad(((18.697374558 + 24.06570982441908 * d) % 24) * 15 + lon) - ra, phi = rad(lat);
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(ha));
  return { alt: deg(alt), az: (deg(az) + 360) % 360 };
}
const SYNODIC = 29.530588853, NEW_MOON = Date.UTC(2000, 0, 6, 18, 14);
function moonAt(ms) {

  return { illum, waxing, name: names[Math.floor((age / SYNODIC) * 8 + 0.5) % 8] };
}

// Color of the light band on the slider for a sun altitude.
function bandColor(alt) {
  const stops = [[-18, [14, 22, 46]], [-6, [30, 46, 96]], [-1, [92, 86, 160]], [2, [236, 150, 92]], [8, [150, 192, 238]], [30, [170, 206, 244]]];
  let i = stops.findIndex(s => s[0] > alt);
  if (i <= 0) return `rgb(${(i === 0 ? stops[0] : stops.at(-1))[1]})`;
  const [a0, c0] = stops[i - 1], [a1, c1] = stops[i], f = (alt - a0) / (a1 - a0);
  return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f))})`;
}
const skyCover = sky => {
  const s = (sky || '').toLowerCase();
  if (/storm|thunder|rain|shower|drizzle|snow|sleet|fog|overcast/.test(s)) return .85;
  if (/mostly cloudy/.test(s)) return .65;
  if (/cloudy/.test(s)) return .8;
  if (/partly/.test(s)) return .38;
  if (/mostly (clear|sunny)/.test(s)) return .14;
  return 0;
};

// ---- data lookups
function tlBisect(arr, t, key = x => x) {  // first index with key >= t
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (key(arr[m]) < t) lo = m + 1; else hi = m; }
  return lo;
}
function tlOffset(ms) {  // camera clock minus UTC, in minutes
  const o = TL.data.offsets;
  if (!o.length) return -new Date(ms).getTimezoneOffset();
  const i = tlBisect(o, ms + 1, x => x[0]) - 1;
  return o[Math.max(0, i)][1];
}
const tlLocal = ms => new Date(ms + tlOffset(ms) * 60e3);
const tlClock = ms => { const d = tlLocal(ms), h = d.getUTCHours(); return { hm: `${(h % 12) || 12}:${String(d.getUTCMinutes()).padStart(2, '0')}`, ap: h < 12 ? 'AM' : 'PM' }; };
const tlDate = (ms, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => tlLocal(ms).toLocaleDateString('en-US', { ...opts, timeZone: 'UTC' });
const tlStamp = ms => { const c = tlClock(ms); return `${tlDate(ms)}, ${c.hm} ${c.ap}`; };
const tlUtcLabel = ms => { const o = tlOffset(ms); return `UTC${o < 0 ? '−' : '+'}${Math.abs(o / 60)}`; };
function tlWeather(ms) {
  const w = TL.data.weather;
  if (!w.length) return null;
  const i = tlBisect(w, ms, x => x.t), a = w[i - 1], b = w[i];
  const near = !a ? b : !b ? a : (ms - a.t <= b.t - ms ? a : b);
  if (Math.abs(near.t - ms) > 3 * HOUR) return null;
  let temp = near.temp;
  if (a && b && b.t - a.t < 4 * HOUR && a.temp != null && b.temp != null) temp = a.temp + (b.temp - a.temp) * (ms - a.t) / (b.t - a.t);
  return { ...near, temp };
}

// ---- page







function tlWhere() {  // where sun times are worked out: placed cameras' middle, else the ZIP area from Reveal's weather
  const placed = TL.data.cameras.filter(c => c.lat != null), a = TL.data.area;
  if (placed.length) return { lat: placed.reduce((s, c) => s + c.lat, 0) / placed.length, lon: placed.reduce((s, c) => s + c.lon, 0) / placed.length, label: 'the cameras' };
  if (a) return { lat: a.lat, lon: a.lon, label: `ZIP ${a.zip}${a.name ? `, ${a.name}` : ''}` };
  return { lat: 37, lon: -96, label: null };
}

function tlPrep(data) {
  data.cameras.forEach((c, i) => { c.color = TL_CAM_COLORS[i % TL_CAM_COLORS.length]; c.photos = []; });
  for (const p of data.photos) if (p[1] != null) data.cameras[p[1]].photos.push(p);
  data.byPhoto = {};
  for (const a of data.animals) (data.byPhoto[a.photo] ??= []).push(a);
  return data;
}

// ---- Cameras: every photo, newest first, grouped by the cameras' own calendar day. Filter by camera
// and by what's in the photo; tap a photo for full size, or the pin to see that moment on the map.
const TLF_PAGE = 60;
const TLF_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
function tlFeedList() {
  const { cam, what } = TL.feed, by = TL.data.byPhoto;
  return TL.data.photos.filter(p => p[1] != null && (cam == null || p[1] === cam) && (what === 'all'
    || (what === 'animals' ? (by[p[2]] || []).length : (by[p[2]] || []).some(a => a.kind === 'buck')))).reverse()
    .map(p => ({ p, day: tlDate(p[0], { weekday: 'long', month: 'long', day: 'numeric' }), bucks: (by[p[2]] || []).some(a => a.kind === 'buck') }));
}
function tlFeed() {
  const f = TL.feed, d = TL.data, by = d.byPhoto;
  const has = (p, k) => (by[p[2]] || []).some(a => !k || a.kind === k);
  const count = (ci, k) => d.photos.filter(p => p[1] != null && (ci == null || p[1] === ci) && (k === undefined || has(p, k))).length;
  const camChip = (ci, label, color) => `<button class="chip${f.cam === ci ? ' sel' : ''}" data-cam="${ci ?? ''}"${color ? ` style="--c:${color}"` : ''}>${color ? '<i></i>' : ''}${esc(label)}<span>${count(ci).toLocaleString('en-US')}</span></button>`;
  const whatChip = (k, label, n) => `<button class="chip${f.what === k ? ' sel' : ''}" data-what="${k}">${label}<span>${n.toLocaleString('en-US')}</span></button>`;
  f.list = tlFeedList();
  f.days = {};
  for (const x of f.list) { const k = f.days[x.day] ??= { n: 0, bucks: 0 }; k.n++; k.bucks += x.bucks; }
  f.n = 0;
  TL.feedMore?.disconnect();
  $('#tl-feed').innerHTML = `<div class="tlf-bar" id="tlf-bar">
      <div class="chips">${camChip(null, 'All cameras')}${d.cameras.map((c, i) => camChip(i, c.name || c.camera_id, c.color)).join('')}</div>
      <div class="chips">${whatChip('all', 'All photos', count(f.cam))}${whatChip('animals', 'With animals', count(f.cam, null))}${whatChip('bucks', 'Bucks', count(f.cam, 'buck'))}</div>
    </div><div id="tlf-days"></div><div class="tlf-end" id="tlf-end"></div>`;
  $('#tl-feed').scrollTop = 0;
  tlLayout();
  tlFeedPage();
  TL.feedMore = new IntersectionObserver(es => { if (es[0].isIntersecting) tlFeedPage(); }, { root: $('#tl-feed'), rootMargin: '900px' });
  TL.feedMore.observe($('#tlf-end'));
}
function tlFeedPage() {
  const f = TL.feed, days = $('#tlf-days');
  if (!days || f.n >= f.list.length && f.n) return;
  const by = TL.data.byPhoto, cams = TL.data.cameras, page = f.list.slice(f.n, f.n + TLF_PAGE);
  for (const { p, day: key } of page) {
    let grid = days.lastElementChild?.dataset.day === key ? days.lastElementChild.querySelector('.tlf-grid') : null;
    if (!grid) {
      const { n, bucks } = f.days[key];
      days.insertAdjacentHTML('beforeend', `<section data-day="${esc(key)}"><div class="tlf-day"><b>${esc(key)}</b>
        <span>${n.toLocaleString('en-US')} photo${n === 1 ? '' : 's'}${bucks ? ` · ${bucks} with bucks` : ''}</span></div><div class="tlf-grid"></div></section>`);
      grid = days.lastElementChild.querySelector('.tlf-grid');
    }
    const c = cams[p[1]], clock = tlClock(p[0]), anims = by[p[2]] || [];
    // one chip per kind of animal, named bucks by name
    const chips = {};
    for (const a of anims) { const k = a.buck || a.kind; (chips[k] ??= { a, n: 0 }).n++; }
    const what = Object.values(chips).sort((x, y) => TL_KINDS[y.a.kind].rank - TL_KINDS[x.a.kind].rank).map(({ a, n }) => {
      const k = TL_KINDS[a.kind];
      return `<span class="tlm-chip" style="--k:${k.color}">${TL_SVG[a.kind]}${esc(a.buck || k.label.replace(', not labeled yet', ''))}${n > 1 ? ` ×${n}` : ''}</span>`;
    }).join('');
    grid.insertAdjacentHTML('beforeend', `<figure class="tlf-ph" data-src="${esc(p[2])}" data-t="${p[0]}" data-cam="${p[1]}" style="--c:${c.color}">
      <img loading="lazy" decoding="async" alt="" src="${esc(p[2])}">
      <figcaption><span class="tl-tname"><i></i>${esc(c.name || c.camera_id)}</span><span class="tl-age">${clock.hm} ${clock.ap}</span></figcaption>
      <div class="tlf-what">${what}</div><button class="tlf-go" title="See this moment on the map">${TLF_PIN}</button></figure>`);
  }
  f.n += page.length;
  const more = f.n < f.list.length;
  $('#tlf-end').innerHTML = more ? '' : !f.list.length ? 'No photos match.'
    : `That's everything from ${tlDate(TL.data.start, { month: 'long', day: 'numeric' })} on.<button class="btn small" id="tlf-older">Show older photos</button>`;
}
function tlFeedClick(e) {
  const chip = e.target.closest('.chip');
  if (chip) {
    if ('cam' in chip.dataset) TL.feed.cam = chip.dataset.cam === '' ? null : Number(chip.dataset.cam);
    else TL.feed.what = chip.dataset.what;
    return tlFeed();
  }
  if (e.target.closest('#tlf-older')) return tlOlder();
  const ph = e.target.closest('.tlf-ph');
  if (!ph) return;
  if (e.target.closest('.tlf-go')) {
    tlSetMode('map');
    tlSeek(Number(ph.dataset.t));
    tlSelect(Number(ph.dataset.cam));
    return;
  }
  tlOpen(ph.dataset.src);
}
// Load a longer stretch of photos (the map's slider gets it too), keeping the feed where it was.
async function tlOlder() {
  const btn = $('#tlf-older');
  btn.disabled = true; btn.textContent = 'Loading…';
  const days = TL.days + 60;
  let data;
  try { data = tlPrep(await api(`/api/timeline?days=${days}`)); } catch { btn.disabled = false; btn.textContent = 'Try again'; return; }
  if (view !== 'timeline') return;
  if (data.photos.length <= TL.data.photos.length) { $('#tlf-end').textContent = 'No older photos.'; return; }
  const top = $('#tl-feed').scrollTop, shown = TL.feed.n;
  Object.assign(TL, { data, days, dirty: true, pathKey: null });
  tlPanel();
  tlSizeCanvas();
  tlFeed();
  while (TL.feed.n < shown && TL.feed.n < TL.feed.list.length) tlFeedPage();
  $('#tl-feed').scrollTop = top;
}

// A camera's photo full size, with "Who is this?" for an unnamed deer in it.
function tlOpen(src) {
  if (!src) return;
  // The deer most likely to be a buck that has no name yet (the AI may not have been able to tell)
  const deer = (TL.data.byPhoto[src] || []).filter(a => !a.buck && a.kind !== 'other')
    .sort((a, b) => TL_KINDS[b.kind].rank - TL_KINDS[a.kind].rank)[0];
  const tag = $('#lightbox .lb-tag');
  tag.style.display = deer && !document.body.classList.contains('role-viewer') ? '' : 'none';
  tag.textContent = 'Who is this? Tag him ›';
  tag.dataset.det = deer?.id ?? '';
  $('#lightbox img').src = src; $('#lightbox').style.display = 'flex';
}

function tlSetMode(mode) {
  TL.mode = mode === 'cams' ? 'cams' : 'map';
  localStorage.setItem('tlMode', TL.mode);
  $('#tl').classList.toggle('mode-map', TL.mode === 'map');
  $('#tl').classList.toggle('mode-cams', TL.mode === 'cams');
  $$('#tl-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === TL.mode));
  TL.dirty = true;
  if (TL.mode === 'map') { tlSizeCanvas(); tlMapMetrics(); tlMapInit(); }
  else { tlPlay(false); tlSelect(null); tlFeed(); }
}

function tlDestroy() {
  cancelAnimationFrame(TL.raf);
  TL.map?.remove();
  TL.topSize?.disconnect();
  TL.jobSize?.disconnect();
  TL.feedMore?.disconnect();
  Object.assign(TL, { map: null, frame: null, pins: null, amb: null, sel: null, sideSrc: null, pathKey: null, pathLayer: null, legs: [], follow: '', feedMore: null });
  if (TL.onResize) removeEventListener('resize', TL.onResize);
  if (TL.onKey) removeEventListener('keydown', TL.onKey);
  Object.assign(TL, { onResize: null, onKey: null, raf: 0 });
}

function tlLayout() {
  const tl = $('#tl');
  if (!tl) return;
  tl.style.top = `${$('#tl-title').getBoundingClientRect().bottom + 12}px`;
  const bar = $('#tlf-bar');
  if (bar) $('#tl-feed').style.setProperty('--bar-h', `${bar.offsetHeight}px`);
}

// Sky colors, top and horizon, by sun altitude.
const TL_SKY = [
  [-90, [4, 6, 14], [9, 14, 30]], [-12, [6, 9, 22], [14, 22, 48]], [-7, [12, 18, 46], [34, 40, 84]],
  [-3, [26, 34, 78], [128, 84, 118]], [0, [40, 62, 120], [232, 140, 96]], [4, [52, 98, 170], [246, 190, 130]],
  [12, [56, 116, 196], [160, 200, 238]], [90, [44, 104, 192], [150, 196, 242]],
];
function skyAt(alt, cover) {
  let i = TL_SKY.findIndex(k => k[0] > alt);
  if (i <= 0) i = i === 0 ? 1 : TL_SKY.length - 1;
  const a = TL_SKY[i - 1], b = TL_SKY[i], f = Math.min(1, Math.max(0, (alt - a[0]) / (b[0] - a[0])));
  const mix = (x, y) => x.map((v, j) => v + (y[j] - v) * f);
  const gray = c => { const l = (c[0] + c[1] + c[2]) / 3; return c.map(v => Math.round(v + (l - v) * cover * .7)); };
  return { top: gray(mix(a[1], b[1])), low: gray(mix(a[2], b[2])) };
}
function tlScene() {
  if (TL.mode !== 'map') return;
  const t = TL.t, where = tlWhere(), sun = sunPos(t, where.lat, where.lon), moon = moonAt(t), w = tlWeather(t);
  const lt = lightAt(t, where.lat, where.lon), cover = skyCover(w?.sky);
  const dark = Math.min(1, Math.max(0, (-sun.alt - 4) / 10));
  const warm = Math.max(0, 1 - Math.abs(sun.alt - 1) / 9) * (1 - .6 * cover);  // dawn and dusk glow, on the sun's side
  TL.wind = w ? { deg: w.wind_deg, speed: w.wind || 0, rain: /rain|shower|drizzle|storm|thunder/i.test(w.sky || ''), snow: /snow|flurr|sleet/i.test(w.sky || ''), night: sun.alt < -4 } : null;
  tlStrip(t, w, lt, moon, skyAt(sun.alt, cover)); tlMapScene(sun, cover, dark, warm); tlMapCams(t);
}

// ---- map mode
async function tlMapInit() {
  const box = $('#tl-map');
  if (TL.map) { TL.map.invalidateSize(); TL.ambFit(); return; }
  box.innerHTML = '<div class="empty">Loading map…</div>';
  if (!await loadLeaflet()) { box.innerHTML = '<div class="empty">The map needs an internet connection (the map library and satellite imagery load online).</div>'; return; }
  if (view !== 'timeline' || TL.mode !== 'map' || TL.map || !$('#tl-map')) return;
  box.innerHTML = '';
  const m = TL.map = L.map(box, { zoomControl: false, zoomSnap: .25 });
  L.control.zoom({ position: 'topright' }).addTo(m);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: 'Imagery © Esri' }).addTo(m);
  // The light of the moment sits between the imagery and the pins, always covering the visible map.
  const pane = m.createPane('tlamb');
  Object.assign(pane.style, { zIndex: 450, pointerEvents: 'none' });
  const amb = TL.amb = L.DomUtil.create('div', 'tlm-amb', pane);
  amb.innerHTML = '<div class="tlm-shade"></div><div class="tlm-glow"></div><div class="tlm-clouds"></div><canvas class="tlm-wind"></canvas>';
  amb.querySelector('.tlm-clouds').style.backgroundImage = TL.cloudUrl ? `url(${TL.cloudUrl})` : '';
  TL.ambFit = () => {
    const p = m.containerPointToLayerPoint([0, 0]), size = m.getSize(), cv = amb.querySelector('canvas'), dpr = TL.dpr || 1;
    L.DomUtil.setPosition(amb, p);
    TL.ambP = p;
    amb.style.width = `${size.x}px`; amb.style.height = `${size.y}px`;
    if (cv.width !== Math.round(size.x * dpr)) { cv.width = Math.round(size.x * dpr); cv.height = Math.round(size.y * dpr); }
  };
  m.on('move zoom resize viewreset', TL.ambFit);
  m.on('zoomend moveend resize', () => tlPlaceCards());
  m.createPane('tlpath').style.zIndex = 460;  // the followed buck's path: above the light of the moment, under the pins
  const placed = TL.data.cameras.filter(c => c.lat != null), unplaced = TL.data.cameras.filter(c => c.lat == null);
  // Frame the cameras in the open space between the strip at the top and the timeline (again when the timeline changes size).
  TL.frame = () => {
    const phone = innerWidth <= 760, panelH = tlMapMetrics(), where = tlWhere();
    const H = box.clientHeight, top = $('#tlm-top').offsetHeight + 12 + 70, bottom = panelH + 50;
    const squeeze = Math.min(1, H * .75 / (top + bottom));  // small screens: keep some map between the cards
    if (placed.length) m.fitBounds(placed.map(c => [c.lat, c.lon]), {
      paddingTopLeft: [phone ? 40 : 170, top * squeeze], paddingBottomRight: [phone ? 40 : 170, bottom * squeeze], maxZoom: 17 });
    else m.setView([where.lat, where.lon], 12);
  };
  TL.frame();
  TL.pins = {};
  TL.data.cameras.forEach((c, ci) => {
    if (c.lat == null) return;
    const html = `<div class="tlm-pin" style="--c:${c.color}"><div class="tlm-scent"></div><div class="tlm-halo"></div><div class="tlm-ring"></div><div class="tlm-lead"></div><div class="tlm-dot"></div><div class="tlm-at"></div>
      <div class="tlm-name">${esc(c.name || c.camera_id)}</div>
      <div class="tlm-card" data-cam="${ci}"><img alt=""><div class="cap"><span>${esc(c.name || c.camera_id)}</span><span class="tlm-age"></span></div>
        <div class="tlm-seen"></div></div></div>`;
    const marker = L.marker([c.lat, c.lon], { icon: L.divIcon({ className: 'tlm-icon', html, iconSize: null }), keyboard: false }).addTo(m);
    const el = marker.getElement().querySelector('.tlm-pin');
    el.addEventListener('click', e => { if (e.target.closest('.tlm-dot, .tlm-name, .tlm-card')) tlSelect(ci); });
    TL.pins[ci] = { marker, el, src: null, last: null };
  });
  $('#tlm-note').textContent = !placed.length ? 'No cameras are on the map yet. Place them on the Map page.'
    : unplaced.length ? `${unplaced.map(c => c.name || c.camera_id).join(', ')} ${unplaced.length === 1 ? 'isn’t' : 'aren’t'} on the map yet` : '';
  TL.ambFit();
  TL.pathKey = null;
  tlPath();
  tlPlaceCards();
  TL.dirty = true;
}

// Timeline panel height, for the map's padding and the side panel's room.
function tlMapMetrics() {
  const tl = $('#tl'), panel = $('#tl-panel');
  if (!tl || !panel) return 0;
  const h = tl.getBoundingClientRect().bottom - panel.getBoundingClientRect().top;
  tl.style.setProperty('--panel-h', `${h}px`);
  return h;
}

// Where each camera's photo card goes: above its pin when there's room, otherwise whichever side
// overlaps the other cards, pins, the strip, the side panel and the timeline least. Every placed camera
// gets a spot, shown or not, so cards don't jump around as photos come and go.
function tlPlaceCards() {
  if (!TL.map || !TL.pins || TL.mode !== 'map') return;
  const box = $('#tl-map').getBoundingClientRect(), W = 150, H = 112;
  if (!box.width) return;
  const rel = sel => {
    const el = $(sel), r = el && el.getBoundingClientRect();
    return r && r.width ? { x: r.left - box.left - 6, y: r.top - box.top - 6, w: r.width + 12, h: r.height + 12 } : null;
  };
  const ui = ['#tlm-strip', '#tlm-follow', '#tlm-side', '#tl-panel', '#tlm-note', '#tl-map .leaflet-control-zoom'].map(rel).filter(Boolean);
  const pins = Object.values(TL.pins).map(p => ({ p, pt: TL.map.latLngToContainerPoint(p.marker.getLatLng()), nameW: p.el.querySelector('.tlm-name').offsetWidth || 90 }));
  // [card left, card top] relative to the pin, and how much less we like it than straight above
  const near = [[-W / 2, -H - 20, 0], [8, -H - 8, 3], [-W - 8, -H - 8, 3], [18, -H / 2, 5], [-W - 18, -H / 2, 5],
                [-W / 2, 20, 7], [8, 8, 9], [-W - 8, 8, 9]];
  // the same directions further out, joined to the pin by a thin line, when the close spots are taken
  const spots = [...near, ...near.map(([x, y, k]) => [x + Math.sign(x + W / 2) * 70, y + Math.sign(y + H / 2) * 50, k + 12])];
  const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  const frame = { x: 0, y: 0, w: box.width, h: box.height };
  const rect = (q, s) => ({ x: q.pt.x + s[0], y: q.pt.y + s[1], w: W, h: H });
  const chosen = new Map();
  const cost = (q, s) => {
    const r = rect(q, s);
    let k = (W * H - inter(r, frame)) * 2 + s[2] * 300;
    for (const u of ui) k += inter(r, u) * 1.5;
    for (const o of pins) {
      if (o === q) continue;
      k += inter(r, { x: o.pt.x - 14, y: o.pt.y - 14, w: 28, h: 28 }) * 12;
      k += inter(r, { x: o.pt.x + 12, y: o.pt.y - 14, w: o.nameW, h: 28 }) * 2;  // its name, shown while it has no fresh photo
      if (chosen.has(o)) k += inter(r, rect(o, chosen.get(o))) * 3;
    }
    return k;
  };
  pins.sort((a, b) => a.pt.y - b.pt.y);
  for (let pass = 0; pass < 3; pass++) {
    for (const q of pins) {
      chosen.delete(q);
      let best = spots[0], bk = Infinity;
      for (const s of spots) { const k = cost(q, s); if (k < bk) { bk = k; best = s; } }
      chosen.set(q, best);
    }
  }
  for (const q of pins) {
    const s = chosen.get(q);
    q.p.el.style.setProperty('--cx', `${s[0]}px`);
    q.p.el.style.setProperty('--cy', `${s[1]}px`);
    // leader line from the pin to the card's nearest edge
    const ex = Math.max(s[0], Math.min(0, s[0] + W)), ey = Math.max(s[1], Math.min(0, s[1] + H)), len = Math.hypot(ex, ey);
    const lead = q.p.el.querySelector('.tlm-lead');
    lead.style.width = `${Math.max(0, len - 9)}px`;
    lead.style.transform = `rotate(${Math.atan2(ey, ex)}rad) translateX(9px)`;
  }
}

function tlSelect(ci) {
  TL.sel = ci;
  TL.sideSrc = undefined;
  $('#tlm-side').classList.toggle('on', ci != null);
  TL.dirty = true;
  requestAnimationFrame(tlPlaceCards);
}

// The side panel: the selected camera's photo at the moment, with what's in it.
function tlSide(t) {
  const ci = TL.sel, c = TL.data.cameras[ci], ps = c.photos, i = tlBisect(ps, t + 1, x => x[0]) - 1, p = ps[i];
  const side = $('#tlm-side'), tile = side.querySelector('.tl-tile'), age = p ? (t - p[0]) / 60e3 : Infinity;
  side.style.setProperty('--c', c.color);
  $('#tlm-side-name').textContent = c.name || c.camera_id;
  $('#tlm-side-age').textContent = !p ? 'No photos yet' : `${tlStamp(p[0])}${age < 60 ? ` · ${age < 1 ? 'just now' : `${Math.round(age)} min ago`}` : ''}`;
  $('#tlm-prevp').disabled = i <= 0;
  $('#tlm-nextp').disabled = i >= ps.length - 1;
  TL.sideIdx = i;
  const src = p ? p[2] : null;
  if (src === TL.sideSrc) return;
  TL.sideSrc = src;
  const img = tile.querySelector('img'), anims = src ? TL.data.byPhoto[src] || [] : [];
  if (src) { img.classList.remove('in'); img.onload = () => { img.classList.add('in'); tlFitBoxes(tile); }; img.src = src; } else img.removeAttribute('src');
  tile.querySelector('.tl-boxes').innerHTML = src ? tlBoxes(src) : '';
  $('#tlm-side-what').innerHTML = anims.length ? anims.map(a => {
    const k = TL_KINDS[a.kind];
    return `<span class="tlm-chip" style="--k:${k.color}">${TL_SVG[a.kind]}${esc(a.buck || k.label.replace(', not labeled yet', ''))}</span>`;
  }).join('') : src ? '<span class="meta">No animals found in this photo</span>' : '';
  const deer = anims.filter(a => !a.buck && a.kind !== 'other').sort((a, b) => TL_KINDS[b.kind].rank - TL_KINDS[a.kind].rank)[0];
  const tag = $('#tlm-tag');
  tag.style.display = deer && !document.body.classList.contains('role-viewer') ? '' : 'none';
  tag.dataset.det = deer?.id ?? '';
}

const CARDINAL = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const cardinal = d => CARDINAL[Math.round((((d % 360) + 360) % 360) / 45) % 8];

// The strip at the top of the map: the clock on a chip of the sky's color, then light, temperature,
// wind (and which way scent drifts), pressure and moon.
function tlStrip(t, w, lt, moon, sky) {
  const el = $('#tlm-strip');
  if (!el) return;
  const clock = tlClock(t), color = TL_LIGHT[lt?.kind] || '#999';
  const lightName = { day: 'Daylight', shooting: 'Shooting light', night: 'Night' }[lt?.kind] || 'Light unknown';
  const trend = { R: '↑', S: '→', F: '↓' }[w?.trend] || '';
  const r = 8, k = moon.illum, rx = r * Math.abs(1 - 2 * k);
  const calm = !w || w.wind_deg == null || (w.wind || 0) < 1;
  el.innerHTML = `
    <div class="tlm-clock" style="background:linear-gradient(160deg, rgb(${sky.top}), rgb(${sky.low}))"><span>${tlDate(t)}</span><b>${clock.hm}<small>${clock.ap}</small></b></div>
    <div class="tlm-s"><i style="background:${color}"></i><b>${lightName}</b>${lt ? `<span>${lt.label}</span>` : ''}</div>
    <div class="tlm-s"><b>${w?.temp != null ? `${Math.round(w.temp)}°F` : '—'}</b>${w?.dep ? `<span>${w.dep > 0 ? '+' : '−'}${Math.abs(w.dep)}° vs yesterday</span>` : ''}</div>
    <div class="tlm-s">${calm ? '<b>Calm</b>' : `<svg width="18" height="18" viewBox="0 0 18 18"><g transform="rotate(${w.wind_deg} 9 9)"><path d="M9 2v14M5.5 12.5 9 16l3.5-3.5" fill="none" stroke="#15171a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <b>${w.wind_dir || cardinal(w.wind_deg)} ${Math.round(w.wind)} mph</b><span>scent drifts ${cardinal(w.wind_deg + 180)}</span>`}</div>
    ${w?.pressure != null ? `<div class="tlm-s"><b>${w.pressure.toFixed(2)}</b><span>inHg ${trend}</span></div>` : ''}
    <div class="tlm-s"><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="${r}" fill="#d5d8dd"/><path d="M0 ${-r}A${r} ${r} 0 0 ${moon.waxing ? 1 : 0} 0 ${r}A${rx} ${r} 0 0 ${(k > .5) === moon.waxing ? 1 : 0} 0 ${-r}Z" fill="#e6b83a"/></svg>
      <b>${Math.round(k * 100)}%</b></div>`;
}

// A followed buck's moves in the slider's range: one curve per trip between cameras (bending to its
// right, so trips each way stay apart), solid once he's made it by the slider's time, dashed after.
function tlPath() {
  if (!TL.map) return;
  const key = `${TL.follow}|${Math.round(TL.v0 / 6e4)}|${Math.round(TL.v1 / 6e4)}`;
  if (key === TL.pathKey) return;
  TL.pathKey = key;
  TL.pathLayer?.remove();
  TL.pathLayer = null; TL.legs = [];
  const note = $('#tlm-follow');
  if (!TL.follow) { note.innerHTML = ''; return; }
  const cams = TL.data.cameras;
  const visits = [];
  for (const a of TL.data.animals) {
    if (a.buck !== TL.follow || a.cam == null || a.t < TL.v0 || a.t > TL.v1) continue;
    const v = visits.at(-1);
    if (v && v.cam === a.cam && a.t - v.t1 < 2 * HOUR) { v.t1 = a.t; v.n++; } else visits.push({ cam: a.cam, t0: a.t, t1: a.t, n: 1 });
  }
  const layer = TL.pathLayer = L.layerGroup().addTo(TL.map), pairs = {};
  for (let i = 1; i < visits.length; i++) {
    const a = visits[i - 1], b = visits[i], A = cams[a.cam], B = cams[b.cam];
    if (a.cam === b.cam || A.lat == null || B.lat == null) continue;
    const pair = `${a.cam}>${b.cam}`, nth = pairs[pair] = (pairs[pair] || 0) + 1;
    const cos = Math.cos(rad(A.lat)), dx = (B.lon - A.lon) * cos, dy = B.lat - A.lat, bend = .16 + .1 * (nth - 1);
    const cx = (A.lon + B.lon) / 2 + dy * bend / cos, cy = (A.lat + B.lat) / 2 - dx * bend;
    const pts = [];
    for (let j = 0; j <= 24; j++) {
      const u = j / 24, v = 1 - u;
      pts.push([v * v * A.lat + 2 * u * v * cy + u * u * B.lat, v * v * A.lon + 2 * u * v * cx + u * u * B.lon]);
    }
    const line = L.polyline(pts, { pane: 'tlpath', color: '#d97706', weight: 3.5, opacity: .9, lineCap: 'round' })
      .bindTooltip(`${esc(A.name || '')} → ${esc(B.name || '')}<br>${tlStamp(a.t1)} → ${tlStamp(b.t0)}`, { sticky: true }).addTo(layer);
    const ang = deg(Math.atan2(dx, dy));
    const arrow = L.marker(pts[12], { pane: 'tlpath', interactive: false, keyboard: false,
      icon: L.divIcon({ className: '', iconSize: null, html: `<div class="tlm-arrow" style="transform:rotate(${ang}deg)"><svg viewBox="0 0 16 16"><path d="M8 1.5 14 14 8 10.5 2 14z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></div>` }) }).addTo(layer);
    TL.legs.push({ line, arrow, t: b.t0, done: null });
  }
  const n = visits.length, where = new Set(visits.map(v => v.cam)).size;
  note.innerHTML = n ? `<b>${esc(TL.follow)}</b> ${n} visit${n === 1 ? '' : 's'} at ${where} camera${where === 1 ? '' : 's'}, ${TL.legs.length} move${TL.legs.length === 1 ? '' : 's'} in this range`
    : `<b>${esc(TL.follow)}</b> not seen in this range`;
}

// What the slider and the map show: 'all' animals, 'bucks', or one named buck (followed: his moves are drawn on the map).
function tlShow(v) {
  TL.show = v;
  TL.follow = v === 'all' || v === 'bucks' ? '' : v;
  TL.shown = v === 'all' ? TL.data.animals : TL.data.animals.filter(tlShows);
  TL.followAt = TL.follow ? TL.shown.filter(a => a.cam != null) : [];
  $('#tl-show')?.classList.toggle('on', v !== 'all');
  TL.pathKey = null;
  tlDrawTrack();
  TL.dirty = true;
}
const tlShows = a => TL.show === 'all' || (TL.show === 'bucks' ? a.kind === 'buck' : a.buck === TL.show);

function tlMapScene(sun, cover, dark, warm) {
  if (!TL.amb) return;
  const night = Math.min(1, Math.max(0, (-sun.alt + 1) / 9));  // starts dimming right at sunset
  $('#tl-map .leaflet-tile-pane').style.filter =
    `brightness(${(1 - .5 * night - .12 * cover).toFixed(3)}) saturate(${(1 - .55 * night - .3 * cover).toFixed(3)})`;
  TL.amb.querySelector('.tlm-shade').style.background = `rgba(10, 22, 60, ${(.38 * night).toFixed(3)})`;
  // low sun: warm light from its side of the map (north is up)
  const gx = 50 + 60 * Math.sin(rad(sun.az)), gy = 50 - 60 * Math.cos(rad(sun.az));
  TL.amb.querySelector('.tlm-glow').style.background = warm > .02
    ? `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,150,80,${(warm * .38).toFixed(3)}), transparent 75%)` : 'none';
  TL.amb.querySelector('.tlm-clouds').style.opacity = (cover * .22 * (1 - .7 * dark)).toFixed(3);
}

// Each placed camera: a pin, and while its newest photo is under 45 minutes old, that photo above it.
// A new animal sets off a ripple in its color; the glow under a pin grows with the last 3 hours' animals.
function tlMapCams(t) {
  if (!TL.pins) return;
  const as = TL.shown, a0 = tlBisect(as, t - 3 * HOUR, a => a.t), a1 = tlBisect(as, t + 1, a => a.t);
  const scent = tlScent(), fa = TL.follow ? TL.followAt : [], at = fa[tlBisect(fa, t + 1, a => a.t) - 1];
  TL.data.cameras.forEach((c, ci) => {
    const pin = TL.pins[ci];
    if (!pin) return;
    const ps = c.photos, p = ps[tlBisect(ps, t + 1, x => x[0]) - 1], age = p ? (t - p[0]) / 60e3 : Infinity, el = pin.el;
    if (p && pin.src !== p[2]) { pin.src = p[2]; el.querySelector('img').src = p[2]; }
    let recent = 0, newest = null;
    const near = [];
    for (let i = a0; i < a1; i++) {
      const a = as[i];
      if (a.cam !== ci) continue;
      recent++;
      if (t - a.t < 10 * 60e3) { near.push(a); if (!newest || a.t >= newest.t) newest = a; }
    }
    const best = near.sort((a, b) => TL_KINDS[b.kind].rank - TL_KINDS[a.kind].rank)[0];
    el.classList.toggle('fresh', age <= 45);
    el.classList.toggle('hot', !!best);
    el.style.setProperty('--k', best ? TL_KINDS[best.kind].color : '#fff');
    el.style.setProperty('--r', recent ? `${Math.round(40 + 22 * Math.sqrt(recent))}px` : '0px');
    el.querySelector('.tlm-seen').innerHTML = best ? `${TL_SVG[best.kind]}<span>${esc(best.buck || TL_KINDS[best.kind].label.replace(', not labeled yet', ''))}${near.length > 1 ? ` · ${near.length}` : ''}</span>` : '';
    el.querySelector('.tlm-age').textContent = !p ? '' : age < 1 ? 'Just now' : age < 60 ? `${Math.round(age)} min ago` : '';
    if ((newest?.id ?? null) !== pin.last) {
      pin.last = newest?.id ?? null;
      if (newest) {
        const ring = el.querySelector('.tlm-ring');
        ring.style.borderColor = TL_KINDS[newest.kind].color;
        ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
      }
    }
    pin.marker.setZIndexOffset(best ? 1000 : age <= 45 ? 500 : 0);
    const sc = el.querySelector('.tlm-scent');
    if (sc.dataset.k !== scent.key) { sc.dataset.k = scent.key; sc.innerHTML = scent.svg; }
    if (scent.svg) sc.style.transform = `rotate(${scent.to}deg)`;
    const atEl = el.querySelector('.tlm-at');
    atEl.classList.toggle('on', !!at && at.cam === ci);
    if (at && at.cam === ci) {
      const h = (t - at.t) / HOUR;
      atEl.textContent = `${TL.follow} · ${h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : h < 48 ? `${Math.round(h)} h` : `${Math.round(h / 24)} days`} ago`;
    }
  });
  for (const leg of TL.legs || []) {
    const done = leg.t <= t;
    if (done === leg.done) continue;
    leg.done = done;
    leg.line.setStyle({ opacity: done ? .95 : .4, dashArray: done ? null : '2 8' });
    leg.arrow.setOpacity(done ? 1 : .45);
  }
  if (TL.sel != null) tlSide(t);
}

// The downwind wedge drawn under every pin, longer in stronger wind; none when calm.
function tlScent() {
  const w = TL.wind;
  if (!w || w.deg == null || (w.speed || 0) < 1) return { key: 'none', svg: '', to: 0 };
  const len = Math.round(Math.min(160, 50 + 14 * w.speed) / 10) * 10, a = rad(24), x = (len * Math.sin(a)).toFixed(1), y = (-len * Math.cos(a)).toFixed(1);
  return { key: String(len), to: w.deg + 180, svg: `<svg width="${2 * len}" height="${2 * len}" viewBox="${-len} ${-len} ${2 * len} ${2 * len}" style="left:${-len}px; top:${-len}px">
    <defs><radialGradient id="tlsc${len}" cx="0" cy="0" r="${len}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <path d="M0 0L${-x} ${y}A${len} ${len} 0 0 1 ${x} ${y}Z" fill="url(#tlsc${len})"/></svg>` };
}

// A box around each animal found in a photo, labeled with the buck's name or what it is.
const tlBoxes = src => (TL.data.byPhoto[src] || []).filter(a => a.box?.every(v => v != null)).map(a => {
  const [x1, y1, x2, y2] = a.box, k = TL_KINDS[a.kind];
  return `<div class="tl-box" style="left:${x1 * 100}%;top:${y1 * 100}%;width:${(x2 - x1) * 100}%;height:${(y2 - y1) * 100}%;--k:${k.color}"><span>${esc(a.buck || k.label.replace(', not labeled yet', ''))}</span></div>`;
}).join('');

// The photo fills its tile (object-fit: cover, so edges are cropped); size the box layer to the whole
// image as drawn, so animal boxes in 0..1 photo coordinates land on the animal.
function tlFitBoxes(tile) {
  const img = tile.querySelector('img'), layer = tile.querySelector('.tl-boxes');
  if (!img.naturalWidth) return;
  const W = tile.clientWidth, H = tile.clientHeight, k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;

    const vx = w.rain ? dx * .25 : dx, vy = w.rain ? 1 : dy, L2 = len * s.l;
    const gr = g.createLinearGradient(x, y, x - vx * L2, y - vy * L2);
    gr.addColorStop(0, `rgba(255,255,255,${alpha})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = gr; g.lineWidth = (w.rain ? 1 : 1.3) * dpr;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - vx * L2, y - vy * L2); g.stroke();
  }
}

// ------------------------------------------------------------------ engine room (calendar of what came in)
// Every day the cameras sent photos: how many, and how many bucks, does and fawns were in them. Days are
// the cameras' own calendar days. Shade is photo count (one blue ramp, darker = more).

const ER_KINDS = { buck: ['Bucks', '#b7791f'], doe: ['Does', '#c0625a'], fawn: ['Fawns', '#a8843f'] };
const ER_RAMP = ['#e3eefc', '#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef'];  // light steps of the blue ramp, so text stays dark and readable
let er = null;

async function showEngine() {
  const data = await api('/api/engine');
  if (view !== 'engine') return;
  const months = [...new Set(data.days.map(d => d.date.slice(0, 7)))];
  er = { data, months, month: er?.month && months.includes(er.month) ? er.month : months.at(-1), sel: er?.sel ?? data.days.at(-1)?.date,
         byDate: Object.fromEntries(data.days.map(d => [d.date, d])), max: Math.max(1, ...data.days.map(d => d.photos)), codes: erCodes(data.cameras) };
  renderEngine();
}

const erIcon = (k, color) => TL_SVG[k].replace('<svg ', `<svg style="color:${color}" `);
const erShade = n => n ? ER_RAMP[Math.min(ER_RAMP.length - 1, Math.floor(Math.sqrt(n / er.max) * ER_RAMP.length))] : null;
const erFmt = n => n.toLocaleString('en-US');
// Short camera codes for the calendar: one-word names stay (up to 5 letters), longer ones become their
// initials plus any number, e.g. "Harry’s Oats" -> HO, "Ken’s tactacam 1" -> KT1. Made unique if two collide.
const ER_DOTS = ['#2a78d6', '#e07b1f', '#7c5cd6', '#1f9e74', '#d6456b', '#9a8a12', '#4a90b8', '#b8509a'];
function erCodes(cams) {
  const seen = {};
  return cams.map(c => {
    const words = (c.name || c.camera_id).replace(/[’']s\b/gi, '').split(/\s+/).filter(Boolean);
    let code = words.length === 1 ? words[0].slice(0, 5) : words.map(w => /^\d+$/.test(w) ? w : w[0].toUpperCase()).join('');
    seen[code] = (seen[code] || 0) + 1;
    return seen[code] > 1 ? `${code}${seen[code]}` : code;
  });
}

function renderEngine() {
  const { data } = er, t = data.totals;
  if (!data.days.length) { $('#main').innerHTML = '<h1 class="title">Engine Room</h1><div class="empty">No photos yet. Sync from Reveal first.</div>'; return; }
  const labeled = t.buck + t.doe + t.fawn + t.other;
  const tile = (n, label, extra = '') => `<div class="er-tile"><b>${erFmt(n)}</b><span>${label}</span>${extra}</div>`;
  $('#main').innerHTML = `<h1 class="title">Engine Room</h1>
    <div class="er"><div class="er-sub">What's come in from Reveal, day by day. Pick a day for its cameras and hours.</div>
    <div class="er-tiles">
      ${tile(t.photos, `Photos over ${t.days} days`)}
      ${tile(t.detected, 'Checked for animals', `<div class="er-bar"><i style="width:${(100 * t.detected / Math.max(1, t.photos)).toFixed(1)}%"></i></div>`)}
      ${tile(t.animals, 'Animals found')}
      ${Object.entries(ER_KINDS).map(([k, [label, c]]) => tile(t[k], `${erIcon(k, c)}${label}`)).join('')}
    </div>
    <div class="er-wrap"><section id="er-calwrap"></section><aside class="er-side" id="er-side"></aside></div>
    ${!labeled && t.animals ? `<div class="er-note">${erFmt(t.animals)} animals are waiting to be labeled. Bucks, does and fawns are counted once an AI key is added in Settings.</div>` : ''}
    <div class="er-note">A sighting is one deer in one photo, so a buck that stays for ten photos counts ten times. Named bucks are listed per day once you've named them in Review.</div>
    </div>`;
  renderCalendar();
  renderDay();
}

function renderCalendar() {
  const [y, m] = er.month.split('-').map(Number), first = new Date(Date.UTC(y, m - 1, 1)), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const i = er.months.indexOf(er.month), lead = first.getUTCDay();
  const cells = [];
  for (let k = 0; k < lead; k++) cells.push('<div class="er-day out"></div>');
  for (let dd = 1; dd <= days; dd++) {
    const key = `${er.month}-${String(dd).padStart(2, '0')}`, d = er.byDate[key];
    if (!d) { cells.push(`<div class="er-day none"><span class="er-n">${dd}</span></div>`); continue; }
    // Compact: date and buck/doe marks on top, then one line per camera: photos, checked, percent checked.
    const pct = (n, of) => of ? Math.floor(100 * n / of) : 0;
    const marks = (d.buck ? `<span class="er-mk" title="${erFmt(d.buck)} buck sightings">${erIcon('buck', ER_KINDS.buck[1])}${erFmt(d.buck)}</span>` : '')
      + (d.doe ? `<span class="er-mk" title="${erFmt(d.doe)} doe sightings">${erIcon('doe', ER_KINDS.doe[1])}${erFmt(d.doe)}</span>` : '');
    // Same row order every day, so a camera is always on the same line.
    const rows = er.data.cameras.map((c, j) => {
      const n = d.cams[j], done = d.cams_detected[j], pc = pct(done, n);
      return `<span class="er-row${n && pc === 100 ? ' done' : ''}${n ? '' : ' nil'}" title="${esc(c.name)}: ${erFmt(n)} photos, ${erFmt(done)} checked (${pc}%)">
        <i style="width:${n ? pc : 0}%"></i><b><u style="background:${ER_DOTS[j % ER_DOTS.length]}"></u>${esc(er.codes[j])}</b>${n ? `<em>${erFmt(done)}/${erFmt(n)}</em><em>${pc}%</em>` : '<em>—</em><em></em>'}</span>`;
    }).join('');
    cells.push(`<button class="er-day${key === er.sel ? ' sel' : ''}" data-day="${key}" style="--heat:${erShade(d.photos)}">
      <span class="er-top"><span class="er-n">${dd}</span><span class="er-marks">${marks}</span></span>
      <span class="er-tot">${erFmt(d.photos)}<small> photos</small><small class="er-totp">${pct(d.detected, d.photos)}%</small></span>
      <span class="er-rows">${rows}</span></button>`);
  }
  const label = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  $('#er-calwrap').innerHTML = `<div class="er-head"><h2>${label}</h2>
      <button class="er-nav" data-month="-1" ${i <= 0 ? 'disabled' : ''} title="Previous month">‹</button>
      <button class="er-nav" data-month="1" ${i >= er.months.length - 1 ? 'disabled' : ''} title="Next month">›</button>
      <div class="er-scale">Fewer photos ${ER_RAMP.map(c => `<i style="background:${c}"></i>`).join('')} More</div></div>
    <div class="er-key">${er.data.cameras.map((c, j) => `<span class="er-cam-key"><u style="background:${ER_DOTS[j % ER_DOTS.length]}"></u><b>${esc(er.codes[j])}</b> ${esc(c.name || c.camera_id)}</span>`).join('')}</div>
    <div class="er-key">Each line is <b>checked for animals / photos</b> and <b>% checked</b>; the fill turns green when a camera's day is done. ${erIcon('buck', ER_KINDS.buck[1])} marks a day with a buck.</div>
    <div class="er-cal">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="er-dow">${d}</div>`).join('')}${cells.join('')}</div>`;
  $$('#er-calwrap [data-month]').forEach(b => b.onclick = () => { er.month = er.months[i + Number(b.dataset.month)]; renderCalendar(); });
  $$('#er-calwrap [data-day]').forEach(b => {
    b.onclick = () => { er.sel = b.dataset.day; renderCalendar(); renderDay(); };
    b.onmousemove = e => {
      const d = er.byDate[b.dataset.day], tip = $('#tip');
      tip.innerHTML = `<b>${erLong(d.date)}</b><br>${erFmt(d.photos)} photos${er.data.cameras.map((c, j) => d.cams[j] ? `<br>${esc(c.name)}: ${erFmt(d.cams[j])}` : '').join('')}`;
      tip.style.display = 'block'; tip.style.left = `${Math.min(innerWidth - 270, e.clientX + 14)}px`; tip.style.top = `${e.clientY + 14}px`;
    };
    b.onmouseleave = () => { $('#tip').style.display = 'none'; };
  });
}

const erLong = key => new Date(`${key}T12:00:00Z`).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });

function renderDay() {
  const d = er.byDate[er.sel], side = $('#er-side');
  if (!d) { side.innerHTML = '<div class="meta">Pick a day.</div>'; return; }
  const camMax = Math.max(1, ...d.cams), hMax = Math.max(1, ...d.hours);
  const hourLabel = h => `${(h % 12) || 12} ${h < 12 ? 'AM' : 'PM'}`;
  side.innerHTML = `<h3>${erLong(d.date)}</h3>
    <div class="meta">${erFmt(d.photos)} photos · ${erFmt(d.animals)} animals found${d.detected < d.photos ? ` · ${erFmt(d.photos - d.detected)} photos not checked yet` : ''}</div>
    <div class="er-counts">${Object.entries(ER_KINDS).map(([k, [label, c]]) => `<div><b>${erFmt(d[k])}</b><span>${erIcon(k, c)}${label}</span></div>`).join('')}
      <div><b>${erFmt(d.unlabeled + d.other)}</b><span>${erIcon('animal', '#6a7079')}Other</span></div></div>
    <h4>Photos by camera</h4>
    ${er.data.cameras.map((c, j) => `<div class="er-cam"><span>${esc(c.name || c.camera_id)}</span><div><i style="width:${100 * d.cams[j] / camMax}%"></i></div><em>${erFmt(d.cams[j])}</em></div>`).join('')}
    <h4>Photos by hour</h4>
    <div class="er-hours">${d.hours.map((n, h) => `<i style="height:${100 * n / hMax}%" data-h="${h}" data-n="${n}"></i>`).join('')}</div>
    <div class="er-hlabels"><span>12 AM</span><span>6 AM</span><span>Noon</span><span>6 PM</span><span>11 PM</span></div>
    ${d.named.length ? `<h4>Named bucks</h4><div class="er-named">${d.named.map(([n, c]) => `<span>${esc(n)} · ${c}</span>`).join('')}</div>` : ''}
    <button class="btn primary er-open" id="er-open">Open this day in Timeline</button>`;
  $('#er-open').onclick = () => go('timeline', d.noon_ms);
  $$('.er-hours i').forEach(b => {
    b.onmousemove = e => { const tip = $('#tip'); tip.innerHTML = `${hourLabel(+b.dataset.h)}: ${erFmt(+b.dataset.n)} photos`; tip.style.display = 'block'; tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY - 34}px`; };
    b.onmouseleave = () => { $('#tip').style.display = 'none'; };
  });
}
