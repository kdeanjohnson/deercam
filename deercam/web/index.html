const CARDINAL = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const cardinal = d => CARDINAL[Math.round((((d % 360) + 360) % 360) / 45) % 8];

// The strip at the top of the map: the clock on a chip of the sky's color, then light, temperature,
// wind (and which way scent drifts), pressure and moon.
function tlStrip(el, title, t, w, lt, moon, sky, back = false) {
  if (!el) return;
  const clock = tlClock(t), color = TL_LIGHT[lt?.kind] || '#999';
  const small = document.body.classList.contains('tl-float');
  const lightName = (small ? { day: 'Day', shooting: 'Shooting', night: 'Night' } : { day: 'Daylight', shooting: 'Shooting light', night: 'Night' })[lt?.kind]
    || (small ? 'Light ?' : 'Light unknown');
  const trend = { R: '↑', S: '→', F: '↓' }[w?.trend] || '';
  const r = 8, k = moon.illum, rx = r * Math.abs(1 - 2 * k);
  const calm = !w || w.wind_deg == null || (w.wind || 0) < 1;
  const phase = k > .97 ? 'Full moon' : k < .03 ? 'New moon' : moon.waxing ? 'Waxing' : 'Waning';
  const windSvg = `<svg viewBox="0 0 18 18"><g transform="rotate(${w?.wind_deg || 0} 9 9)"><path d="M9 2v14M5.5 12.5 9 16l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  const thermSvg = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 10.6V3.5a2 2 0 0 1 4 0v7.1a3.2 3.2 0 1 1-4 0z"/><path d="M9 7.5v4.5" stroke-width="2.2"/></svg>';
  const gaugeSvg = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 13.5a7 7 0 1 1 12 0"/><path d="M9 11.5 12.2 7"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>';
  el.innerHTML = `<div class="tlm-sh">${title}</div>
    <div class="tlm-clock" style="background:linear-gradient(160deg, rgb(${sky.top}), rgb(${sky.low}))"><span>${tlDate(t)}</span><b>${clock.hm}<small>${clock.ap}</small></b></div>
    <div class="tlm-s"><i style="background:${color}"></i><b>${lightName}</b>${lt ? `<span>${lt.label}</span>` : ''}</div>
    <div class="tlm-s">${thermSvg}<b>${w?.temp != null ? `${Math.round(w.temp)}°${small ? '' : 'F'}` : '—'}</b>${w?.dep ? `<span>${w.dep > 0 ? '+' : '−'}${Math.abs(w.dep)}° vs yesterday</span>` : ''}</div>
    <div class="tlm-s">${calm ? `${windSvg}<b>Calm</b>` : `${windSvg}<b>${w.wind_dir || cardinal(w.wind_deg)} ${Math.round(w.wind)}${small ? '' : ' mph'}</b><span>scent → ${cardinal(w.wind_deg + 180)}</span>`}</div>
    ${w?.pressure != null ? `<div class="tlm-s pr">${gaugeSvg}<b>${w.pressure.toFixed(2)}</b><span>inHg ${trend}</span></div>` : ''}
    <div class="tlm-s"><svg viewBox="-9 -9 18 18"><circle r="${r}" fill="#d5d8dd"/><path d="M0 ${-r}A${r} ${r} 0 0 ${moon.waxing ? 1 : 0} 0 ${r}A${rx} ${r} 0 0 ${(k > .5) === moon.waxing ? 1 : 0} 0 ${-r}Z" fill="#e6b83a"/></svg>
      <b>${Math.round(k * 100)}%</b><span>${phase}</span></div>
    ${back ? '<button class="tlm-golive" title="Back to right now"><i></i>Go live</button>' : ''}`;
}

// A followed buck's moves in the slider's range: one curve per trip between cameras (bending to its
// right, so trips each way stay apart), solid once he's made it by the slider's time, dashed after.
function tlPath() {
  if (!TL.map) return;
  const key = `${TL.follow}|${Math.round(TL.v0 / 6e4)}|${Math.round(TL.v1 / 6e4)}`;
  if (key === TL.pathKey) return;
  TL.pathKey = key;
  TL.pathLayer?.remove();
  TL.pathLayer = null; TL.legs = [];
  const note = $('#tlm-follow');
  if (!TL.follow) { note.innerHTML = ''; return; }
  const cams = TL.data.cameras;
  const visits = [];
  for (const a of TL.data.animals) {
    if (a.buck !== TL.follow || a.cam == null || a.t < TL.v0 || a.t > TL.v1) continue;
    const v = visits.at(-1);
    if (v && v.cam === a.cam && a.t - v.t1 < 2 * HOUR) { v.t1 = a.t; v.n++; } else visits.push({ cam: a.cam, t0: a.t, t1: a.t, n: 1 });
  }
  const layer = TL.pathLayer = L.layerGroup().addTo(TL.map), pairs = {};
  for (let i = 1; i < visits.length; i++) {
    const a = visits[i - 1], b = visits[i], A = cams[a.cam], B = cams[b.cam];
    if (a.cam === b.cam || A.lat == null || B.lat == null) continue;
    const pair = `${a.cam}>${b.cam}`, nth = pairs[pair] = (pairs[pair] || 0) + 1;
    const cos = Math.cos(rad(A.lat)), dx = (B.lon - A.lon) * cos, dy = B.lat - A.lat, bend = .16 + .1 * (nth - 1);
    const cx = (A.lon + B.lon) / 2 + dy * bend / cos, cy = (A.lat + B.lat) / 2 - dx * bend;
    const pts = [];
    for (let j = 0; j <= 24; j++) {
      const u = j / 24, v = 1 - u;
      pts.push([v * v * A.lat + 2 * u * v * cy + u * u * B.lat, v * v * A.lon + 2 * u * v * cx + u * u * B.lon]);
    }
    const line = L.polyline(pts, { pane: 'tlpath', color: '#d97706', weight: 3.5, opacity: .9, lineCap: 'round' })
      .bindTooltip(`${esc(A.name || '')} → ${esc(B.name || '')}<br>${tlStamp(a.t1)} → ${tlStamp(b.t0)}`, { sticky: true }).addTo(layer);
    const ang = deg(Math.atan2(dx, dy));
    const arrow = L.marker(pts[12], { pane: 'tlpath', interactive: false, keyboard: false,
      icon: L.divIcon({ className: '', iconSize: null, html: `<div class="tlm-arrow" style="transform:rotate(${ang}deg)"><svg viewBox="0 0 16 16"><path d="M8 1.5 14 14 8 10.5 2 14z" fill="currentColor" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></div>` }) }).addTo(layer);
    TL.legs.push({ line, arrow, t: b.t0, done: null });
  }
  const n = visits.length, where = new Set(visits.map(v => v.cam)).size;
  note.innerHTML = n ? `<b>${esc(TL.follow)}</b> ${n} visit${n === 1 ? '' : 's'} at ${where} camera${where === 1 ? '' : 's'}, ${TL.legs.length} move${TL.legs.length === 1 ? '' : 's'} in this range`
    : `<b>${esc(TL.follow)}</b> not seen in this range`;
}

// What the slider and the map show: 'all' animals, 'bucks', or one named buck (followed: his moves are drawn on the map).
function tlShow(v) {
  TL.show = v;
  if (TL.sel != null) tlSelect(null);
  TL.follow = v === 'all' || v === 'bucks' || v.startsWith('w:') ? '' : v;
  TL.shown = TL.data.animals.filter(a => tlShows(a) && !TL.hide.has(tlType(a)));
  TL.followAt = TL.follow ? TL.shown.filter(a => a.cam != null) : [];
  tlFollowTile();
  TL.pathKey = null;
  tlDrawTrack();
  TL.dirty = true;
}
// The Follow tile: everyone, or one named buck (his moves between cameras are drawn on the map). Hit list first.
function tlFilterTab(tab) {
  $$('.tlm-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#tlm-kinds').hidden = tab !== 'kinds';
  $('#tlm-bucks').hidden = tab !== 'bucks';
  tlPlaceCards();
}
function tlFollowTile() {
  const el = $('#tlm-bucks');
  if (!el || !TL.data) return;
  const named = {};
  for (const a of TL.data.animals) if (a.buck) { const n = named[a.buck] ??= { target: false, pic: null, last: 0 }; n.target = n.target || a.tag === 'target'; if (a.crop) n.pic = a.crop; n.last = Math.max(n.last, a.t); }
  const since = t => { const m = (Date.now() - t) / 60e3; return m < 60 ? `${Math.max(1, Math.round(m))}m` : m < 48 * 60 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
  const bucks = Object.entries(named).map(([name, n]) => ({ name, ...n })).sort((a, b) => b.target - a.target || a.name.localeCompare(b.name));
  const sig = `${TL.show}|${bucks.map(b => b.name + (b.target ? '*' : '') + (b.pic || '') + since(b.last)).join()}`;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = `<div class="tlm-sh">Follow one buck <span class="r">last seen</span></div>`
    + bucks.map(b => `<button class="tlm-k${TL.show === b.name ? ' on' : ''}" data-show="${esc(b.name)}" title="Follow ${esc(b.name)}: his moves between cameras">${b.pic ? `<img src="${b.pic}" alt="">` : TL_SVG.buck}<em>${esc(b.name)}${b.target ? ' <small>★</small>' : ''}</em><b title="${tlStamp(b.last)}">${since(b.last)}</b></button>`).join('');
}
// Each animal's kind for the filter: buck, doe, fawn, 'w:turkey' etc. for wildlife, 'animal' for not labeled yet.
const tlType = a => a.kind === 'other' ? `w:${a.animal || 'other'}` : a.kind;
// The kinds in the loaded data, in a fixed order: deer, then wildlife most seen first, then not labeled yet.
function tlTypeKeys() {
  const n = {};
  for (const a of TL.data.animals) n[tlType(a)] = (n[tlType(a)] || 0) + 1;
  const wild = Object.keys(n).filter(k => k.startsWith('w:')).sort((a, b) => n[b] - n[a]);
  return [...['buck', 'doe', 'fawn'].filter(k => n[k]), ...wild, ...(n.animal ? ['animal'] : [])];
}
// The Animals tile under the conditions: a row per kind with how many are in the stretch of time in view;
// click one to hide or show it on the map and the slider. Redrawn when the view moves.
function tlTypes() {
  const el = $('#tlm-kinds');
  if (!el || !TL.data) return;
  const keys = tlTypeKeys(), n = {};
  const as = TL.data.animals, i0 = tlBisect(as, TL.v0, a => a.t), i1 = tlBisect(as, TL.v1 + 1, a => a.t);
  for (let i = i0; i < i1; i++) n[tlType(as[i])] = (n[tlType(as[i])] || 0) + 1;
  const sig = keys.map(k => `${k}${TL.hide.has(k) ? '-' : '+'}${n[k] || 0}`).join();
  if (sig === el.dataset.sig) return;
  el.dataset.sig = sig;
  const label = k => k === 'animal' ? 'Not labeled yet' : k.startsWith('w:') ? tlWild(k.slice(2)).plural : TL_KINDS[k].label + 's';
  const icon = k => { const kind = k.startsWith('w:') ? 'other' : k; return `<span style="color:${TL_KINDS[kind].color};display:contents">${k === 'buck' ? RACK_SVG : TL_SVG[kind]}</span>`; };
  const allOn = keys.every(k => !TL.hide.has(k));
  const noneOn = keys.every(k => TL.hide.has(k));
  el.innerHTML = `<div class="tlm-sh">In view <span class="r"><button class="lnk" data-all="on"${allOn ? ' disabled' : ''}>All</button> · <button class="lnk" data-all="off"${noneOn ? ' disabled' : ''}>None</button></span></div>`
    + keys.map(k => `<button class="tlm-k${TL.hide.has(k) ? '' : ' on'}${n[k] ? '' : ' none'}" data-type="${esc(k)}"
      title="${esc(label(k))}: ${n[k] || 0} in view. Alt-click for only these"><span class="box"></span>${icon(k)}<em>${esc(label(k))}</em><b>${n[k] || 0}</b></button>`).join('');
  const row = $('#tl-kinds');
  if (row) row.innerHTML = keys.map(k => `<button class="${TL.hide.has(k) ? '' : 'on'}" data-type="${esc(k)}" title="${TL.hide.has(k) ? 'Show' : 'Hide'} ${esc(label(k))}">${icon(k)}<em>${esc(label(k))}</em><b>${n[k] || 0}</b></button>`).join('')
    + (allOn ? '' : `<button class="all" data-all="on">Show all</button>`);
}
function tlTypesClick(e) {
  const b = e.target.closest('button');
  if (!b) return;
  if (TL.show !== 'all') TL.show = 'all';  // a kind filter means everyone again, not one buck
  const keys = tlTypeKeys();
  if (b.dataset.all) TL.hide = new Set(b.dataset.all === 'on' ? [] : keys);
  else if (e.altKey || e.metaKey) TL.hide = new Set(keys.filter(k => k !== b.dataset.type));  // alt-click: only this kind
  else TL.hide.has(b.dataset.type) ? TL.hide.delete(b.dataset.type) : TL.hide.add(b.dataset.type);
  tlShow(TL.show);
}
const tlShows = a => TL.show === 'all' || (TL.show === 'bucks' ? a.kind === 'buck'
  : TL.show.startsWith('w:') ? a.kind === 'other' && a.animal === TL.show.slice(2) : a.buck === TL.show);

// Say what an animal really is: deer, or one of the wildlife kinds. Updates this page without reloading it.
function tlFixMenu(id) {
  const a = TL.data.animals.find(x => x.id === id), box = $('#tlm-fix');
  if (!a || !box) return;
  const cur = a.kind === 'other' ? a.animal : 'deer';

    .map(w => `<option value="${w.key}" ${w.key === cur ? 'selected' : ''}>${esc(w.label)}</option>`).join('')}</select></label>
    ${a.species ? `<span class="meta">The AI said “${esc(a.species)}”</span>` : ''}`;

function tlMapScene(sun, cover, dark, warm) {
  if (!TL.amb) return;
  const night = Math.min(1, Math.max(0, (-sun.alt + 1) / 9));  // starts dimming right at sunset
  $('#tl-map .leaflet-tile-pane').style.filter =
    `brightness(${(1 - .5 * night - .12 * cover).toFixed(3)}) saturate(${(1 - .55 * night - .3 * cover).toFixed(3)})`;
  TL.amb.querySelector('.tlm-shade').style.background = `rgba(10, 22, 60, ${(.38 * night).toFixed(3)})`;
  // low sun: warm light from its side of the map (north is up)
  const gx = 50 + 60 * Math.sin(rad(sun.az)), gy = 50 - 60 * Math.cos(rad(sun.az));
  TL.amb.querySelector('.tlm-glow').style.background = warm > .02
    ? `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,150,80,${(warm * .38).toFixed(3)}), transparent 75%)` : 'none';
  TL.amb.querySelector('.tlm-clouds').style.opacity = (cover * .22 * (1 - .7 * dark)).toFixed(3);
}

// The camera card's readout at time t. Battery and signal come with each photo from Reveal; the delay is
// how long after the photo was taken it reached Reveal (cameras that batch their uploads run hours behind).
const TL_DIAG_SVG = {
  shot: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5h2l1.2-1.8h4.6l1.2 1.8h2v7h-11z"/><circle cx="8" cy="8.8" r="2.3"/></svg>',
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7 8 3.5 11.5 7"/></svg>',
  busy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5h12M4 12.5V9M7 12.5V5M10 12.5V7.5M13 12.5V3.5"/></svg>',
};
const tlDur = s => s < 60 ? `${Math.max(0, Math.round(s))}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`;
function tlDiag(el, c, t, p) {
  const rows = TL.health[c.camera_id]?.photos || [], h = rows[tlBisect(rows, t + 1, r => r[0]) - 1];
  const cur = h || null;  // the camera's last readout at or before t (battery and signal change slowly, so an older one still counts)
  const ago = p ? (t - p[0]) / 1000 : null;
  const n24 = c.photos.length ? tlBisect(c.photos, t + 1, x => x[0]) - tlBisect(c.photos, t - DAY, x => x[0]) : 0;
  const bat = cur?.[1], sig = cur?.[2], late = cur?.[3];
  const sigWord = sig == null ? '' : ['None', 'Weak', 'Fair', 'Good', 'Strong'][Math.max(0, Math.min(4, sig))];
  const key = [p?.[0], cur?.[0], n24, Math.floor((ago ?? 0) / 60)].join();
  if (el.dataset.diag === key) return;
  el.dataset.diag = key;
  // signal and battery in the card's top-right, like a phone; the rest is in the Engine Room
  const st = el.querySelector('.tlm-st');
  st.classList.toggle('off', !cur); st.classList.toggle('low', bat != null && bat <= 20); st.classList.toggle('mid', bat != null && bat > 20 && bat <= 50);
  st.title = cur ? `Signal ${sigWord || '?'} · battery ${bat ?? '?'}%${t - cur[0] > 6 * HOUR ? ` (as of ${tlDur((t - cur[0]) / 1000)} earlier)` : ''}${late == null ? '' : ` · reached Reveal ${tlDur(late)} after it was taken`} · ${n24} photos in the last 24 h` : 'No readout yet';
  st.innerHTML = `<span class="tlm-bars">${[1, 2, 3, 4].map(i => `<i class="${sig >= i ? 'on' : ''}" style="height:${2 + i * 2.2}px"></i>`).join('')}</span>
    <span class="tlm-batt"><i style="width:${Math.max(0, Math.min(100, bat ?? 0))}%"></i></span>`;
}
// Battery, signal and upload delay for the camera cards. Optional: without them the cards are just the photo.
async function tlHealth() {
  try { TL.health = (await api(`/api/camera-health?days=${TL.days}`)).cameras; } catch { TL.health = null; }
  if (view !== 'timeline' || !$('#tl')) return;
  $('#tl').classList.toggle('health', !!TL.health);
  if (TL.pins) for (const p of Object.values(TL.pins)) delete p.el.dataset.diag;
  tlPlaceCards();

  // counts that don't know about this queue came from somewhere else (the local mirror's own database): don't show them
  sw = { items, named, stats: stats && !(stats.waiting === 0 && items.length) ? stats : null, cands: {}, cmp: {}, piles: {}, saved: 0, done: 0, preview: false, busy: false };
  swRender();
}
async function swCompare(d, b) {  // a buck's photos, most alike first
  const key = `${d.id}:${b.id}`;
  return sw.cmp[key] ??= api(`/api/detections/${d.id}/compare/${b.id}`).then(r => r.photos || []).catch(() => []);
}
function swDeck() {  // three little card piles: waiting, decided today, decided in all (everyone's decisions)

  const today = st ? st.today + sw.saved : null, total = st ? st.total + sw.saved : null, mine = st ? st.mine_today + sw.saved : null;
  const pile = (cls, num, label, sub, layers) => `<div class="sw-stat ${cls}"><div class="sw-stack">${'<i></i>'.repeat(layers)}<b>${num}</b></div><span>${label}</span><small>${sub}</small></div>`;
  const photos = swPhotos();
  return `<div class="sw-deck">${pile('wait', n(sw.items.length), 'To review', sw.items.length ? `visit${sw.items.length === 1 ? '' : 's'} · ${n(photos)} photo${photos === 1 ? '' : 's'}` : 'all caught up', Math.min(2, Math.ceil(sw.items.length / 20)))}
    ${pile('today', n(today), 'Reviewed today', !st ? 'after the server update' : mine ? `${mine} by you` : 'everyone', 2)}
    ${pile('total', n(total), 'Total reviewed', !st ? 'after the server update' : 'all of you', 2)}</div>`;
}
const swPhotos = () => sw.items.reduce((n, d) => n + d.group.length, 0);
function swStats() {
  return `<div class="sw-strip">${sw.done ? `<span class="sess"><b>${sw.done}</b>reviewed this session${sw.preview ? ' · preview, not saved' : ''}</span>` : ''}<a class="sw-grid" data-go="review">Grid view</a></div>`;
}
async function swRender() {
  const d = sw.items[0];
  if (!d) { $('#main').innerHTML = `<div class="swr">${swStats()}${swDeck()}<div class="sw-empty"><b>All caught up</b><span>No buck photos waiting. New ones land here after the next check.</span><button class="btn" data-go="home">Back to Home</button></div></div>`; return; }
  // the lineup: every named buck, same size, a fixed order (alphabetical) so nothing nudges the pick
  const bucks = sw.named.slice().sort((a, b) => a.name.localeCompare(b.name));
  const refs = await Promise.all(bucks.map(b => swCompare(d, b)));
  if (view !== 'swipe' || sw.items[0] !== d) return;
  if (sw.card !== d.id) { sw.card = d.id; sw.pick = null; sw.ri = {}; sw.none = false; }
  const next = sw.items[1]; if (next) { new Image().src = next.crop; bucks.forEach(b => swCompare(next, b)); }
  const t = Date.parse(d.taken_utc), rack = d.rack ? rackLine(d.rack) : '', pick = bucks.find(b => b.id === sw.pick);
  const clock = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const when = ms => `${new Date(ms).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${clock(ms)}`;
  const g = d.group, times = g.map(x => Date.parse(x.taken_utc)), t0 = Math.min(...times), t1 = Math.max(...times);

      <button data-sw-split title="Decide on these photos one at a time">Not all the same buck?</button></div>
      <div class="sw-thumbs">${g.map((x, i) => `<img src="${x.crop}" data-crop="${x.crop}" data-full="${x.photo}" class="${i ? '' : 'on'}" loading="lazy" alt="">`).join('')}</div></div>` : '';
  const lineup = bucks.map((b, i) => { const rs = refs[i], ri = (sw.ri[b.id] || 0) % Math.max(1, rs.length), r = rs[ri];
    return `<div class="sw-l${sw.pick === b.id ? ' on' : ''}" data-bid="${b.id}"><div class="sw-lph">${r ? `<img src="${r.crop}" alt="" loading="lazy">` : b.thumb ? `<img src="${b.thumb}" alt="">` : ''}
        ${rs.length > 1 ? `<button class="sw-ln prev" data-flip="${b.id}" data-d="-1" aria-label="Previous photo">‹</button><button class="sw-ln next" data-flip="${b.id}" data-d="1" aria-label="Next photo">›</button><span class="sw-lc">${ri + 1}/${rs.length}</span>` : ''}
        <i class="sw-chk">✓</i>${sw.piles[b.id] ? `<em class="pile">${sw.piles[b.id]}</em>` : ''}</div>
      <b>${esc(b.name)}</b></div>`; }).join('');
  $('#main').innerHTML = `<div class="swr">${swStats()}
    <div class="sw-main">
      <div class="sw-left">
        <div class="sw-card" id="sw-card"><div class="sw-ph" style="--bg:url('${d.crop}')"><img src="${d.crop}" data-crop="${d.crop}" data-full="${d.photo}" alt="" draggable="false">
          <button class="sw-flip">Full photo</button><div class="sw-cap"><b>${esc(d.camera)}</b><span>${span}</span></div><div class="sw-stamp"></div></div>
          ${visit}${d.summary || rack ? `<div class="sw-ai"><em>AI read</em>${esc(d.summary || '')}${rack ? `<small>${esc(rack)}</small>` : ''}</div>` : ''}</div>
        ${swDeck()}
      </div>
      <div class="sw-right"><div class="sw-h">The lineup<span>tap the buck it is · flip through his photos</span></div><div class="sw-lineup">${lineup}</div>
        <div class="sw-act">
          <button class="sw-yes" data-sw-yes ${pick ? '' : 'disabled'}><span>✓</span>${pick ? `It’s ${esc(pick.name)}` : 'Pick a buck'}</button>
          <button class="sw-young" data-sw-young title="A young buck nobody’s going to name: out of Review for good, still counted as a buck"><span>↓</span><b>Young<em class="long"> buck</em></b></button>
          <button class="sw-no${sw.none ? ' on' : ''}" data-sw-none><span>✕</span><b>None<em class="long"> of these</em></b></button>
        </div>
        <div class="sw-other${sw.none ? ' open' : ''}">${SW_OTHER.map(([k, l]) => `<button class="sw-o" data-sw-animal="${k}">${l}</button>`).join('')}
          <button class="sw-o bad" data-sw-bad>Bad photo</button><button class="sw-o" data-sw-skip>Skip for now</button></div>
      </div>
    </div></div>`;
  const card = $('#sw-card'), img = card.querySelector('img');
  const ids = g.map(x => x.id);
  card.querySelectorAll('.sw-thumbs img').forEach(th => th.onclick = e => {  // look at another photo of the visit
    e.stopPropagation(); card.querySelectorAll('.sw-thumbs img').forEach(x => x.classList.toggle('on', x === th));
    const full = card.classList.contains('full'); img.dataset.crop = th.dataset.crop; img.dataset.full = th.dataset.full;
    img.src = full ? th.dataset.full : th.dataset.crop; card.querySelector('.sw-ph').style.setProperty('--bg', `url('${th.dataset.crop}')`);
  });
  const split = $('[data-sw-split]');
  if (split) split.onclick = () => { sw.items.splice(0, 1, ...g.map(x => ({ ...x, visit: null, group: [x] }))); swRender(); };
  card.querySelector('.sw-flip').onclick = e => { e.stopPropagation(); const full = img.src.endsWith(img.dataset.full); img.src = full ? img.dataset.crop : img.dataset.full; e.target.textContent = full ? 'Full photo' : 'Close-up'; card.classList.toggle('full', !full); };
  $$('[data-flip]').forEach(el => el.onclick = e => { e.stopPropagation(); const id = Number(el.dataset.flip), n = refs[bucks.findIndex(b => b.id === id)].length; sw.ri[id] = ((sw.ri[id] || 0) + Number(el.dataset.d) + n) % n; swRender(); });
  $$('.sw-l').forEach(el => el.onclick = () => { const id = Number(el.dataset.bid); sw.pick = sw.pick === id ? null : id; sw.none = false; swRender(); });
  $('[data-sw-yes]').onclick = () => pick && swDecide(pick.name, 'pile', () => post('/api/detections/assign', { ids, buck_id: pick.id }), pick.id);
  $('[data-sw-young]').onclick = () => swDecide('Young buck', 'right', () => post('/api/detections/untrack', { ids }));
  $('[data-sw-none]').onclick = () => { sw.none = !sw.none; sw.pick = null; swRender(); };
  $$('[data-sw-animal]').forEach(el => el.onclick = () => swDecide(el.textContent, 'right', () => Promise.all(ids.map(id => post(`/api/detections/${id}/animal`, { animal: el.dataset.swAnimal })))));
  $('[data-sw-bad]').onclick = () => swDecide('Bad photo', 'left', () => post('/api/detections/reject', { ids }));
  $('[data-sw-skip]').onclick = () => swSkip('left');
}
function swFly(label, dir, buckId) {
  const card = $('#sw-card'); if (!card) return Promise.resolve();
  card.querySelector('.sw-stamp').textContent = label; card.classList.add('stamping'); card.classList.toggle('yes', dir === 'pile');
  const pile = buckId && $(`.sw-l[data-bid="${buckId}"] .sw-lph`);
  if (dir === 'pile' && pile) {  // into that buck's pile in the lineup
    const a = card.getBoundingClientRect(), z = pile.getBoundingClientRect();
    card.style.transition = 'transform .45s cubic-bezier(.5,0,.2,1), opacity .45s';
    card.style.transform = `translate(${z.left + z.width / 2 - (a.left + a.width / 2)}px, ${z.top + z.height / 2 - (a.top + a.height / 2)}px) scale(${(z.width / a.width).toFixed(2)}) rotate(6deg)`;
    card.style.opacity = '.15'; pile.parentElement.classList.add('catch');
    return new Promise(r => setTimeout(r, 460));
  }
  card.classList.add(`fly-${dir === 'pile' ? 'right' : dir}`); card.style.transform = '';
  return new Promise(r => setTimeout(r, 260));
}
async function swSkip(dir) {
  if (sw.busy || !sw.items.length) return; sw.busy = true;
  await swFly('Skip', dir); sw.items.push(sw.items.shift()); sw.busy = false; swRender();
}
async function swDecide(label, dir, save, buckId) {
  if (sw.busy || !sw.items.length) return; sw.busy = true;
  const d = sw.items.shift(), saving = save().then(() => { sw.saved += d.group.length; }).catch(e => {
    if (e.status === 403 && /read-only/i.test(e.detail || '')) { if (!sw.preview) toast('Preview only: this is the read-only copy of deerdar.com, so choices aren’t saved.', 6000); sw.preview = true; return; }
    sw.items.unshift(d); toast(`Couldn’t save that: ${esc(e.detail || e.message)}`);
  });
  await swFly(label, dir, buckId); sw.done += d.group.length; if (buckId) sw.piles[buckId] = (sw.piles[buckId] || 0) + d.group.length;
  await saving; sw.busy = false;
  $('#rcount').textContent = swPhotos() || ''; swRender();
}

// ------------------------------------------------------------------ engine room (calendar of what came in)
// Every day the cameras sent photos: how many, and how many bucks, does and fawns were in them. Days are
// the cameras' own calendar days. Shade is photo count (one blue ramp, darker = more).

const ER_KINDS = { buck: ['Bucks', '#b7791f'], doe: ['Does', '#c0625a'], fawn: ['Fawns', '#a8843f'] };
const ER_CAM_SVG = CAM_SVG;
const ER_RAMP = ['#e3eefc', '#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef'];  // light steps of the blue ramp, so text stays dark and readable
let er = null;

async function showEngine() {
  const [data, health, placed] = await Promise.all([api('/api/engine'), api('/api/camera-health?days=30').catch(() => null),
                                                   api(`/api/map?season=${season()}`).catch(() => null)]);
  if (view !== 'engine') return;
  data.health = health?.cameras || null;
  data.placed = Object.fromEntries((placed?.cameras || []).map(c => [c.camera_id, c.lat != null ? { heading: c.heading } : null]));
  const months = [...new Set(data.days.map(d => d.date.slice(0, 7)))];
  er = { data, months, month: er?.month && months.includes(er.month) ? er.month : months.at(-1), sel: er?.sel ?? data.days.at(-1)?.date,
         byDate: Object.fromEntries(data.days.map(d => [d.date, d])), max: Math.max(1, ...data.days.map(d => d.photos)), codes: erCodes(data.cameras) };
  renderEngine();
}

const erIcon = (k, color) => TL_SVG[k].replace('<svg ', `<svg style="color:${color}" `);
const erShade = n => n ? ER_RAMP[Math.min(ER_RAMP.length - 1, Math.floor(Math.sqrt(n / er.max) * ER_RAMP.length))] : null;
const erFmt = n => n.toLocaleString('en-US');
// Short camera codes for the calendar: one-word names stay (up to 5 letters), longer ones become their
// initials plus any number, e.g. "Harry’s Oats" -> HO, "Ken’s tactacam 1" -> KT1. Made unique if two collide.
const ER_DOTS = ['#2a78d6', '#e07b1f', '#7c5cd6', '#1f9e74', '#d6456b', '#9a8a12', '#4a90b8', '#b8509a'];
// Camera health: each camera as of its newest photo. Signal and battery come with every photo; the
// upload delay is the median over its last day (so one slow photo doesn't paint the camera as late).
function erCams() {
  const h = er.data.health, cams = er.data.cameras;
  if (!h || !cams.length) return '';
  const now = Date.now();
  const med = xs => { const a = xs.filter(x => x != null).sort((p, q) => p - q); return a.length ? a[(a.length - 1) >> 1] : null; };
  const stat = (cls, icon, val, label) => `<div class="${cls}">${icon}<b>${val}</b>${label}</div>`;
  const canPlace = !DEMO && can('member');
  return `<div class="er-h2">Cameras <span>as of each one's last photo</span></div><div class="er-hcs">${cams.map((c, i) => {
    const d = h[c.camera_id], ps = d?.photos || [], last = ps.at(-1), color = TL_CAM_COLORS[i % TL_CAM_COLORS.length];
    const day = ps.filter(p => last && p[0] > last[0] - DAY), late = med(day.map(p => p[3])), bat = last?.[1], sig = last?.[2];
    const ago = last ? (now - last[0]) / 1000 : null, per = ps.length ? ps.length / Math.max(1, (ps.at(-1)[0] - ps[0][0]) / DAY) : 0;
    const hw = d?.hardware ? `Reveal ${d.hardware}` : 'Reveal';
    const on = er.data.placed?.[c.camera_id];
    const placeRow = canPlace ? `<span class="place-row"><button class="place" data-go="place" data-cam="${esc(c.camera_id)}" title="${on ? 'Move this camera on the map' : 'Put this camera on the map'}">${on ? 'Move' : 'Place on map'}</button>${on ? `<button class="place" data-go="place" data-cam="${esc(c.camera_id)}~aim" title="Which way it faces">${on.heading != null ? `Facing ${cardinal(on.heading)}` : 'Aim'}</button>` : ''}</span>` : '';
    return `<div class="er-hc"><div class="pic">${ER_CAM_SVG}</div><div class="er-hwho"><b><i style="background:${color}"></i>${esc(c.name || c.camera_id)}</b>
      <small>${hw} · ${last ? `last photo ${ago < 3600 ? `${Math.max(1, Math.round(ago / 60))} min` : tlDur(ago)} ago` : 'no photos in 30 days'}</small>
      <div class="stats">
        ${stat(sig != null && sig <= 1 ? 'warn' : '', `<span class="tlm-bars">${[1, 2, 3, 4].map(k => `<i class="${sig >= k ? 'on' : ''}" style="height:${2 + k * 2.2}px"></i>`).join('')}</span>`,
               sig == null ? '–' : ['None', 'Weak', 'Fair', 'Good', 'Strong'][Math.max(0, Math.min(4, sig))], '')}
        ${stat(bat != null && bat <= 20 ? 'low' : bat != null && bat <= 50 ? 'mid' : '', `<span class="tlm-batt"><i style="width:${Math.max(0, Math.min(100, bat ?? 0))}%"></i></span>`, bat == null ? '–' : `${bat}%`, '')}
        ${stat(late != null && late > 3600 ? 'warn' : '', TL_DIAG_SVG.up, late == null ? '–' : `+${tlDur(late)}`, 'to Reveal')}
        ${stat('', TL_DIAG_SVG.busy, Math.round(per), '/ day')}
      </div>${placeRow}</div></div>`;
  }).join('')}</div>`;
}
function erCodes(cams) {
  const seen = {};
  return cams.map(c => {
    const words = (c.name || c.camera_id).replace(/[’']s\b/gi, '').split(/\s+/).filter(Boolean);
    let code = words.length === 1 ? words[0].slice(0, 5) : words.map(w => /^\d+$/.test(w) ? w : w[0].toUpperCase()).join('');
    seen[code] = (seen[code] || 0) + 1;
    return seen[code] > 1 ? `${code}${seen[code]}` : code;
  });
}

function renderEngine() {
  const { data } = er, t = data.totals;
  if (!data.days.length) { $('#main').innerHTML = '<h1 class="title">Engine Room</h1><div class="empty">No photos yet. Sync from Reveal first.</div>'; return; }
  const labeled = t.buck + t.doe + t.fawn + t.other;
  const tile = (n, label, extra = '') => `<div class="er-tile"><b>${erFmt(n)}</b><span>${label}</span>${extra}</div>`;
  $('#main').innerHTML = `<h1 class="title" style="display:flex;align-items:center;gap:14px">Engine Room <button class="btn small" id="er-sync">↻ Check for new photos</button></h1>
    <div class="er"><div class="er-sub">What's come in from Reveal, day by day. Pick a day for its cameras and hours.</div>
    <div class="er-tiles">
      ${tile(t.photos, `Photos over ${t.days} days`)}
      ${tile(t.detected, 'Checked for animals', `<div class="er-tbar"><i style="width:${(100 * t.detected / Math.max(1, t.photos)).toFixed(1)}%"></i></div>`)}
      ${tile(t.animals, 'Animals found')}
      ${Object.entries(ER_KINDS).map(([k, [label, c]]) => tile(t[k], `${erIcon(k, c)}${label}`)).join('')}
    </div>
    <div class="er-wrap"><section id="er-calwrap"></section><div class="er-col">${erCams()}<aside class="er-side" id="er-side"></aside></div></div>
    ${!labeled && t.animals ? `<div class="er-note">${erFmt(t.animals)} animals are waiting to be labeled. Bucks, does and fawns are counted once an AI key is added in Settings.</div>` : ''}
    <div class="er-note">A sighting is one deer in one photo, so a buck that stays for ten photos counts ten times. Named bucks are listed per day once you've named them in Review.</div>
    </div>`;
  renderCalendar();
  renderDay();
  $('#er-sync').onclick = () => $('#sync').click();
}

function renderCalendar() {
  const [y, m] = er.month.split('-').map(Number), first = new Date(Date.UTC(y, m - 1, 1)), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const i = er.months.indexOf(er.month), lead = first.getUTCDay();
  const cells = [];
  for (let k = 0; k < lead; k++) cells.push('<div class="er-day out"></div>');
  for (let dd = 1; dd <= days; dd++) {
    const key = `${er.month}-${String(dd).padStart(2, '0')}`, d = er.byDate[key];
    if (!d) { cells.push(`<div class="er-day none"><span class="er-n">${dd}</span></div>`); continue; }
    // Compact: date and buck/doe marks on top, then one line per camera: photos, checked, percent checked.
    const pct = (n, of) => of ? Math.floor(100 * n / of) : 0;
    const marks = (d.buck ? `<span class="er-mk" title="${erFmt(d.buck)} buck sightings">${erIcon('buck', ER_KINDS.buck[1])}${erFmt(d.buck)}</span>` : '')
      + (d.doe ? `<span class="er-mk" title="${erFmt(d.doe)} doe sightings">${erIcon('doe', ER_KINDS.doe[1])}${erFmt(d.doe)}</span>` : '');
    // Same row order every day, so a camera is always on the same line.
    const rows = er.data.cameras.map((c, j) => {
      const n = d.cams[j], done = d.cams_detected[j], pc = pct(done, n);
      return `<span class="er-row${n && pc === 100 ? ' done' : ''}${n ? '' : ' nil'}" title="${esc(c.name)}: ${erFmt(n)} photos, ${erFmt(done)} checked (${pc}%)">
        <i style="width:${n ? pc : 0}%"></i><b><u style="background:${ER_DOTS[j % ER_DOTS.length]}"></u>${esc(er.codes[j])}</b>${n ? `<em>${erFmt(done)}/${erFmt(n)}</em><em>${pc}%</em>` : '<em>—</em><em></em>'}</span>`;
    }).join('');
    cells.push(`<button class="er-day${key === er.sel ? ' sel' : ''}" data-day="${key}" style="--heat:${erShade(d.photos)}">
      <span class="er-top"><span class="er-n">${dd}</span><span class="er-marks">${marks}</span></span>
      <span class="er-tot">${erFmt(d.photos)}<small> photos</small><small class="er-totp">${pct(d.detected, d.photos)}%</small></span>
      <span class="er-rows">${rows}</span></button>`);
  }
  const label = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  $('#er-calwrap').innerHTML = `<div class="er-head"><h2>${label}</h2>
      <button class="er-nav" data-month="-1" ${i <= 0 ? 'disabled' : ''} title="Previous month">‹</button>
      <button class="er-nav" data-month="1" ${i >= er.months.length - 1 ? 'disabled' : ''} title="Next month">›</button>
      <div class="er-scale">Fewer photos ${ER_RAMP.map(c => `<i style="background:${c}"></i>`).join('')} More</div></div>
    <div class="er-key">${er.data.cameras.map((c, j) => `<span class="er-cam-key"><u style="background:${ER_DOTS[j % ER_DOTS.length]}"></u><b>${esc(er.codes[j])}</b> ${esc(c.name || c.camera_id)}</span>`).join('')}</div>
    <div class="er-key">Each line is <b>checked for animals / photos</b> and <b>% checked</b>; the fill turns green when a camera's day is done. ${erIcon('buck', ER_KINDS.buck[1])} marks a day with a buck.</div>
    <div class="er-cal">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="er-dow">${d}</div>`).join('')}${cells.join('')}</div>`;
  $$('#er-calwrap [data-month]').forEach(b => b.onclick = () => { er.month = er.months[i + Number(b.dataset.month)]; renderCalendar(); });
  $$('#er-calwrap [data-day]').forEach(b => {
    b.onclick = () => { er.sel = b.dataset.day; renderCalendar(); renderDay(); };
    b.onmousemove = e => {
      const d = er.byDate[b.dataset.day], tip = $('#tip');
      tip.innerHTML = `<b>${erLong(d.date)}</b><br>${erFmt(d.photos)} photos${er.data.cameras.map((c, j) => d.cams[j] ? `<br>${esc(c.name)}: ${erFmt(d.cams[j])}` : '').join('')}`;
      tip.style.display = 'block'; tip.style.left = `${Math.min(innerWidth - 270, e.clientX + 14)}px`; tip.style.top = `${e.clientY + 14}px`;
    };
    b.onmouseleave = () => { $('#tip').style.display = 'none'; };
  });
}

const erLong = key => new Date(`${key}T12:00:00Z`).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });

function renderDay() {
  const d = er.byDate[er.sel], side = $('#er-side');
  if (!d) { side.innerHTML = '<div class="meta">Pick a day.</div>'; return; }
  const camMax = Math.max(1, ...d.cams), hMax = Math.max(1, ...d.hours);
  const hourLabel = h => `${(h % 12) || 12} ${h < 12 ? 'AM' : 'PM'}`;
  side.innerHTML = `<h3>${erLong(d.date)}</h3>
    <div class="meta">${erFmt(d.photos)} photos · ${erFmt(d.animals)} animals found${d.detected < d.photos ? ` · ${erFmt(d.photos - d.detected)} photos not checked yet` : ''}</div>
    <div class="er-counts">${Object.entries(ER_KINDS).map(([k, [label, c]]) => `<div><b>${erFmt(d[k])}</b><span>${erIcon(k, c)}${label}</span></div>`).join('')}
      <div><b>${erFmt(d.unlabeled + d.other)}</b><span>${erIcon('animal', '#6a7079')}Other</span></div></div>
    <h4>Photos by camera</h4>
    ${er.data.cameras.map((c, j) => `<div class="er-cam"><span>${esc(c.name || c.camera_id)}</span><div><i style="width:${100 * d.cams[j] / camMax}%"></i></div><em>${erFmt(d.cams[j])}</em></div>`).join('')}
    <h4>Photos by hour</h4>
    <div class="er-hours">${d.hours.map((n, h) => `<i style="height:${100 * n / hMax}%" data-h="${h}" data-n="${n}"></i>`).join('')}</div>
    <div class="er-hlabels"><span>12 AM</span><span>6 AM</span><span>Noon</span><span>6 PM</span><span>11 PM</span></div>
    ${d.named.length ? `<h4>Named bucks</h4><div class="er-named">${d.named.map(([n, c]) => `<span>${esc(n)} · ${c}</span>`).join('')}</div>` : ''}
    <button class="btn primary er-open" id="er-open">Open this day in Timeline</button>`;
  $('#er-open').onclick = () => go('map', d.noon_ms);
  $$('.er-hours i').forEach(b => {
    b.onmousemove = e => { const tip = $('#tip'); tip.innerHTML = `${hourLabel(+b.dataset.h)}: ${erFmt(+b.dataset.n)} photos`; tip.style.display = 'block'; tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY - 34}px`; };
    b.onmouseleave = () => { $('#tip').style.display = 'none'; };
  });
}

const sinceText = iso => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 6e4);
  return m < 60 ? 'in the last hour' : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
};

async function loadPeople() {
  const box = $('#s-people');
  if (!box) return;
  const { members, invites, me: myId } = await api('/api/members');
  const roleSelect = m => `<select data-member="${m.id}" style="flex:0 0 auto" ${m.id === myId ? 'disabled title="Ask another owner to change your role"' : ''}>${ROLES.map(r =>
    `<option value="${r}" ${m.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select>`;
  box.innerHTML = `<h3>People</h3>
    <div class="meta">Viewers look. Members also review photos and name and tag bucks. Owners also handle the Reveal login, settings, camera pins and people.</div>
    ${members.map(m => `<div class="row person"><label title="${esc(m.username)}">${esc(m.name)}</label>${roleSelect(m)}
      ${m.id !== myId ? `<button class="act" data-remove="${m.id}">Remove</button>` : ''}
      ${can('admin') ? `<button class="act" data-reset="${m.id}" title="For a forgotten password">New-password link</button>` : ''}
      <span class="meta">${m.id === myId ? 'you' : m.last_seen ? `seen ${sinceText(m.last_seen)}` : 'hasn’t signed in yet'}</span></div>`).join('')
      || '<div class="meta">Nobody has joined yet.</div>'}
    <div class="row"><label>Invite someone</label><input id="pp-note" placeholder="Who it's for, e.g. Dad">
      <select id="pp-role" style="flex:0 0 auto">${ROLES.map(r => `<option value="${r}" ${r === 'member' ? 'selected' : ''}>as ${r}</option>`).join('')}</select>
      <button class="act primary" id="pp-invite">Make link</button></div>
    <div id="pp-link"></div>
    ${invites.length ? `<div class="meta">Links not used yet</div>${invites.map(i => `<div class="row"><label>${esc(i.note || 'Unnamed')}</label>
      <span class="meta" style="flex:1">${esc(i.role)} · until ${esc(new Date(i.expires).toLocaleDateString())}</span>
      <button class="act" data-revoke="${i.id}">Cancel link</button></div>`).join('')}` : ''}
    <div class="row"><label></label><span id="pp-msg" class="meta"></span></div>`;

function showLink(token, note) {
  const url = `${location.origin}${location.pathname}#join/${token}`;
  $('#pp-link').innerHTML = `<div class="row"><input id="pp-url" readonly value="${esc(url)}"><button class="act" id="pp-copy">Copy</button></div>
    <div class="meta">${esc(note)}</div>`;
  $('#pp-url').select();
}

function fillProvider() {
  const name = $('#ai-provider').value, p = cfg.providers[name], same = name === cfg.vision_provider;
  $('#ai-url-row').style.display = name === 'custom' ? '' : 'none';
  $('#ai-key').value = '';
  $('#ai-key').placeholder = p.key ? `Using the key ${p.key === 'environment' ? 'from the environment' : 'saved in settings'}; paste to replace` : 'Paste API key';
  $('#ai-model').value = (same && cfg.vision_model) || '';
  $('#ai-model').placeholder = p.model ? `default: ${p.model}` : 'load models and pick one';
  $('#ai-fast').value = (same && cfg.vision_fast_model) || '';
  $('#ai-fast').placeholder = p.fast ? `default: ${p.fast}` : 'optional; defaults to the main model';
  $('#ai-models').innerHTML = '';
  $('#ai-msg').textContent = '';
}

// This month's AI spending (per model) and the months before, from the ranch's ai_usage table.
function aiUsage(u) {
  if (!u) return '';
  const usd = n => `$${n.toFixed(2)}`, m = u.this_month;
  const models = m.models.map(x => `${esc(x.model)} ${usd(x.cost)}${x.priced ? '' : ' (estimated)'}, ${x.calls.toLocaleString('en-US')} calls`).join(' · ');
  const name = ym => new Date(`${ym}-15`).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  return `<b style="color:var(--ink)">${usd(m.cost)}</b> in ${name(m.month)}${u.limit ? ` of ${usd(u.limit)}` : ''}${models ? `: ${models}` : ''}`
    + (u.earlier.length ? `<br>${u.earlier.slice(0, 3).map(e => `${name(e.month)} ${usd(e.cost)}`).join(' · ')}` : '');
}

function aiProbe() {
  return { provider: $('#ai-provider').value, api_key: $('#ai-key').value, base_url: $('#ai-url').value,
           model: $('#ai-model').value || null };
}

// Each Reveal account with its cameras (uncheck one to skip it), and whether Reveal still has it signed in.
async function loadReveal(data) {
  const box = $('#rv-list');
  if (!box) return;
  const { connections } = data || await api('/api/reveal');
  box.innerHTML = connections.map(c => `<div class="rv-acct">
      <div class="row"><b style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis">${esc(c.email)}</b>
        ${c.status === 'ok' ? '<span class="ok">Connected</span>' : `<button class="act primary" data-resign="${esc(c.email)}">Sign in again</button>`}
        <button class="act" data-unlink="${esc(c.id)}">Remove</button></div>
      ${c.status !== 'ok' ? `<div class="bad" style="font-size:13px">${esc(c.error || 'Reveal signed this account out')}</div>` : ''}
      <div class="cams">${c.cameras.map(k => `<label class="${k.duplicate ? 'dup' : ''}"><input type="checkbox" data-cam="${esc(k.camera_id)}" ${k.included ? 'checked' : ''} ${k.duplicate ? 'disabled' : ''}>
        ${esc(k.name || k.camera_id)} <span class="meta">${k.duplicate ? 'also on an account above' : k.own ? 'own camera' : k.owner ? `shared by ${esc(k.owner)}` : ''}</span></label>`).join('')
        || '<div class="meta">No cameras yet; they show up after the next check for photos.</div>'}</div>
    </div>`).join('') || '<div class="meta">No Reveal account connected yet.</div>';
  $('#rv-label').textContent = connections.length ? 'Add another' : 'Add an account';
}

async function settingsClick(e) {
  const t = e.target;
  if (t.id === 'li-go') return signIn();
  if (t.id === 'jn-go') return joinGo();
  if (t.id === 'jn-signin') return showSignIn();
  if (t.id === 'acc-out') { await post('/api/logout'); return reloadTo('#home'); }
  if (t.id === 'acc-save' || t.id === 'acc-pass') {
    const body = t.id === 'acc-save' ? { name: $('#acc-name').value } : { password: $('#acc-old').value, new_password: $('#acc-new').value };
    try {
      await post('/api/account', body);
      $('#acc-msg').className = 'ok'; $('#acc-msg').textContent = t.id === 'acc-save' ? 'Saved' : 'Password changed; other devices are signed out';
      me = await api('/api/me');
      $('#acc-old').value = $('#acc-new').value = '';
    } catch (err) { $('#acc-msg').className = 'bad'; $('#acc-msg').textContent = err.detail || 'Not saved'; }
    return;
  }
  if (t.id === 'pp-invite') {
    const note = $('#pp-note').value.trim(), role = $('#pp-role').value;
    try {
      const r = await post('/api/invites', { role, note });
      await loadPeople();
      showLink(r.token, `Text this to ${note || 'them'}. It lets one person join as a ${role} and works for ${r.days} days.`);
    } catch (err) { $('#pp-msg').className = 'bad'; $('#pp-msg').textContent = err.detail || 'No link made'; }
    return;
  }
  if (t.id === 'pp-copy') {
    try { await navigator.clipboard.writeText($('#pp-url').value); t.textContent = 'Copied'; }
    catch { $('#pp-url').select(); t.textContent = 'Press Ctrl+C'; }
    return;
  }
  if (t.dataset.revoke) { await post(`/api/invites/${t.dataset.revoke}/revoke`); return loadPeople(); }
  if (t.dataset.remove) {
    if (!t.classList.contains('primary')) { t.classList.add('primary'); t.textContent = 'Tap again to remove'; return; }
    try { await post(`/api/members/${t.dataset.remove}`, { role: null }); } catch {}
    return loadPeople();
  }
  if (t.dataset.reset) {
    const name = t.closest('.person').querySelector('label').textContent;
    try {
      const r = await post(`/api/members/${t.dataset.reset}/reset`);
      showLink(r.token, `Send this to ${name}. It sets a new password, works once and lasts ${r.days} days.`);
    } catch {}
    return;
  }
  if (t.dataset.ranch) return switchRanch(t.dataset.ranch);
  if (t.id === 'rn-save' || t.id === 'rn-add') {
    const input = $(t.id === 'rn-save' ? '#rn-name' : '#rn-new'), name = input.value.trim();
    if (!name) return input.focus();
    try {
      if (t.id === 'rn-add') return switchRanch((await post('/api/ranches', { name })).id);  // opens its first-run setup
      await post('/api/ranch', { name });
      await loadRanches();
      $('#rn-msg').className = 'ok'; $('#rn-msg').textContent = 'Renamed';
    } catch (err) { $('#rn-msg').className = 'bad'; $('#rn-msg').textContent = err.detail || 'Not saved'; }
    return;
  }
  if (t.id === 'rv-signin') {
    const email = $('#rv-email').value.trim(), password = $('#rv-pass').value;
    if (!email || !password) { $('#rv-msg').className = 'bad'; $('#rv-msg').textContent = 'Enter the email and password.'; return; }
    t.disabled = true; $('#rv-msg').className = 'meta'; $('#rv-msg').textContent = 'Signing in…';
    try {
      const res = await post('/api/reveal/connections', { email, password });
      $('#rv-pass').value = $('#rv-email').value = '';
      const n = res.connections.find(c => c.email.toLowerCase() === email.toLowerCase())?.cameras.length ?? 0;
      $('#rv-msg').className = 'ok'; $('#rv-msg').textContent = `Connected ${email}; found ${n} camera${n === 1 ? '' : 's'}`;
      loadReveal(res);
    } catch (err) {
      $('#rv-msg').className = 'bad'; $('#rv-msg').textContent = err.detail || 'Sign-in failed';
    }
    t.disabled = false;
  }
  if (t.dataset.resign) { $('#rv-email').value = t.dataset.resign; $('#rv-pass').focus(); return; }
  if (t.dataset.unlink) {
    if (!t.classList.contains('primary')) { t.classList.add('primary'); t.textContent = 'Tap again: stop syncing it'; return; }
    return loadReveal(await post(`/api/reveal/connections/${t.dataset.unlink}/remove`));
  }
  if (t.id === 'ai-list') {
    t.disabled = true; $('#ai-msg').className = 'meta'; $('#ai-msg').textContent = 'Loading models…';
    try {
      const { models } = await post('/api/setup/ai/models', aiProbe());
      $('#ai-models').innerHTML = models.map(m => `<option value="${esc(m)}">`).join('');
      $('#ai-msg').textContent = `${models.length} models available; click a model box to pick one`;
    } catch (err) { $('#ai-msg').className = 'bad'; $('#ai-msg').textContent = err.detail || 'Failed'; }
    t.disabled = false;
  }
  if (t.id === 'ai-test') {
    t.disabled = true; $('#ai-msg').className = 'meta'; $('#ai-msg').textContent = 'Sending a test photo…';
    try {
      const r = await post('/api/setup/ai/test', aiProbe());
      $('#ai-msg').className = 'ok'; $('#ai-msg').textContent = `Works: ${r.model} answered in ${r.seconds}s ("${r.answer}")`;
    } catch (err) { $('#ai-msg').className = 'bad'; $('#ai-msg').textContent = err.detail || 'Test failed'; }
    t.disabled = false;
  }
  if (t.id === 'ai-save') {
    const name = $('#ai-provider').value;
    try {
      cfg = await post('/api/settings', { vision_provider: name, api_key: $('#ai-key').value, vision_model: $('#ai-model').value,
                                          vision_fast_model: $('#ai-fast').value, custom_base_url: $('#ai-url').value,
                                          ai_monthly_limit: Number($('#ai-limit').value) || 0 });
      fillProvider();
      $('#ai-usage').innerHTML = aiUsage(cfg.ai_usage);
      $('#ai-msg').className = 'ok'; $('#ai-msg').textContent = `Saved; using ${cfg.providers[name].label}`;
      watchJob();  // saving may have restarted work that was waiting on the AI
    } catch (err) { $('#ai-msg').className = 'bad'; $('#ai-msg').textContent = err.detail || 'Save failed'; }
  }
  if (t.id === 'ss-save') {
    const start = `${String($('#ss-month').value).padStart(2, '0')}-${String($('#ss-day').value).padStart(2, '0')}`;
    try {
      cfg = await post('/api/settings', { season_start: start, region: $('#ss-region').value.trim() || null,
                                          sync_interval_hours: Number($('#ss-interval').value),
                                          shooting_minutes: Number($('#ss-shoot').value), visit_gap_minutes: Number($('#ss-gap').value),
                                          review_days: Number($('#ss-review').value) });
      $('#ss-msg').className = 'ok'; $('#ss-msg').textContent = 'Saved';
      $('#season').value = ''; await loadSeasons();
    } catch (err) { $('#ss-msg').className = 'bad'; $('#ss-msg').textContent = err.detail || 'Save failed'; }
  }
  if (t.id === 'im-go') {
    const since = $('#im-since').value;
    if (!since) return $('#im-since').focus();
    await post('/api/settings', { setup_done: true });
    await post('/api/import', { since });
    $('#im-msg').className = 'ok'; $('#im-msg').textContent = 'Import started; progress shows at the top. You can start reviewing as crops come in.';
    watchJob();
  }
}

document.addEventListener('change', async e => {
  if (e.target.id === 'ai-provider') fillProvider();
  if (e.target.id === 'acc-theme') { localStorage.setItem('theme', e.target.value); setTheme(e.target.value); }
  if (e.target.id === 'merge-into') {
    const btn = $('[data-act="merge-buck"]');
    btn.disabled = !e.target.value;
    if (btn.dataset.sure) { delete btn.dataset.sure; btn.textContent = 'Merge into him'; }
  }
  if (e.target.dataset.member) {
    try {
      await post(`/api/members/${e.target.dataset.member}`, { role: e.target.value });
      $('#pp-msg').className = 'ok'; $('#pp-msg').textContent = 'Role changed';
    } catch { loadPeople(); }
  }
  if (e.target.id === 'map-buck') { mapBuck = e.target.value; showMap(); }
  if (e.target.id === 'feed-cam') { feedCam = e.target.value; showFeed(); }
  if (e.target.id === 'rv-sort') { localStorage.setItem('reviewSort', e.target.value); rv.i = 0; showReview(); }
  if (e.target.dataset.cam !== undefined && e.target.closest('#rv-list')) {
    loadReveal(await post('/api/reveal/cameras', { camera_id: e.target.dataset.cam, included: e.target.checked }));
  }
});

// ------------------------------------------------------------------ navigation (hash routes: #home, #feed, #map/<ms>, #photos, #engine, #bucks, #buck/2, #review/372, #place, #settings)

async function render() {
  const [v, a] = (location.hash.slice(1) || 'home').split('/');
  if (v === 'join' && a) return showJoin(a);
  if (!DEMO && !me?.user) return location.reload();  // e.g. back from a link page while signed out
  view = ['home', 'feed', 'map', 'timeline', 'photos', 'intel', 'bucks', 'buck', 'review', 'swipe', 'place', 'engine', 'settings'].includes(v) ? v : 'home';
  TL.wantMode = view === 'photos' ? 'cams' : 'map';
  if (view === 'photos' || view === 'map') view = 'timeline';  // the map and the photo list share the timeline's data
  if ((view === 'review' || view === 'swipe') && !DEMO && !can('member')) view = 'home';
  arg = a ?? null;
  const tab = view === 'timeline' ? (TL.wantMode === 'cams' ? 'photos' : 'map') : { feed: 'home', buck: 'bucks', review: 'swipe' }[view] || view;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === tab));
  $('#season').style.visibility = ['settings', 'timeline', 'engine', 'intel'].includes(view) ? 'hidden' : '';
  if (lmap && view !== 'place') { lmap.remove(); lmap = null; }
  if (view !== 'timeline') tlDestroy();
  document.body.classList.toggle('tl-on', view === 'timeline');
  const tlAgain = () => { tlSetMode(TL.wantMode); if (arg) { tlPlay(false); tlSeek(Number(arg)); } };
  const wait = setTimeout(() => { if (!$('.loader.page')) document.body.insertAdjacentHTML('beforeend', LOADER.replace('loader', 'loader page')); }, 150);
  try {
    if (view === 'buck') await showBuck(Number(arg));
    else await ({ home: showHome, feed: showFeed, timeline: TL.data && $('#tl') ? tlAgain : showTimeline, engine: showEngine, intel: showIntel, bucks: showBucks, review: showReview, swipe: showSwipe, place: showMap, settings: () => showSettings() }[view])();
  } finally { clearTimeout(wait); $('.loader.page')?.remove(); }
  refreshCounts();
}

const go = (v, id) => {
  const h = `#${v}${id != null ? `/${id}` : ''}`;
  if (location.hash === h) render(); else location.hash = h;
  scrollTo(0, 0);
};
addEventListener('hashchange', () => { closeReviewModal(false); render(); scrollTo(0, 0); });

document.addEventListener('click', async e => {
  const lbTag = e.target.closest('#lightbox .lb-tag');
  if (lbTag) { $('#lightbox').style.display = 'none'; return tagInModal(lbTag.dataset.det); }
  if (e.target.closest('#lightbox')) { $('#lightbox').style.display = 'none'; $('#lightbox .lb-tag').style.display = 'none'; return; }
  const img = e.target.closest('img[data-full]');
  if (img) { $('#lightbox img').src = img.dataset.full; $('#lightbox').style.display = 'flex'; return; }
  const nav = e.target.closest('[data-go]');
  if (nav) return go(nav.dataset.go, nav.dataset.cam);
  if (e.target.closest('[data-back]')) return history.length > 1 ? history.back() : go('bucks');
  if (e.target.closest('.settings')) return settingsClick(e);
  if (e.target.closest('.mapside button')) return mapClick(e);
  if (e.target.closest('.review')) return reviewClick(e);
  if (e.target.closest('.rvgrid')) return gridClick(e);
  if (e.target.id === 'job' && e.target.classList.contains('bad')) return go('settings');
  const feedBtn = e.target.closest('[data-feed]');
  if (feedBtn) { feedOnly = feedBtn.dataset.feed; return showFeed(); }
  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) { bucksFilter = filterBtn.dataset.filter; return showBucks(); }
  const rev = e.target.closest('[data-review]');
  if (rev) return go('review', rev.dataset.review);
  const btn = e.target.closest('button[data-act]');
  const buckEl = !btn && e.target.closest('[data-buck]');
  if (buckEl && !buckEl.classList.contains('buckpage')) return go('buck', buckEl.dataset.buck);
  if (!btn) return;

  const act = btn.dataset.act, buckId = Number($('.buckpage')?.dataset.buck);
  if (act === 'save-buck') {
    const box = $('#buck-edit');
    const name = $('input[data-name]', box).value.trim(), notes = $('input[data-notes]', box).value.trim();
    if (!name) return $('input[data-name]', box).focus();
    let res;
    try { res = await post(`/api/bucks/${buckId}`, { name, notes }); }
    catch (err) { $('#buck-saved').textContent = err.detail || 'Not saved (is that name already taken?)'; return; }
    if (res.merged_into) { watchJob(); return go('buck', res.merged_into); }
    if (res.searching) watchJob();
    await showBuck(buckId);
    $('#buck-saved').textContent = 'Saved';
    return;
  }
  if (act === 'not-a-buck') {
    btn.disabled = true;
    try {
      const r = await post(`/api/bucks/${buckId}/not-a-buck`, { sex: btn.dataset.sex });
      toast(`${r.relabeled} photo${r.relabeled === 1 ? '' : 's'} relabeled as ${btn.dataset.sex === 'doe' ? 'a doe' : 'a fawn'}`);
      return go('bucks');
    } catch (err) { btn.disabled = false; toast(err.detail || 'Not saved'); return; }
  }
  if (act === 'merge-buck') {
    const into = Number($('#merge-into').value), name = $('#merge-into').selectedOptions[0]?.textContent;
    if (!into) return;
    // a named buck's name, notes and status go away: ask for a second tap rather than a browser dialog
    if (!bucks.find(x => x.id === buckId)?.generic && !btn.dataset.sure) {
      btn.dataset.sure = 1; btn.textContent = `Tap again: ${$('.buckpage h2').textContent.trim()} becomes ${name}`;
      return;
    }
    btn.disabled = true;
    try { await post(`/api/bucks/${buckId}/merge`, { into }); }
    catch (err) { btn.disabled = false; $('#merge-out').textContent = err.detail || 'Not merged'; return; }
    watchJob();
    return go('buck', into);
  }
  if (act === 'set-tag') {
    const tag = btn.classList.contains('sel') ? null : btn.dataset.tag;  // tap again to clear
    await post(`/api/bucks/${buckId}/tag`, { tag });
    return showBuck(buckId);
  }
  if (act === 'save-status') {
    const box = $('#status-edit');
    try {
      const r = await post(`/api/bucks/${buckId}/status`, { status: $('[data-status]', box).value, date: $('[data-date]', box).value || null,
                                                            note: $('[data-note]', box).value });
      await showBuck(buckId);
      $('#status-saved').textContent = r.unassigned ? `Saved; ${r.unassigned} later auto-matches went back to Review` : 'Saved';
    } catch (err) { $('#status-saved').textContent = err.detail || 'Not saved'; }
    return;
  }
  if (act === 'save-season') {
    const box = btn.closest('.season-notes');
    await post(`/api/bucks/${buckId}`, { name: $('#buck-edit input[data-name]').value.trim() || bucks.find(x => x.id === buckId)?.name,
                                         notes: $('#buck-edit input[data-notes]').value.trim(),
                                         season: Number(box.dataset.season), season_notes: $('input', box).value });
    $('.meta', box).textContent = 'Saved';
    return;
  }
  if (act === 'group-returning') {
    btn.disabled = true;
    const b = await askReturning(Number(btn.dataset.det), $('#group-returning-out'));
    btn.disabled = false;
    if (b) $('#group-returning-out').textContent += ` If so, pick ${b.name} below.`;
    return;
  }
  const tile = btn.closest('[data-id]'), id = tile?.dataset.id;
  if (!id) return;
  if (act === 'accept') {
    const r = await post(`/api/detections/${id}/assign`, { buck_id: Number(btn.dataset.buck) });
    if (r.searching) watchJob();
    btn.remove(); tile.querySelector('.auto')?.remove();
  }
  if (act === 'unassign') { await post(`/api/detections/${id}/unassign`); tile.remove(); toast('Sent back to Review'); }
  refreshCounts();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const lb = $('#lightbox').style.display === 'flex';
    $('#lightbox').style.display = 'none'; $('#lightbox .lb-tag').style.display = 'none';
    if (!lb && !$('#cmp') && $('#rvm')) closeReviewModal();
  }
  if (e.key === 'Enter' && e.target.closest('#buck-edit')) $('[data-act="save-buck"]').click();
  if (e.key === 'Enter' && e.target.id === 'rv-name') saveReview();
  if (e.key === 'Enter' && e.target.id === 'rg-name') saveGrid();
  if (e.key === 'Enter' && e.target.closest('#s-login')) signIn();
  if (e.key === 'Enter' && e.target.closest('#s-join')) joinGo();
});

$('#season').addEventListener('change', () => render());
$('#sync').addEventListener('click', async () => {
  await post('/api/import', {});
  watchJob();
});

// Background work (imports, re-matching, the search after naming a buck). When it finishes the view
// refreshes, except mid-typing, so things don't move under the user.
let watching = false;
function agoText(t) {
  if (!t) return '';
  const m = Math.round((Date.now() / 1000 - t) / 60);
  return `Checked ${m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`}`;
}
async function watchJob() {
  if (watching) return;
  watching = true;
  $('#sync').disabled = true; $('#sync').classList.add('spin');
  let st, worked = false;
  try {
    for (;;) {
      st = await api('/api/identify');
      if (!st.running) break;
      worked = true;
      await new Promise(r => setTimeout(r, 3000));
    }
  } finally {
    watching = false;
    $('#sync').disabled = false; $('#sync').classList.remove('spin');
  }
  const last = st && st.last;
  if (last && !last.ok) {
    $('#job').className = last.setup ? 'bad' : '';
    $('#job').textContent = last.setup ? `${last.error} (open Settings)` : `${last.label} failed: ${last.error}`;
  } else if (!DEMO) {
    $('#job').className = ''; $('#job').textContent = '';
  }
  if (!worked) return;
  await loadSeasons();
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (view === 'settings' || typing) return refreshCounts();
  if (rvModal && view !== 'review') { rvModalDirty = true; return refreshCounts(); }  // don't redraw the page under the window
  if (view === 'review' && rvMode === 'grid') { if (rvModal) { rvModalDirty = true; return refreshCounts(); } await showReviewGrid(); refreshCounts(); }
  else if (view === 'review') { const id = rv.items[rv.i]?.id; await loadReview(id); renderReview(); refreshCounts(); }
  else render();
}

(async () => {
  if (DEMO) {
    // Read-only: no syncing or settings; a note under the header says where the data is from.
    $('#sync').style.display = $('[data-go="settings"]').style.display = 'none';
    document.body.classList.add('demo');
    $('#job').textContent = `Read-only demo with real trail-camera data from ${DEMO.exported}. Browse freely; changes aren’t saved.`;
    if (!DEMO.map) $$('[data-go="map"], [data-go="place"]').forEach(b => { b.style.display = 'none'; });
  }
  if (!DEMO) {
    me = await api('/api/me');
    const link = /^#join\/(.+)$/.exec(location.hash);
    if (link) return showJoin(link[1]);
    if (!me.user) return showSignIn();
    if (!me.ranches.length) return showNoRanch();
    document.body.classList.add(`role-${me.role}`);  // hides what this role can't do
  }
  await Promise.all([loadRanches(), loadSeasons()]);
  const [s, st] = DEMO ? [{}, {}] : await Promise.all([api('/api/settings'), api('/api/stats?season=all')]);
  if (!DEMO && !s.setup_done && st.photos === 0 && can('owner')) {
    $$('#tabs button').forEach(b => b.classList.remove('on'));
    await showSettings(true);
  } else {
    await render();
  }
  watchJob();
})();
</script>
