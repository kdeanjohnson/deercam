# The shared dev site (dev.<domain>): the `dev` branch, run next to the real site on the same server, with a
# nightly copy of its data minus the secrets. Its own checkout and .env live in /opt/deercam-dev; the real
# site's Caddy (docker-compose.yml) forwards dev.<domain> here. See deploy/README.md.
services:
  deercam-dev:
    build: .
    restart: unless-stopped
    container_name: deercam-dev
    env_file: .env
    environment:
      DATA_DIR: /data
      FORWARDED_ALLOW_IPS: "*"
      SYNC_INTERVAL_HOURS: "0"  # never checks Reveal: the real site does that
    volumes:
      - ./data:/data
    expose:
      - "8600"
    networks:
      - site

networks:
  site:
    name: deercam_default  # the real site's network, where its Caddy is
    external: true
